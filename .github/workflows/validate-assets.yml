name: Validate repository safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate repository safety boundary
        run: python scripts/validate_repository_safety.py
      - name: Install asset validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Validate YAML and asset integrity
        env:
          ASSET_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_asset_integrity.py
