name: Validate repository safety

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-safety:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate repository safety boundary
        run: python scripts/validate_repository_safety.py
      - name: Install asset validation dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-validation.txt
      - name: Check validation dependency compatibility
        run: python -m pip check
      - name: Run Ruff Phase 1 quality gate
        run: ruff check .
      - name: Validate YAML and asset integrity
        env:
          ASSET_VALIDATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: python scripts/validate_asset_integrity.py
      - name: Run Phase 1.5 synthetic final acceptance
        run: python scripts/validate_final_acceptance.py
      - name: Validate Weekly Acquisition Runtime contracts
        run: python scripts/validate_weekly_acquisition_runtime.py
      - name: Run Weekly Acquisition Runtime tests
        run: python -m unittest tests.test_weekly_acquisition_runtime
      - name: Run Pydantic integration parity tests
        run: python -m unittest tests.test_pydantic_integration
      - name: Run Ruff Phase 2A regression tests
        run: python -m unittest tests.test_ruff_phase2_regression
      - name: Run Ruff Phase 2B regression tests
        run: python -m unittest tests.test_ruff_phase2b_regression
      - name: Run Stage 3A CTV vertical slice tests
        run: python -m unittest tests.test_stage3a_ctv_vertical_slice
