config_type: analysis_request_contract_template
template_id: ARC_TEMPLATE_AD_HOC_ANALYSIS_V1
template_version: 1.0.1
status: confirmed_for_final_acceptance
owner: WORKFLOW_OWNER

analysis_request_contract:
  required_fields:
    request_id: { data_type: string, nullable: false }
    domain: { data_type: string, nullable: false }
    intent: { data_type: string, nullable: false }
    period: { data_type: object, nullable: false, required_fields: [start_date, end_date] }
    comparison: { data_type: object, nullable: false, required_fields: [mode] }
    dimensions: { data_type: array, item_type: string, nullable: false }
    metrics: { data_type: array, item_type: string, nullable: false }
    filters: { data_type: array, item_type: object, nullable: false }
    output: { data_type: object, nullable: false, required_fields: [format, audience] }
  optional_fields:
    capability_scope_id:
      data_type: string
      nullable: false
      role: Canonical DCP capability selector resolved during Brief understanding; not a business asset ID.
  brief_conversion:
    natural_language_brief_supported: true
    directly_parse_when_explicitly_expressed:
      - domain
      - period
      - comparison
      - filters
      - output
    canonical_resolution_from_registered_metadata:
      intent: DCP Registry intent metadata
      dimensions: DCP Registry and existing Dimension metadata
      metrics: DCP Registry and existing Metric or Metric Variant metadata
      capability_scope: DCP Registry capability_scope_id
    user_must_supply_metric_id: false
    user_must_supply_complete_dimensions_list: false
    semantic_brief_understanding_allowed: true
    business_asset_name_similarity_selection_allowed: false
    required_field_completion:
      request_id: generated_by_request_intake
      comparison_when_not_expressed: { mode: none }
      filters_when_not_expressed: []
      output_audience_when_not_expressed: WORKFLOW_OWNER
    conversion_stages:
      - stage: brief_understanding
        output: canonical ARC analytical metadata only
        may_select_dataset_query_mapping_rule_metric_or_contract: false
      - stage: capability_selection
        input: structured canonical ARC
        selection_method: exact DCP Registry metadata and registered asset IDs only
        name_similarity_inference_allowed: false
    prohibited_creation:
      unregistered_metric: true
      unregistered_business_rule: true
      unregistered_dimension: true
      unregistered_capability: true
    owner_confirmation_required_only_when:
      - no_unique_registered_canonical_match
      - business_definition_or_metric_semantics_are_ambiguous
      - requested_analysis_requires_a_new_business_definition
    owner_confirmation_not_required_for:
      - canonical metadata resolved uniquely from the DCP Registry
      - user omission of Metric IDs
      - user omission of the complete dimensions list
  lifecycle:
    one_time_brief_output: temporary_execution_plan
    creates_formal_workflow: false
    repeated_demand_action: Owner review decides whether a formal Workflow is warranted.
  boundaries:
    creates_metric_variant: false
    creates_business_rule: false
    creates_result_contract: false
    code_implementation_authorized: false
