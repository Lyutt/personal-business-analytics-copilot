config_type: customer_revenue_detail_synthetic_acceptance
suite_id: CUSTOMER_REVENUE_DETAIL_ACCEPTANCE_V1
suite_version: 1.0.0
workflow_id: WF_CUSTOMER_REVENUE_DETAIL
contains_real_business_data: false
external_side_effects_allowed: false
scenarios:
  - scenario_id: source_role_separation
    synthetic_input: { full_quarter_C: 120, comparable_K: 30, comparable_L: 20 }
    expected_result: { C: 120, K: 30, L: 20, source_roles_distinct: true }
  - scenario_id: signed_comparable_values
    synthetic_input: { comparable_K: -5, comparable_L: 0 }
    expected_result: { accepted: true, K: -5, L: 0 }
  - scenario_id: quarter_first_week_applicability
    synthetic_input: { workflow_id: WF_CUSTOMER_REVENUE_DETAIL, report_mode: quarter_first_week }
    expected_result: { technical_eligibility_applies: true }
  - scenario_id: quarter_first_week_without_template_requires_previous_output
    synthetic_input: { report_mode: quarter_first_week, template_available: false, previous_output_available: false }
    expected_result: { workflow_blocked: true, missing_dependency: previous_reporting_period_validated_output }
  - scenario_id: forecast_D_availability_blank_vs_zero
    synthetic_input:
      customers: [SYNTH_A, SYNTH_B]
      unavailable_owner_values: {}
      available_owner_values: { SYNTH_B: 50 }
    expected_result:
      unavailable: { SYNTH_A: null, SYNTH_B: null, top20_mode: header_only }
      available: { SYNTH_A: 0, SYNTH_B: 50, top20_mode: frozen_members_plus_Other }
  - scenario_id: explicit_output_binding_coverage
    synthetic_input: { detail_columns: A:R, top20_columns: A:G }
    expected_result: { detail_binding_count: 18, prior_top20_binding_count: 7, forecast_top20_binding_count: 7 }
  - scenario_id: template_top20_membership_preserved
    synthetic_input: { template_members: [SYNTH_A, SYNTH_B], generated_order: [SYNTH_B, SYNTH_A] }
    expected_result: { frozen_members: [SYNTH_A, SYNTH_B], reranked: false }
  - scenario_id: generated_top20_rankings
    synthetic_input:
      rows:
        - { customer: SYNTH_A, C: 100, D: 10 }
        - { customer: SYNTH_B, C: 100, D: 20 }
        - { customer: SYNTH_C, C: 90, D: 30 }
      D_unavailable_rows:
        - { customer: SYNTH_B, C: 100, D: null }
        - { customer: SYNTH_A, C: 100, D: null }
        - { customer: SYNTH_C, C: 90, D: null }
    expected_result:
      prior_year_order: [SYNTH_B, SYNTH_A, SYNTH_C]
      prior_year_order_when_D_unavailable: [SYNTH_A, SYNTH_B, SYNTH_C]
      forecast_order: [SYNTH_C, SYNTH_B, SYNTH_A]
  - scenario_id: same_week_rerun_previous_period_selection
    synthetic_input:
      reporting_period_id: SYNTH-P2
      previous_reporting_period_id: SYNTH-P1
      expected_previous_reporting_date: '2026-07-31'
      expected_previous_reporting_period_id: SYNTH-P1
      outputs:
        - { workflow_run_id: SYNTH-RUN-P1, result_id: PREV-V1, reporting_period_id: SYNTH-P1, output_version: 1, output_file_reference: SYNTH-LOCAL-REF-P1, validation_status: passed, completed_at: '2026-08-01T18:00:00+08:00', workflow_reporting_date: '2026-07-31', current_revenue_cutoff_date: '2026-07-30', prior_comparable_as_of_date: '2025-07-31', target_fiscal_quarter: 2026Q3, history_consumption_status: consumable }
        - { workflow_run_id: SYNTH-RUN-P2, result_id: SAME-WEEK, reporting_period_id: SYNTH-P2, output_version: 2, output_file_reference: SYNTH-LOCAL-REF-P2, validation_status: passed, completed_at: '2026-08-08T18:00:00+08:00', workflow_reporting_date: '2026-08-07', current_revenue_cutoff_date: '2026-08-06', prior_comparable_as_of_date: '2025-08-07', target_fiscal_quarter: 2026Q3, history_consumption_status: consumable }
    expected_result: { selected_previous_result_id: PREV-V1, same_week_attempt_used: false, rerun_retains_expected_previous_reporting_date: true, rerun_retains_expected_previous_reporting_period_id: true }
  - scenario_id: customer_run_context_lock
    synthetic_input:
      locked: { reporting_period_id: SYNTH-P2, current_revenue_cutoff_date: "2026-08-06", forecast_D_availability: unavailable }
      attempted_update: { current_revenue_cutoff_date: "2026-08-07" }
    expected_result: { update_rejected: true, workflow_blocked: true }
  - scenario_id: missing_current_customer_zero_fill
    synthetic_input:
      customer_universe: [SYNTH_A, SYNTH_B]
      current_values: { SYNTH_A: { F: 10, J: 8 } }
    expected_result: { SYNTH_A: { F: 10, J: 8 }, SYNTH_B: { F: 0, J: 0 } }
  - scenario_id: workflow_dependency_count_isolation
    synthetic_input: { legacy_global_mixed_dataset_dependency_count: 11 }
    expected_result:
      weekly_dataset_dependency_count: 10
      customer_dataset_dependency_count: 1
      legacy_global_mixed_count_used: false
  - scenario_id: forecast_E_blank_D_as_zero
    synthetic_input:
      rows:
        - { D: null, C: 100 }
        - { D: null, C: 0 }
    expected_result: [-1.0, null]
  - scenario_id: canonical_context_binding_and_target_quarter
    synthetic_input: { current_year: 2026, quarter: 3 }
    expected_result: { target_fiscal_quarter: 2026Q3, runtime_guessing_used: false }
  - scenario_id: result_missing_output_rendering
    synthetic_input: { field_nullable: true, value_status: missing }
    expected_result: { rendered_value: blank_cell, calculation_failed_output_allowed: false, pending_confirmation_output_allowed: false }
  - scenario_id: industry_selection_order
    synthetic_input:
      template_industry: null
      candidates:
        - { industry: SYNTH_INDUSTRY_A, F: 10, J: 100, matches_previous: false }
        - { industry: SYNTH_INDUSTRY_B, F: 10, J: 100, matches_previous: true }
      name_fallback_candidates:
        - { industry: SYNTH_INDUSTRY_B, F: 10, J: 100, matches_previous: false }
        - { industry: SYNTH_INDUSTRY_A, F: 10, J: 100, matches_previous: false }
    expected_result:
      previous_industry_case: { selected_industry: SYNTH_INDUSTRY_B, final_name_fallback_used: false }
      name_fallback_case: { selected_industry: SYNTH_INDUSTRY_A, final_name_fallback_used: true, notification_required: true }
  - scenario_id: detail_sorting_contract
    synthetic_input:
      rows:
        - { customer: SYNTH_EXISTING_B, C: 100, D: 5, F: 2, existing: true, previous_order: 2 }
        - { customer: SYNTH_EXISTING_A, C: 100, D: 9, F: 8, existing: true, previous_order: 1 }
        - { customer: SYNTH_NEW_B, C: 90, D: 5, F: 8, existing: false }
        - { customer: SYNTH_NEW_A, C: 90, D: 5, F: 9, existing: false }
        - { customer: SYNTH_NEW_ZERO, C: 0, D: 100, F: 100, existing: false }
    expected_result: [SYNTH_EXISTING_A, SYNTH_EXISTING_B, SYNTH_NEW_A, SYNTH_NEW_B, SYNTH_NEW_ZERO]
  - scenario_id: unmatched_advertiser_notification_payload
    expected_result:
      payload_fields: [raw_advertiser_company_name, temporary_customer_name, grouped_current_qtd_performance_F, grouped_current_qtd_executed_J, advertiser_mapping_version]
      raw_order_rows_included: false
      persistence_scope: local_only_exception_or_run_record
  - scenario_id: quarter_template_eligibility
    synthetic_input:
      context: { current_year: 2026, quarter: 3, confirmed_template_version: SYNTH-V1 }
      matching_template: { template_asset_id: TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY, template_version: SYNTH-V1, template_current_year: 2026, template_quarter: 3, template_file_reference: SYNTH-TEMPLATE-REF-Q3, structure_validation_status: passed }
      wrong_quarter_template: { template_asset_id: TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY, template_version: SYNTH-V1, template_current_year: 2026, template_quarter: 2, template_file_reference: SYNTH-TEMPLATE-REF-Q2, structure_validation_status: passed }
    expected_result: { matching_template: available, wrong_quarter_template: blocked_invalid_candidate, prior_quarter_fields_inherited: false }
  - scenario_id: previous_output_metadata_contract
    expected_result:
      required_metadata_fields: [workflow_run_id, result_id, reporting_period_id, output_version, output_file_reference, validation_status, completed_at, workflow_reporting_date, current_revenue_cutoff_date, prior_comparable_as_of_date, target_fiscal_quarter, history_consumption_status]
      filename_parsing_used: false
  - scenario_id: frozen_weekly_rule_and_customer_adapter
    expected_result:
      weekly_workflows: [WF_WEEKLY_BUSINESS_REPORT]
      weekly_report_modes: [regular_week, quarter_transition_week]
      customer_report_modes: [regular_week, quarter_first_week]
      weekly_rule_is_customer_runtime_dependency: false
  - scenario_id: formula_mirror_numeric_tolerance
    synthetic_input: { calculation_engine_value: 0.3333333333333333, excel_value: 0.33333333333333337 }
    expected_result: { comparison_passed: true, calculation_engine_remains_authoritative: true }
  - scenario_id: deterministic_context_initialization
    synthetic_input: { workflow_reporting_date: '2026-07-02', current_source_report_date: '2026-07-02', current_revenue_cutoff_date: '2026-07-01', current_year: 2026, quarter: 3, output_history_available: false, template_candidate_exists: false }
    expected_result: { prior_year: 2025, target_fiscal_quarter: 2026Q3, prior_year_fiscal_quarter: 2025Q3, reporting_period_id: 'CUSTOMER:2026Q3:2026-07-02', report_mode: quarter_first_week, expected_previous_reporting_date: '2026-06-25', expected_previous_reporting_period_id: 'CUSTOMER:2026Q2:2026-06-25', previous_reporting_period_id: 'CUSTOMER:2026Q2:2026-06-25', prior_year_full_quarter_period_id: 2025Q3, prior_comparable_as_of_date: '2025-07-02', reporting_and_cutoff_dates_may_differ: true, confirmed_template_version: null, locked_before_data_collection: true }
  - scenario_id: customer_run_input_manifest_scope
    synthetic_input: { run_type: backfill, input_roles: [current_qtd, prior_year_full_quarter, prior_year_comparable] }
    expected_result: { workflow_scope: WF_CUSTOMER_REVENUE_DETAIL, manifest_id: CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1, weekly_contract_reused: false, filename_or_latest_guessing: false }
  - scenario_id: effective_layout_source_selection
    synthetic_input: { eligible_template: false, validated_previous_output: true }
    expected_result: { effective_layout_source: previous_period_output_layout_only, allowed_reuse: [workbook_structure, workbook_style, customer_membership, detail_A_industry], inherited_fields: [], inherited_top20: false }
  - scenario_id: local_output_metadata_write_and_version
    synthetic_input: { existing_passed_output_versions: [1, 2] }
    expected_result: { next_output_version: 3, filename_suffix: v3, output_version_type: integer, filename_parsing_used: false, metadata_written_after_success_only: true }
  - scenario_id: quarter_first_week_template_order_tie
    synthetic_input:
      rows:
        - { customer: SYNTH_TEMPLATE_B, C: 100, existing: true, template_order: 2 }
        - { customer: SYNTH_TEMPLATE_A, C: 100, existing: true, template_order: 1 }
    expected_result: [SYNTH_TEMPLATE_A, SYNTH_TEMPLATE_B]
  - scenario_id: workflow_file_dependency_independence
    expected_result:
      weekly_workflow_file_dependency_allowed: false
      weekly_result_or_output_consumption_allowed: false
      shared_registered_source_dataset_or_mapping_reuse_creates_workflow_dependency: false
      customer_specific_rule_and_context_authority_required: true
      repository_level_multi_workflow_validation_is_not_a_runtime_dependency: true
  - scenario_id: fiscal_quarter_role_binding
    synthetic_input: { current_year: 2026, prior_year: 2025, quarter: 3, records: [{ role: current_qtd, fiscal_quarter: 2026Q3 }, { role: prior_year_full_quarter, fiscal_quarter: 2025Q3 }, { role: prior_year_comparable, fiscal_quarter: 2025Q3 }] }
    expected_result: { current_qtd_context_field: target_fiscal_quarter, historical_context_field: prior_year_fiscal_quarter, historical_current_quarter_filter_allowed: false }
  - scenario_id: four_parameter_manual_run
    synthetic_input: { WorkflowExecutionDate: '2026-08-08', CurrentRevenueCutoffDate: '2026-08-06', CurrentYear: 2026, Quarter: 3 }
    expected_result: { required_parameter_count: 4, reporting_period_id: 'CUSTOMER:2026Q3:2026-08-08', reporting_period_owner_input: false, external_calendar_dependency: false }
  - scenario_id: weekly_manifest_selection_zero_regression
    expected_result: { weekly_manifest_id: RUN_INPUT_MANIFEST_WF_WEEKLY_BUSINESS_REPORT_V1, weekly_multiple_email_selection_unchanged: true, customer_latest_rule_scoped_only: true }
  - scenario_id: source_wait_scope
    expected_result: { scheduled_current_qtd: unlimited_30_minute_recheck_after_notify_once, scheduled_current_multiple_or_unreadable: direct_block, scheduled_historical: direct_block, manual_or_backfill_all_roles: direct_block, unconditional_latest_allowed: false }
  - scenario_id: customer_mapping_dependency_and_fields
    expected_result: { mapping_profiles: [MAP_REVENUE_SALES_ROLLING_DECK_QTD_V1], external_asset_id: MAP_ADVERTISER_NAME_OWNERSHIP_INDEX, field_chain: [advertiser_name, raw_advertiser_name, mapped_customer_or_group_name], industry_field: industry_level_1 }
  - scenario_id: template_absent_vs_invalid
    expected_result: { absent_with_valid_previous_output: previous_period_output_layout_only, present_invalid_metadata_version_or_structure: blocked, invalid_may_be_treated_as_absent: false }
  - scenario_id: output_date_lineage
    expected_result: { AsOfDate: current_revenue_cutoff_date, K_L: prior_comparable_as_of_date, M_N: selected_previous_output_current_revenue_cutoff_date, Q_R: prior_week_comparable_as_of_date, filename_YYYYMMDD: current_revenue_cutoff_date, workflow_reporting_date_used_as_cutoff: false, source_report_date_used_as_cutoff: false }
  - scenario_id: top20_cross_run_freeze
    expected_result: { priority: [validated_current_quarter_frozen_state, eligible_current_quarter_template_membership, first_confirmed_ranking], subsequent_rerank_allowed: false, previous_quarter_reuse_allowed: false, forecast_freeze_requires_D_available: true, ordinary_layout_inheritance: false }
  - scenario_id: top20_membership_state_write_contract
    expected_result: { first_freeze_atomic_write: true, identical_rerun_second_write: false, identical_rerun_reuses_state: true, conflicting_reference_blocks: true, write_failure_blocks_consumable_output: true, state_scope: local_only, customer_rows_in_state_metadata: false }
  - scenario_id: no_template_industry_inheritance
    expected_result: { existing_customer_nonblank_previous_A: inherit_directly, new_or_blank_previous_A: apply_confirmed_fallback }
  - scenario_id: yoy_warning_scope
    synthetic_input: { performance_completion_rate: 1.5, forecast_yoy: 1.2 }
    expected_result: { completion_rate_warning: false, forecast_yoy_warning: true, warning_scope: yoy_only }
  - scenario_id: manifest_role_cardinality_and_customer_identity
    synthetic_input:
      valid_roles: [current_qtd, prior_year_full_quarter, prior_year_comparable]
      duplicate_roles: [current_qtd, current_qtd, prior_year_full_quarter, prior_year_comparable]
      missing_roles: [current_qtd, prior_year_full_quarter]
    expected_result: { business_key: [workflow_run_id, input_role], required_roles: [current_qtd, prior_year_full_quarter, prior_year_comparable], exactly_one_each: true, valid_roles_accepted: true, duplicate_roles_blocked: true, missing_roles_blocked: true, duplicate_or_missing_action: block_customer_workflow, customer_name_statuses: [valid_value] }
  - scenario_id: metadata_failure_and_collision_consistency
    expected_result: { metadata_failure_consumable_history: false, overwrite_allowed: false, orphan_file_action: [block_output, notify_owner], duplicate_version_action: [block_output, notify_owner], filesystem_metadata_version_match_required: true }
  - scenario_id: missing_immediate_previous_week_does_not_fallback
    synthetic_input:
      current_year: 2026
      quarter: 3
      workflow_reporting_date: '2026-08-06'
      current_revenue_cutoff_date: '2026-08-05'
      available_outputs:
        - { reporting_period_id: 'CUSTOMER:2026Q3:2026-07-23', current_revenue_cutoff_date: '2026-07-23', validation_status: passed, history_consumption_status: consumable }
    expected_result: { report_mode: regular_week, expected_previous_reporting_date: '2026-07-30', expected_previous_reporting_period_id: 'CUSTOMER:2026Q3:2026-07-30', blocked: true, older_output_selected: false }
  - scenario_id: mid_quarter_without_history_is_regular_week_and_blocks
    synthetic_input: { current_year: 2026, quarter: 3, workflow_reporting_date: '2026-08-06', current_revenue_cutoff_date: '2026-08-05', available_outputs: [] }
    expected_result: { report_mode: regular_week, expected_previous_reporting_date: '2026-07-30', expected_previous_reporting_period_id: 'CUSTOMER:2026Q3:2026-07-30', blocked: true, identified_as_quarter_first_week: false }
