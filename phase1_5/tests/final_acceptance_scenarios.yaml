config_type: synthetic_final_acceptance_scenarios
suite_id: PHASE1_5_FINAL_ACCEPTANCE_V1
suite_version: 1.0.1
contains_real_business_data: false
external_side_effects_allowed: false

dcp_semantic_test_cases:
  - case_id: comparison_none_excludes_comparison_metrics
    synthetic_input:
      generated_request_id: ARC_SYNTH_NONE_001
      brief: 分析2026-01-01至2026-01-07技术线收入表现，输出表格。
    expected_result:
      comparison: { mode: none }
      metrics: [qtd_performance_revenue, qtd_executed_revenue, weekly_incremental_executed_revenue]
      excluded_metrics: [qtd_performance_revenue_yoy, weekly_incremental_executed_revenue_wow, weekly_incremental_executed_revenue_yoy]
      matched_dcp_id: DCP_REVENUE_TECHNICAL_V1

  - case_id: requested_metric_subset_matches_capability
    synthetic_input:
      request:
        domain: Inventory
        intent: inventory_availability
        capability_scope_id: inventory_non_patch_product
        period: { semantics: explicit_date_range, start_date: "2026-01-01", end_date: "2026-01-07" }
        comparison: { mode: none }
        dimensions: [reporting_period]
        metrics: [available_inventory_count]
    expected_result:
      matched_dcp_id: DCP_INVENTORY_NON_PATCH_PRODUCT_V1
      whole_dcp_metric_list_required: false

  - case_id: unsupported_period_is_rejected
    synthetic_input:
      request:
        domain: Inventory
        intent: inventory_availability
        capability_scope_id: inventory_full_site
        period: { semantics: calendar_month, start_date: "2026-01-01", end_date: "2026-01-31" }
        comparison: { mode: none }
        dimensions: [reporting_period]
        metrics: [available_inventory_count]
    expected_result:
      matched_dcp_ids: []
      action: request_owner_confirmation

  - case_id: unsupported_comparison_is_rejected
    synthetic_input:
      request:
        domain: Revenue
        intent: revenue_performance
        capability_scope_id: revenue_ctv
        period: { semantics: explicit_date_range, start_date: "2026-01-01", end_date: "2026-01-07" }
        comparison: { mode: week_over_week }
        dimensions: [reporting_period]
        metrics: [qtd_executed_revenue]
    expected_result:
      matched_dcp_ids: []
      action: request_owner_confirmation

  - case_id: explicit_comparison_adds_registered_metrics
    synthetic_input:
      week_over_week:
        generated_request_id: ARC_SYNTH_WOW_001
        brief: 分析2026-01-01至2026-01-07技术线收入表现环比，输出表格。
      year_over_year:
        generated_request_id: ARC_SYNTH_YOY_001
        brief: 分析2026-01-01至2026-01-07技术线收入表现同比，输出表格。
    expected_result:
      week_over_week:
        comparison: { mode: week_over_week }
        added_metrics: [weekly_incremental_executed_revenue_wow]
        excluded_metrics: [qtd_performance_revenue_yoy, weekly_incremental_executed_revenue_yoy]
      year_over_year:
        comparison: { mode: year_over_year }
        added_metrics: [qtd_performance_revenue_yoy, weekly_incremental_executed_revenue_yoy]
        excluded_metrics: [weekly_incremental_executed_revenue_wow]

weekly_revenue_contract_assertions:
  - assertion_id: revenue_context_missing_inventory_continues_partial_draft
    synthetic_input: { core_context_valid: true, revenue_scope_fields_resolved: false, inventory_pipeline_valid: true }
    expected_result: { revenue_scope_blocked: true, inventory_continues: true, workflow_completion_status: partial_draft }
  - assertion_id: revenue_result_lineage_rejects_generic_cutoff
    synthetic_input: { lineage_fields: [workflow_reporting_date, current_revenue_cutoff_date], attempted_business_cutoff_field: cutoff_date }
    expected_result: { four_revenue_contracts_accept: false, required_business_cutoff_field: current_revenue_cutoff_date }
  - assertion_id: technical_incremental_wow_exact_previous_metric
    synthetic_input: { current_workflow_reporting_date: '2026-08-06', available_periods: ['2026-07-23', '2026-07-30'] }
    expected_result: { expected_previous_revenue_workflow_reporting_date: '2026-07-30', metric_variant_id: MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_V1, store_asset_id: STORE_ASSET_WEEKLY_REVENUE_TECHNICAL, older_fallback_used: false }
  - assertion_id: technical_incremental_yoy_unique_denominator
    synthetic_input: { owner_confirmed_option: A, candidate_sources: [validated_prior_year_incremental_metric, qtd_executed_revenue_amount, full_quarter_executed_revenue_amount] }
    expected_result: { selected_source: validated_prior_year_incremental_metric, metric_variant_id: MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_V1, store_asset_id: STORE_ASSET_WEEKLY_REVENUE_TECHNICAL, selected_source_count: 1, qtd_or_full_quarter_equivalence_allowed: false }
  - assertion_id: prior_year_unavailable_failure_precedence
    synthetic_input: { current_qtd_performance_valid: true, current_qtd_executed_valid: true, prior_year_source_available: false }
    expected_result: { current_qtd_performance_status: valid_value, current_qtd_executed_status: valid_value, affected_yoy_status: missing, warning_required: true, current_revenue_scope_blocked: false }

scenarios:
  - scenario_id: normal_week
    synthetic_input:
      run_type: scheduled
      reporting_period_id: SYNTH-W01
      required_pipeline_failures: []
    expected_result:
      workflow_completion_status: complete_draft
      warning_required: false

  - scenario_id: manual_run_context
    synthetic_input:
      run_type: manual
      explicit_period_supplied: true
      execution_date_differs_from_reporting_period: true
    expected_result:
      period_source: workflow_run_context
      execution_date_inference_used: false

  - scenario_id: backfill_run_context
    synthetic_input:
      run_type: backfill
      explicit_period_supplied: true
      reporting_period_id: SYNTH-HIST-W01
      execution_date_differs_from_reporting_period: true
    expected_result:
      period_source: workflow_run_context
      execution_date_inference_used: false

  - scenario_id: quarter_transition
    synthetic_input:
      current_period_start_date: 2026-10-01
      comparison_period_end_date: 2026-09-30
    expected_result:
      report_mode: quarter_transition
      date_source: workflow_run_context

  - scenario_id: twelve_pp_anomaly_trigger
    synthetic_input:
      current_rate: 0.62
      prior_rate: 0.50
      threshold_pp: 10.0
    expected_result:
      wow_change_pp: 12.0
      unit: percentage_point
      trigger: true

  - scenario_id: qualified_customer_zero_rows
    synthetic_input:
      product_context_valid: true
      qualified_customer_rows: []
    expected_result:
      result_contract_generated: true
      customer_record_count: 0
      narrative_mode: product_change_only
      fabricated_customer: false

  - scenario_id: multiple_products_with_repeated_attempt
    synthetic_input:
      instances:
        - { product: SYNTH_PRODUCT_A, attempt: 1, validation_status: passed, result_id: A1 }
        - { product: SYNTH_PRODUCT_A, attempt: 2, validation_status: passed, result_id: A2 }
        - { product: SYNTH_PRODUCT_B, attempt: 1, validation_status: passed, result_id: B1 }
    expected_result:
      selected_result_ids: [A2, B1]
      blocked_products: []
      fixed_product_order_preserved: true

  - scenario_id: duplicate_latest_attempt_blocks_product
    synthetic_input:
      instances:
        - { product: SYNTH_PRODUCT_A, attempt: 2, validation_status: passed, result_id: A2X }
        - { product: SYNTH_PRODUCT_A, attempt: 2, validation_status: passed, result_id: A2Y }
    expected_result:
      selected_result_ids: []
      blocked_products: [SYNTH_PRODUCT_A]
      random_selection_used: false

  - scenario_id: duplicate_and_negative_customer_rows
    synthetic_input:
      rows:
        - { product: SYNTH_PRODUCT_A, period: current, customer_id: SYNTH_C1, impression_count: 1200000 }
        - { product: SYNTH_PRODUCT_A, period: current, customer_id: SYNTH_C1, impression_count: 1300000 }
        - { product: SYNTH_PRODUCT_A, period: current, customer_id: SYNTH_C2, impression_count: -1 }
        - { product: SYNTH_PRODUCT_A, period: current, customer_id: SYNTH_C3, impression_count: 1500000 }
    expected_result:
      retained_customer_ids: [SYNTH_C3]
      excluded_duplicate_customer_ids: [SYNTH_C1]
      excluded_negative_customer_ids: [SYNTH_C2]
      owner_notification_required: true

  - scenario_id: sqlite_idempotency_and_conflict
    synthetic_input:
      first_value: 12.0
      repeated_value: 12.0
      conflicting_value: 11.0
      configured_display_first_value: 93%
      configured_display_repeated_value: 93%
      configured_display_conflicting_value: 94%
    expected_result:
      metric_same_value_action: no_op_success
      metric_conflict_action: reject_write_notify_owner
      configured_display_same_value_action: read_and_reuse_success
      configured_display_conflict_action: reject_write_notify_owner

  - scenario_id: partial_draft
    synthetic_input:
      required_pipeline_failed: true
      approved_fallback_allows_draft: true
    expected_result:
      workflow_completion_status: partial_draft
      warning_required: true
      complete_success_label_allowed: false

  - scenario_id: adhoc_brief_exact_dcp_match
    synthetic_input:
      request:
        domain: Advertising
        intent: customer_delivery_change
        capability_scope_id: advertising_product_customer_change
        period: { semantics: explicit_date_range, start_date: "2026-01-01", end_date: "2026-01-07" }
        comparison: { mode: week_over_week }
        dimensions: [target_ad_product_name, customer_id, customer_name, reporting_period]
        metrics: [impression_count, impression_change_count, customer_rank]
      operations: [filter, group_by, sum, period_compare, sort, rank, topN]
    expected_result:
      matched_dcp_id: DCP_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_V1
      plan_type: Temporary Execution Plan
      creates_formal_workflow: false
      creates_new_business_metric_formula: false

  - scenario_id: natural_language_revenue_brief_to_plan
    synthetic_input:
      generated_request_id: ARC_SYNTH_REVENUE_001
      brief: 分析2026-01-01至2026-01-07技术线收入表现，输出表格。
    expected_result:
      arc:
        request_id: ARC_SYNTH_REVENUE_001
        domain: Revenue
        intent: revenue_performance
        capability_scope_id: revenue_technical
        period: { semantics: explicit_date_range, start_date: "2026-01-01", end_date: "2026-01-07" }
        comparison: { mode: none }
        dimensions: [reporting_period]
        metrics: [qtd_performance_revenue, qtd_executed_revenue, weekly_incremental_executed_revenue]
        filters: []
        output: { format: table, audience: WORKFLOW_OWNER }
      matched_dcp_id: DCP_REVENUE_TECHNICAL_V1
      plan_type: Temporary Execution Plan
      creates_formal_workflow: false
      creates_new_business_metric_formula: false

  - scenario_id: natural_language_inventory_brief_to_plan
    synthetic_input:
      generated_request_id: ARC_SYNTH_INVENTORY_001
      brief: 分析2026-01-01至2026-01-07全站库存情况，输出表格。
    expected_result:
      arc:
        request_id: ARC_SYNTH_INVENTORY_001
        domain: Inventory
        intent: inventory_availability
        capability_scope_id: inventory_full_site
        period: { semantics: explicit_date_range, start_date: "2026-01-01", end_date: "2026-01-07" }
        comparison: { mode: none }
        dimensions: [reporting_period]
        metrics: [gross_inventory_count, disabled_inventory_count, available_inventory_count, brand_delivery_inventory_count, performance_delivery_inventory_count, commercial_delivery_inventory_count]
        filters: []
        output: { format: table, audience: WORKFLOW_OWNER }
      matched_dcp_id: DCP_INVENTORY_FULL_SITE_V1
      plan_type: Temporary Execution Plan
      creates_formal_workflow: false
      creates_new_business_metric_formula: false
