    - dataset_update_frequency
    - planned_acquisition_frequency
    - query_execution_frequency
  dataset_workflow_relationship_location: readiness_matrix_and_pipeline_registry
  active_pipeline_dataset_version_constraint: ">=0.1.0,<0.2.0"
  single_dataset_join_rule: not_applicable
  workflow_run_context_and_manifest_required: true

active_runtime_tbd_policy:
  runtime_authoritative_paths:
    - Pipeline Registry dataset_version_constraint
    - Pipeline Registry join_or_relationship_rule_id
    - Run Input Manifest explicit bindings
    - Approved Field Mapping Profile
    - Workflow Run Context period fields
  tbd_allowed_in_runtime_authoritative_paths: false
  descriptive_inventory_tbd_is_runtime_authority: false
  newly_discovered_tbd_that_changes_runtime_result_action: Add a blocking_readiness_item and prevent the affected Pipeline from activation.
  tbd_may_be_treated_as_non_blocking_without_explicit_classification: false
  remaining_placeholder_classification:
    blocking: []
    runtime-only: Resolve the affected local source or query field before activation; otherwise block that scope.
    not-required-for-MVP: Descriptive inventory fields not consumed by approved mappings or runtime bindings.
    superseded: Inventory fields replaced by Pipeline Registry, Run Context, Run Input Manifest, or approved Mapping authority.
    unclassified_occurrence_count: 0
    business_value_inference_allowed: false

