        - 客户维度投放查询结果
        - 历史CSV导出数据

    notes: >-
      本Dataset是按需生成的客户维度投放执行分析数据，不负责发现异常、判断
      阈值、选择有效产品筛选条件、计算变化或生成报告文本。当前v1正式映射
      广告主、广告主ID和曝光量，其余查询结果字段保持未映射。Field Mapping及
      事件触发Pipeline已经登记；产品筛选Business Rule、异常触发阈值、涨跌
      分析、客户排名、Metric及Output Generation由后续阶段管理。

