  - query_asset_id: QRY_NOVABI_DAU_QUERY
    source_id: SRC_INTERNAL_PLATFORM_NOVABI
    query_or_export_name: DAU查询
    query_description_or_manual_steps: >-
      登录NovaBI网页；确认当前账号具备NovaBI查询权限；输入固定格式自然语言
      查询语句；根据Run Input Manifest的period_role读取Workflow Run Context并设置开始和结束日期参数；提交查询；获取全平台
      分日DAU查询结果。
    access_requirement:
      login_account: ${NOVABI_LOGIN_ACCOUNT_LOCAL_ONLY}
      credential_reference: managed_externally
      credentials_stored_in_config: false
      authentication_note: >-
        NovaBI登录账号与其他业务平台账号独立。
      operational_fallback_note: >-
        如果当前登录账号不正确导致查询失败，需要提醒用户切换NovaBI账号，
        或由用户手动提供查询结果；具体异常处理机制不在本阶段配置。
    default_query_template: >-
      从BI报表的核心数据表中，给我跑一下{start_date}-{end_date}的全平台分日DAU
    query_parameter_logic:
      capability: Parameterized date range
      default_profile_name: Weekly previous seven complete days
      query_period_rule: 查询日前一周
      start_date_rule: 查询日前7天
      end_date_rule: 查询日前1天
      date_format: YYMMDD
      weekly_business_report_profile:
        execution_weekday: Friday
        start_date_rule: Workflow Run Context current_period_start_date
        end_date_rule: Workflow Run Context current_period_end_date
      observed_example:
        query_date: "260724"
        query_period: "260717-260723"
        rendered_query: 从BI报表的核心数据表中，给我跑一下260717-260723的全平台分日DAU
    result_handling:
      unavailable_result_policy:
        applies_to:
          - account_switch_required
          - query_execution_failure
          - empty_result
        action:
          - notify_user
          - leave_report_content_blank
          - continue_workflow
        block_workflow: false
    output_dataset_id: DS_NOVABI_PLATFORM_DAU
    parameters_or_filters:
      - parameter_name: start_date
        runtime_value: Workflow-dependent
        weekly_business_report_value: Workflow Run Context current_period_start_date
      - parameter_name: end_date
        runtime_value: Workflow-dependent
        weekly_business_report_value: Workflow Run Context current_period_end_date
    result_acquisition_method:
      - On-screen Result Copy
    expected_format:
      - Web Query Result Table
    expected_output_grain: 每个日期对应一条全平台DAU结果
    source_data_refresh_frequency: Daily
    query_availability: Available during normal NovaBI access
    planned_acquisition_frequency: Workflow-dependent
    query_execution_frequency: Workflow-dependent
    owner: BI Team
    version: 0.1.0
    approval_status: confirmed

