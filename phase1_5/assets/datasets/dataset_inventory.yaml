config_type: dataset_inventory
inventory_version: 0.2.2
status: active
owner: ${OUTLOOK_MAILBOX_ADDRESS_LOCAL_ONLY}

runtime_input_contract:
  applies_by_workflow_scope: true
  workflow_scopes:
    WF_WEEKLY_BUSINESS_REPORT:
      contract_source: phase1_5/assets/execution/weekly_workflow_runtime_contracts_v1.yaml
      run_input_manifest_id: WEEKLY_RUN_INPUT_MANIFEST
    WF_CUSTOMER_REVENUE_DETAIL:
      contract_source: phase1_5/assets/execution/customer_revenue_detail_local_input_contracts_v1.yaml
      contract_section: customer_run_input_manifest_contract
      run_input_manifest_id: CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1
      context_id: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
      rolling_deck_roles: [current_qtd_snapshot, prior_year_full_quarter_history_for_C, prior_year_comparable_qtd_snapshot_for_K_L]
      supported_run_types: [scheduled, manual, backfill, rerun]
      exact_locked_context_binding_required: true
      weekly_runtime_contract_reuse_allowed: false
  unscoped_runtime_contract_fallback_allowed: false
  approved_dataset_version_source: datasets[].governance.version
  approved_query_asset_version_source: query_assets[].version
  workflow_run_context_required: true
  run_input_manifest_required: true
  actual_execution_date_business_date_inference_allowed: false
  current_date_fallback_allowed: false
  filename_period_or_product_inference_allowed: false
  latest_file_selection_allowed: false

datasets:
  - dataset_id: DS_REVENUE_SALES_ROLLING_DECK_QTD
    dataset_name: 销售业务线Rolling Deck季度累计业绩收入数据
    business_domains:
      - Revenue
    business_purpose: >-
      用于获取销售业务线Rolling Deck季度累计业绩收入数据，并从业务线Sheet
      读取过去季度的完整业绩收入结果，支持Weekly Business Report收入模块及
      其他收入相关业务分析。
    asset_role: Raw Analytical Input
    source_id: SRC_CORP_OUTLOOK_PRIMARY_MAILBOX
    query_asset_id: null

    acquisition:
      acquisition_role: Email Attachment Acquisition
      source_object_or_attachment_rule:
        source_scope: Corporate Outlook Mailbox中的销售业务线业绩收入邮件
        sender:
          display_name: ${REVENUE_SOURCE_CONTACT_NAME_LOCAL_ONLY}
          email: ${REVENUE_SOURCE_CONTACT_EMAIL_LOCAL_ONLY}
        subject_pattern: "FY{Year}Q{Quarter}销售业务线Rolling Deck @{Date}"
        attachment_pattern: "销售业务线Rolling Deck-FY{Year}Q{Quarter}@{Date}"
        attachment_name_example: "销售业务线Rolling Deck-FY26Q3@Jul23 2026"
        historical_comparison_access:
          archive_id: ARCHIVE_REVENUE_ROLLING_DECK_PRIOR_YEAR
          access_location: '${LOCAL_WORKFLOW_DATA_ROOT}\分业务线同期业绩收入数据-存档'
          purpose: Retrieve manually archived prior-year Rolling Deck attachments for YoY calculation
          original_source_id: SRC_CORP_OUTLOOK_PRIMARY_MAILBOX
          original_sender:
            display_name: ${REVENUE_SOURCE_CONTACT_NAME_LOCAL_ONLY}
            email: ${REVENUE_SOURCE_CONTACT_EMAIL_LOCAL_ONLY}
          provenance_preserved: true
          archive_is_independent_source: false
          coverage_status: Partial and continuously supplemented by Owner
        email_selection_scope: >-
          当前Dataset仅包含用于周度业务分析的季度累计Rolling Deck邮件，
          该邮件流通常每周四发送。
        excluded_email_scope: >-
          同一发件人发送的季度结算或确认版本邮件，包括季度初发送的上季度
          整体收入、初版或终版确认邮件，不属于本Dataset；相关资产如需启用，
          必须另行登记。
        executable_version_selection_rule:
          status: partially_confirmed
          primary_classification:
            weekly_body_pattern: >-
              截至{Body_Date}销售部品牌广告各业务线收入概况如下，具体请参考附件内容
            quarter_close_body_pattern: >-
              附件为{Version_Label}{Year}Q{Quarter}各业务线收入完成情况
            required_classification: weekly_body_pattern
          secondary_validation:
            expected_weekday: Thursday
            expected_received_time: 17:00-18:00 Asia/Shanghai
            subject_date_relation: Subject date equals email sent date
          observed_weekly_example:
            subject: FY26Q3销售业务线Rolling Deck @2026/7/9
            sent_at: 2026/7/9 17:06 Asia/Shanghai
            classification: weekly
          conflict_policy:
            primary_body_match_takes_precedence: true
            classification_result: weekly
            secondary_validation_failure_action: warn_and_require_user_confirmation
            resume_requires_user_confirmation: true
          no_match_policy:
            initial_action: pause_workflow
            retry_delay_minutes: 30
            retry_attempts: 1
            after_retry_no_match_action:
              - notify_user
              - keep_workflow_blocked
          multiple_match_selection_rule:
            sort_by: email_sent_at
            sort_order: descending
            select: first
            output_notice_required: true
            output_notice_content:
              - multiple_matching_weekly_emails_found
              - selected_email_sent_at
              - selected_email_subject
      parameters_or_filters: []
      expected_format:
        - Excel (.xlsx)
      asset_scope: Entire Sales Business Line Rolling Deck Excel Workbook
      primary_analysis_object: "{Year}年执行单类型 Sheet"
      other_object_usage: >-
        业务线Sheet用于季度切换首周读取目标上季度的完整业绩收入结果；
        行列映射由MAP_REVENUE_SALES_ROLLING_DECK_QTD_BUSINESS_LINE_V1定义。

    data_contract:
      record_grain: >-
        Provisional：每行暂定代表订单项层级的业绩收入记录，基于
        “{Year}年执行单类型”Sheet初步判断。精确粒度、业务唯一键及是否存在
        多Sheet粒度差异，待后续数据结构盘点确认。
      primary_or_business_key: []
      snapshot_or_period_type: 季度累计收入快照
      period_semantics:
        year_definition: Fiscal Year
        quarter_definition: Fiscal Quarter
        cumulative_window: >-
          当年当季度开始至邮件发送日前一天累计产生的业绩收入数据。
        subject_date_format: TBD
        attachment_date_format: TBD
        attachment_date_format_observed_example: "{Month}{Day} {Year}"
      business_date_field: TBD
      expected_update_time: 每周四17:00-18:00（Asia/Shanghai）
      schema_profile_id: TBD
      mapping_profile_id: MAP_REVENUE_SALES_ROLLING_DECK_QTD_V1
      additional_mapping_profile_ids:
        - MAP_REVENUE_SALES_ROLLING_DECK_QTD_BUSINESS_LINE_V1
      required_fields: []

    context:
      supported_business_context_candidates:
        - Weekly Business Report Revenue Analysis
        - Sales Performance Analysis
        - Customer Revenue Analysis
        - Advertising Revenue Analysis
        - Quarterly Business Review
      supported_business_context_ids: []
      supported_dimension_ids: []
      supported_workflow_ids: []

    quality:
      freshness_rule_id: TBD
      uniqueness_rule_id: TBD
      completeness_rule_ids: []
      validation_owner: TBD

    governance:
      owner: "Originating business team (Contact: ${REVENUE_SOURCE_CONTACT_NAME_LOCAL_ONLY})"
      version: 0.1.0
      approval_status: confirmed
      effective_from: TBD
      evidence_sources:
        - Recurring weekly revenue emails from Outlook
        - Revenue email Excel attachments
        - Sales Business Line Rolling Deck Excel template

    notes: >-
      该Dataset来源于固定发件人的Rolling Deck收入邮件附件。邮件每周更新，
      但内容为季度累计收入快照，而非单周新增收入。Dataset覆盖完整Workbook；
      “{Year}年执行单类型”是当前主要明细分析Sheet；“业务线”Sheet已确认
      作为季度切换首周读取上季度完整业绩收入结果的主来源，其增量字段映射
      尚待确认。去年同期附件可从Owner维护的本地历史归档目录读取，但其原始
      来源仍为同一Outlook邮件流，不形成新的Dataset或Data Source。本阶段
      不包含字段映射、收入计算规则、指标逻辑或Pipeline设计。

  - dataset_id: DS_REVENUE_SALES_ROLLING_DECK_QUARTER_CLOSE_CONFIRMATION
    dataset_name: 销售业务线Rolling Deck季度结算收入确认数据
    business_domains:
      - Revenue
    business_purpose: >-
      用于获取销售业务线季度整体收入确认数据，支持季度收入分析、季度经营
      复盘和历史收入结果确认；在Weekly Business Report季度切换首周中仅作为
      上季度完整结果的备选来源。
    asset_role: Raw Analytical Input
    source_id: SRC_CORP_OUTLOOK_PRIMARY_MAILBOX
    query_asset_id: null

    acquisition:
      acquisition_role: Email Attachment Acquisition
      source_object_or_attachment_rule:
        source_scope: Corporate Outlook Mailbox中的销售业务线季度结算相关收入邮件
        sender:
          display_name: ${REVENUE_SOURCE_CONTACT_NAME_LOCAL_ONLY}
          email: ${REVENUE_SOURCE_CONTACT_EMAIL_LOCAL_ONLY}
        subject_pattern: "FY{Year}Q{Quarter}销售业务线Rolling Deck @{Date}"
        attachment_pattern: "销售业务线Rolling Deck-FY{Year}Q{Quarter}@{Date}"
        email_context_reference:
          - 附件为初版2026Q2各业务线收入完成情况
          - 附件为终版2026Q1各业务线收入完成情况
        executable_selection_rule:
          status: partially_confirmed
          primary_classification:
            quarter_close_body_pattern: >-
              附件为{Version_Label}{Year}Q{Quarter}各业务线收入完成情况
            weekly_body_pattern: >-
              截至{Body_Date}销售部品牌广告各业务线收入概况如下，具体请参考附件内容
            required_classification: quarter_close_body_pattern
          secondary_validation:
            expected_send_period: Beginning of the following quarter
            subject_date_relation: >-
              Subject date differs from email sent date and represents the final
              day of the previous quarter
          observed_quarter_close_example:
            subject: FY26Q2销售业务线Rolling Deck @2026/6/30
            sent_at: 2026/7/2 14:39 Asia/Shanghai
            classification: quarter_close
          conflict_policy: TBD
          no_match_policy:
            initial_action: pause_workflow
            retry_delay_minutes: 30
            retry_attempts: 1
            after_retry_no_match_action:
              - notify_user
              - keep_workflow_blocked
          multiple_match_selection_rule:
            sort_by: email_sent_at
            sort_order: descending
            select: first
            output_notice_required: true
            output_notice_content:
              - multiple_matching_ctv_emails_found
              - selected_email_sent_at
              - selected_email_subject
      parameters_or_filters: []
      expected_format:
        - Excel (.xlsx)
      asset_scope: Entire Rolling Deck Excel Workbook
      primary_analysis_object: 业绩-业务线 Sheet
      other_object_usage: >-
        季度切换首周仅作为完整季度收入结果备选；
        行列映射由MAP_REVENUE_SALES_ROLLING_DECK_QUARTER_CLOSE_BUSINESS_LINE_V1定义。

    data_contract:
      record_grain: TBD
      primary_or_business_key: []
      snapshot_or_period_type: 季度整体收入确认数据
      dataset_update_frequency: Quarterly, potentially multiple versions
      version_scope: >-
        本Dataset包含同一季度的季度收入确认版本，包括但不限于初版收入确认
        文件、终版收入确认文件及其他季度确认版本。各版本作为同一Dataset下
        的不同版本或快照管理。当前不定义有效版本选择规则。
      period_semantics:
        year_definition: Fiscal Year
        quarter_definition: Fiscal Quarter
        cumulative_window: 已结束财务季度的整体收入结果
        subject_date_format: TBD
        attachment_date_format: TBD
        attachment_date_format_observed_example: TBD
      business_date_field: TBD
      expected_update_time: >-
        Around the beginning of the following quarter; exact date and time TBD
      schema_profile_id: TBD
      mapping_profile_id: MAP_REVENUE_SALES_ROLLING_DECK_QUARTER_CLOSE_BUSINESS_LINE_V1
      required_fields: []

    context:
      supported_business_context_candidates:
        - Weekly Business Report Quarter Transition Revenue Analysis (Fallback Candidate)
        - Quarterly Business Review
        - Revenue Performance Analysis
        - Sales Performance Analysis
        - Customer Revenue Analysis
        - Advertising Revenue Analysis
      supported_business_context_ids: []
      supported_dimension_ids: []
      supported_workflow_ids: []

    quality:
      freshness_rule_id: TBD
      uniqueness_rule_id: TBD
      completeness_rule_ids: []
      validation_owner: TBD

    governance:
      owner: "Originating business team (Contact: ${REVENUE_SOURCE_CONTACT_NAME_LOCAL_ONLY})"
      version: 0.1.0
      approval_status: confirmed
      effective_from: TBD
      evidence_sources:
        - Historical quarterly revenue confirmation emails from Outlook
        - Quarterly revenue email attachments
        - Sales Business Line Rolling Deck Excel files

    notes: >-
      本Dataset与销售业务线Rolling Deck季度累计业绩收入Dataset来自同一
      Active Outlook Source，但业务用途、期间状态和版本语义不同，因此独立
      登记。本Dataset不用于常规周收入计算；在Weekly Business Report季度切换
      首周中，主来源调整为周度Rolling Deck Workbook的“业务线”Sheet，本Dataset
      仅保留为备选来源。是否自动启用备选、Sheet结构、字段映射及精确版本回退
      策略保持TBD。

  - dataset_id: DS_REVENUE_CTV_EXCL_PLACEMENT_QTD
    dataset_name: CTV（不含植入）季度累计业绩收入数据
    business_domains:
      - Revenue
    business_purpose: >-
      用于生成Weekly Business Report收入模块中的CTV业务线收入指标。
    asset_role: Raw Analytical Input
    source_id: SRC_CORP_OUTLOOK_PRIMARY_MAILBOX
    query_asset_id: null

    acquisition:
      acquisition_role: Email Attachment Acquisition
      source_object_or_attachment_rule:
        source_scope: Corporate Outlook Mailbox中的CTV业务线收入邮件
        sender:
          email: ${CTV_SOURCE_SYSTEM_EMAIL_LOCAL_ONLY}
        subject_pattern: "{Year}-Q{Quarter}执行清单{Subject_Date}"
        subject_pattern_year_scope: Parameterized Year token, applicable to future years
        subject_date_format: YYYY-MM-DD
        observed_subject_example: 2026-Q3执行清单2026-07-02
        attachment_pattern: 订单分季度收入.xlsx
        email_frequency: Daily
        desired_selection_scope: >-
          获取邮件标题日期与Workflow Run Context cutoff_date一致的邮件。
        executable_selection_rule:
          status: confirmed
          primary_condition: Subject date equals Workflow Run Context cutoff_date
          subject_date_format: YYYY-MM-DD
          no_match_policy:
            initial_action: pause_workflow
            retry_delay_minutes: 30
            retry_attempts: 1
            after_retry_no_match_action:
              - notify_user
              - keep_workflow_blocked
          multiple_match_selection_rule:
            sort_by: email_sent_at
            sort_order: descending
            select: first
            output_notice_required: true
            output_notice_content:
              - multiple_matching_ctv_emails_found
              - selected_email_sent_at
              - selected_email_subject
      parameters_or_filters: []
      expected_format:
        - Excel (.xlsx)
      asset_scope: TBD
      primary_analysis_object: TBD
      other_object_usage: TBD

    data_contract:
      record_grain: >-
        每条记录代表一个订单维度的季度累计收入记录，对应一个订单ID及其关联
        客户、销售、执行周期和季度收入信息。
      primary_or_business_key:
        - 订单ID
      snapshot_or_period_type: 季度累计收入快照
      dataset_update_frequency: Daily
      version_scope: >-
        每封邮件代表当前季度的最新累计收入状态。有效邮件按已确认的标题日期
        与Workflow Run Context cutoff_date一致规则识别；多封匹配时选择发送时间最新的一封并提醒。
      period_semantics:
        year_definition: TBD
        quarter_definition: TBD
        cumulative_window: 当前季度开始日至邮件发送日前一天的累计收入
        data_cutoff_rule: 收入数据截止时间为邮件发送日前一天
        subject_date_format: YYYY-MM-DD
        attachment_date_format: not_present_in_confirmed_attachment_pattern
        attachment_date_format_observed_example: not_applicable
      business_date_field: TBD
      expected_update_time: >-
        Daily around 17:00 Asia/Shanghai, with possible delay.
      schema_profile_id: TBD
      mapping_profile_id: MAP_REVENUE_CTV_EXCL_PLACEMENT_QTD_V1
      required_fields:
        - order_id
        - qtd_executed_revenue_amount
        - qtd_signed_amount
        - qtd_ctv_signed_amount

    context:
      supported_business_context_candidates:
        - Weekly Business Report Revenue Analysis
        - CTV Revenue Analysis
        - Customer Revenue Analysis
        - Quarterly Business Review
      supported_business_context_ids: []
      supported_dimension_ids: []
      supported_workflow_ids: []

    quality:
      freshness_rule_id: TBD
      uniqueness_rule_id: TBD
      completeness_rule_ids: []
      validation_owner: TBD

    governance:
      owner: Advertising Data System Team
      version: 0.1.0
      approval_status: confirmed
      effective_from: TBD
      evidence_sources:
        - Historical CTV revenue emails from Outlook
        - Daily revenue email attachments
        - 订单分季度收入.xlsx dataset samples
        - Excel template / structure samples
        - Email screenshots

    notes: >-
      本Dataset来自adssystem发送的CTV业务线收入邮件，与销售业务线Rolling
      Deck Dataset保持独立。当前确认其订单级季度累计快照边界及邮件发送日前
      一天的数据截止语义。P0字段键及字段映射已由
      MAP_REVENUE_CTV_EXCL_PLACEMENT_QTD_V1定义；财务期间定义、计算规则
      和Metric不在Field Mapping阶段定义。

  - dataset_id: DS_REVENUE_APOLLO_BUSINESS_LINE_SUMMARY
    dataset_name: Apollo细分业务线日期区间收入汇总数据
    business_domains:
      - Revenue
    business_purpose: >-
      用于生成Weekly Business Report收入模块中的智能音箱和极速版业务线收入
      指标，同时支持相关业务线经营分析。
    asset_role: Prepared Analytical Dataset
    source_id: SRC_INTERNAL_PLATFORM_APOLLO
    query_asset_id: QRY_APOLLO_QISHENG_EXECUTION_REVENUE

    acquisition:
      acquisition_role: Manual Web Query Result Acquisition
      source_object_or_attachment_rule:
        source_scope: Apollo奇胜执行收入查询模块
        query_template_scope:
          - 智能音箱收入查询模板
          - 极速版收入查询模板
        template_compatibility: >-
          两个模板的输出结构、收入口径、汇总粒度和日期参数语义当前确认一致；
          模板差异主要用于选择业务线。后续如发生变化，重新评估Dataset边界。
        current_workflow_parameter_profile:
          workflow_usage: Weekly Business Report
          execution_weekday: Thursday
          start_date_rule: Workflow Run Context current_period_start_date
          end_date_rule: Workflow Run Context current_period_end_date
          post_template_adjustment:
            detail_dimension_date_selected_by_template: true
            required_action: Deselect date detail dimension before query execution
            template_definition_is_modified: false
      parameters_or_filters:
        - parameter_name: business_line_query_template
        - parameter_name: date_range
        - parameter_name: detail_dimension_date
      result_acquisition_method:
        - On-screen Result Copy
      expected_format:
        - Web Query Result Table
      source_data_refresh_frequency: Daily update
      query_availability: Available during normal Apollo access
      planned_acquisition_frequency: Weekly
      asset_scope: On-screen single-row date-range aggregate result table
      primary_analysis_object: 执行收入结果
      other_object_usage: TBD

    data_contract:
      record_grain: >-
        每条记录代表一个查询模板、一个业务线及一个日期范围下的投放执行汇总
        结果。
      primary_or_business_key:
        - business_line_query_template
        - period_start_date
        - period_end_date
      snapshot_or_period_type: Date-range aggregated performance result
      period_result_grain: Single aggregate row for selected date range
      dataset_update_frequency: Weekly
      version_scope: TBD
      period_semantics:
        year_definition: TBD
        quarter_definition: TBD
        cumulative_window: 指定日期范围，结果汇总为一行
        data_cutoff_rule: >-
          Apollo底层业务数据每日更新前一日及之前数据；具体就绪校验保持TBD。
        subject_date_format: not_applicable
        attachment_date_format: not_applicable
        attachment_date_format_observed_example: not_applicable
      business_date_field: TBD
      expected_update_time: TBD
      schema_profile_id: TBD
      mapping_profile_id: MAP_REVENUE_APOLLO_BUSINESS_LINE_SUMMARY_V1
      required_fields:
        - business_line_query_template
        - period_start_date
        - period_end_date
        - adjusted_executed_revenue_amount

    context:
      supported_business_context_candidates:
        - Weekly Business Report Revenue Analysis
        - Business Line Revenue Analysis
      supported_business_context_ids: []
      supported_dimension_ids: []
      supported_workflow_ids: []

    quality:
      freshness_rule_id: TBD
      uniqueness_rule_id: TBD
      completeness_rule_ids: []
      validation_owner: TBD

    governance:
      owner: Advertising Data Team
      version: 0.1.0
      approval_status: confirmed
      effective_from: TBD
      evidence_sources:
        - Apollo查询页面截图
        - Apollo查询页面链接
        - 历史查询结果截图
        - 历史导出数据

    notes: >-
      本Dataset定义为通用日期区间收入汇总数据。季度累计收入只是当前Weekly
