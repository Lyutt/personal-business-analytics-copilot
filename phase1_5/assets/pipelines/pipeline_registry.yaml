        join_or_relationship_rule_id: not_applicable
        run_input_manifest_required: true
        run_input_manifest_id: CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1
        run_input_manifest_contract_section: customer_run_input_manifest_contract
        run_input_role: current_qtd
        period_context_source: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
        context_field_bindings:
          reporting_period_id: reporting_period_id
          current_revenue_cutoff_date: current_revenue_cutoff_date
          target_fiscal_quarter: target_fiscal_quarter
          report_mode: report_mode
        runtime_context_inference_allowed: false
        source_instance_selection:
          exact_locked_context_and_input_role_required: true
          scheduled_missing_behavior: notify_once_then_recheck_every_30_minutes_without_limit
          scheduled_multiple_or_unreadable_behavior: block_customer_workflow
          manual_or_backfill_missing_multiple_or_unreadable_behavior: block_customer_workflow
          unconditional_latest_selection_allowed: false

    historical_input_dependencies:
      - dependency_type: Local historical revenue archive
        dataset_id: DS_REVENUE_SALES_ROLLING_DECK_QTD
        input_role: prior_year_full_quarter
        relationship_rule_id: BR_CUSTOMER_REVENUE_PRIOR_YEAR_FULL_QUARTER_SOURCE_SELECTION_V1
        period_context_source: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
        context_field_bindings:
          prior_year_full_quarter_period_id: prior_year_full_quarter_period_id
          prior_year_fiscal_quarter: prior_year_fiscal_quarter
        run_input_manifest_id: CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1
        run_input_role: prior_year_full_quarter
        run_input_manifest_required: true
        exact_single_readable_source_required: true
        missing_multiple_or_unreadable_action: block_customer_workflow
        wait_or_recheck_allowed: false
        unconditional_latest_selection_allowed: false
      - dependency_type: Local historical revenue archive
        dataset_id: DS_REVENUE_SALES_ROLLING_DECK_QTD
        input_role: prior_year_comparable
        relationship_rule_id: BR_CUSTOMER_REVENUE_PRIOR_YEAR_COMPARABLE_SOURCE_SELECTION_V1
        period_context_source: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
        context_field_bindings:
          prior_comparable_as_of_date: prior_comparable_as_of_date
          prior_year_fiscal_quarter: prior_year_fiscal_quarter
        run_input_manifest_id: CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1
        run_input_role: prior_year_comparable
        run_input_manifest_required: true
        exact_single_readable_source_required: true
        missing_multiple_or_unreadable_action: block_customer_workflow
        wait_or_recheck_allowed: false
        unconditional_latest_selection_allowed: false

    local_input_dependencies:
      - input_role: quarter_baseline_and_template
        external_asset_id: TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY
        required: conditional_on_candidate_presence
        fallback: Require the previous reporting period validated output for layout/customer list/industry; rebuild C and leave D/O/P blank.
        local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
        eligibility_contract_section: quarter_template_eligibility_contract
        eligibility_must_match_locked_context_fields: [current_year, quarter]
        confirmed_template_version_required_only_when_candidate_exists: true
        candidate_absent_allows_previous_output_layout_fallback: true
        candidate_present_but_invalid_action: block_customer_workflow
        filename_parsing_for_eligibility_allowed: false
      - input_role: immediately_preceding_approved_output
        producer_workflow_id: WF_CUSTOMER_REVENUE_DETAIL
        required: true_for_regular_week_or_when_quarter_first_week_template_is_unavailable
        read_only: true
        output_mapping_id: OM_CUSTOMER_REVENUE_DETAIL_EXCEL_V1
        local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
        metadata_contract_section: previous_reporting_period_output_metadata_contract
        selection_contract:
          reporting_period_id_must_equal_locked_expected_previous_reporting_period_id: true
          workflow_reporting_date_must_equal_locked_expected_previous_reporting_date: true
          selected_business_cutoff_is_read_from_metadata_not_inferred_from_cadence: true
          expected_period_identity_derived_before_metadata_selection: true
          validation_status_required: passed
          history_consumption_status_required: consumable
          same_reporting_period_attempt_allowed: false
          unique_highest_output_version_within_exact_expected_period_required: true
          older_reporting_period_fallback_allowed: false
          ambiguous_invalid_or_unresolvable_action: block_customer_workflow
          missing_action:
            regular_week: block_customer_workflow
            quarter_first_week_with_eligible_current_quarter_template: allow_missing_and_keep_M_N_Q_R_blank_with_I_equal_F
            quarter_first_week_without_eligible_current_quarter_template: block_customer_workflow
          quarter_first_week_selected_output_usage_limit: [layout, customer_membership, detail_A_industry]
          quarter_first_week_value_semantics: { M_N_Q_R: blank, I: F }
          filename_parsing_for_selection_allowed: false
        same_week_rerun:
          reuse_locked_expected_previous_reporting_date: true
          reuse_locked_expected_previous_reporting_period_id: true
          reuse_locked_previous_reporting_period_selection: true
          earlier_same_week_attempt_must_not_shift_M_N_Q_R: true
      - input_role: effective_layout_source
        required: true
        local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
        contract_section: effective_layout_source_contract
        bind_context_fields: [effective_layout_source, effective_layout_reference]
        runtime_alternate_selection_allowed: false
      - input_role: advertiser_ownership_mapping
        external_asset_id: MAP_ADVERTISER_NAME_OWNERSHIP_INDEX
        required: true
        read_only: true
        runtime_version_context_field: advertiser_mapping_version
        exact_field_bindings:
          source_advertiser_name: advertiser_name
          canonical_raw_advertiser_name: raw_advertiser_name
          mapping_key: raw_advertiser_name
          mapping_value: mapped_customer_or_group_name
          industry: industry_level_1
        missing_or_ambiguous_asset_action: block_customer_workflow
      - input_role: quarter_top20_membership_state
        required: lookup_required_but_state_may_be_absent_before_first_freeze
        local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
        contract_section: quarter_top20_membership_state_contract
        write_contract_section: quarter_top20_membership_state_write_contract
        exact_context_key_fields: [current_year, quarter, membership_type]
        bind_context_fields: [selected_prior_year_top20_membership_reference, selected_forecast_top20_membership_reference]
        duplicate_or_previous_quarter_state_action: block_customer_workflow
        first_freeze_write_failure_action: block_customer_workflow_and_mark_output_not_consumable
        same_week_rerun_write_semantics: idempotent_reuse_only
        identical_payload_different_proposed_reference_action: discard_proposed_reference_and_reuse_existing_state_and_reference_without_write
        nonidentical_or_unverifiable_payload_conflict_action: block_customer_workflow_and_mark_output_not_consumable

    execution:
      execution_mode: sequential
      workflow_run_context_id: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
      workflow_run_context_lock_required_before_data_collection: true
      context_binding_required_before_business_rule_processing: true
      canonical_context_field_ids:
        - workflow_execution_date
        - current_revenue_cutoff_date
        - current_year
        - prior_year
        - quarter
        - target_fiscal_quarter
        - prior_year_fiscal_quarter
        - report_mode
        - reporting_period_id
        - workflow_reporting_date
        - current_source_report_date
        - expected_previous_reporting_date
        - expected_previous_reporting_period_id
        - previous_reporting_period_id
        - prior_comparable_as_of_date
        - prior_year_full_quarter_period_id
        - selected_previous_output_current_revenue_cutoff_date
        - selected_previous_output_target_fiscal_quarter
        - prior_week_comparable_as_of_date
        - quarter_template_availability
        - forecast_D_availability
        - confirmed_template_version
        - selected_template_file_reference
        - advertiser_mapping_version
        - effective_layout_source
        - effective_layout_reference
        - selected_prior_year_top20_membership_reference
        - selected_forecast_top20_membership_reference
      target_fiscal_quarter_derivation_binding:
        source_field_ids: [current_year, quarter]
        target_field_id: target_fiscal_quarter
        derive_before_context_lock: true
        runtime_code_guessing_allowed: false
      local_input_prelock_resolution_required: true
      customer_run_input_manifest_id: CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1
      customer_run_input_manifest_validated_before_data_collection: true
      weekly_runtime_contract_reuse_allowed: false
      postlock_template_or_previous_output_reselection_allowed: false
      schedule: { day_of_week: Thursday, start_time: "17:40", timezone: Asia/Shanghai }
      source_wait_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
      manual_trigger_allowed: true
      manual_trigger_required_parameters: [WorkflowExecutionDate, CurrentRevenueCutoffDate, CurrentYear, Quarter]
      manual_parameter_to_context_bindings:
        WorkflowExecutionDate: workflow_execution_date
        CurrentRevenueCutoffDate: current_revenue_cutoff_date
        CurrentYear: current_year
        Quarter: quarter
        automatic_alias_or_value_inference_allowed: false
      stages: [DATA_COLLECTION, DATA_STANDARDIZATION, BUSINESS_RULE_PROCESSING, METRIC_CALCULATION, VALIDATION]
      mapping_profile_ids:
        - MAP_REVENUE_SALES_ROLLING_DECK_QTD_V1
      customer_standard_field_bindings:
        advertiser_name: raw_advertiser_name
        MAP_ADVERTISER_NAME_OWNERSHIP_INDEX.raw_advertiser_name: raw_advertiser_name
        MAP_ADVERTISER_NAME_OWNERSHIP_INDEX.mapped_customer_or_group_name: mapped_customer_or_group_name
        industry_level_1: industry_level_1
        MAP_REVENUE_SALES_ROLLING_DECK_QTD_V1.customer_name_is_customer_identity_authority: false
        customer_name: mapped_customer_or_group_name_or_unmatched_raw_advertiser_fallback
      ordered_rule_set_ids:
        - BR_CUSTOMER_REVENUE_TECHNICAL_ELIGIBILITY_ADAPTER_V1
        - BR_CUSTOMER_REVENUE_PRIOR_YEAR_FULL_QUARTER_SOURCE_SELECTION_V1
        - BR_CUSTOMER_REVENUE_PRIOR_YEAR_COMPARABLE_SOURCE_SELECTION_V1
      metric_variant_ids:
        - MV_CUSTOMER_PRIOR_YEAR_QUARTER_REVENUE_V1
        - MV_CUSTOMER_CURRENT_QUARTER_FORECAST_V1
        - MV_CUSTOMER_CURRENT_QTD_PERFORMANCE_V1
        - MV_CUSTOMER_CURRENT_QTD_EXECUTED_V1
        - MV_CUSTOMER_PRIOR_YEAR_QTD_PERFORMANCE_V1
        - MV_CUSTOMER_PRIOR_YEAR_QTD_EXECUTED_V1
        - MV_CUSTOMER_PRIOR_WEEK_QTD_PERFORMANCE_V1
        - MV_CUSTOMER_PRIOR_WEEK_QTD_EXECUTED_V1
        - MV_CUSTOMER_PRIOR_OUTPUT_COMPARABLE_PERFORMANCE_V1
        - MV_CUSTOMER_PRIOR_OUTPUT_COMPARABLE_EXECUTED_V1
        - MV_CUSTOMER_FORECAST_YOY_V1
        - MV_CUSTOMER_FORECAST_COMPLETION_RATE_V1
        - MV_CUSTOMER_PERFORMANCE_YOY_V1
        - MV_CUSTOMER_WEEKLY_INCREMENTAL_PERFORMANCE_V1
      validation_rule_ids: []
      missing_current_customer_semantics:
        applies_after_customer_universe_is_built: true
        customer_absent_from_validated_current_snapshot: { F: 0, J: 0 }
        missing_value_status_allowed: false

    outputs:
      result_contract_ids: [RC_CUSTOMER_REVENUE_DETAIL_WEEKLY]
      output_mapping_ids: [OM_CUSTOMER_REVENUE_DETAIL_EXCEL_V1]
      write_to_metrics_store: false
      publish_cross_workflow_result_contract: false
      local_only: true

    recovery:
      recovery_mode: rerun_pipeline_from_start
      retry_scope: workflow_only
      resume_from_failed_stage: false
      restart_from_pipeline_start: true
      restart_must_be_idempotent: true
      stage_checkpoint_persistence_required: false
      source_recovery_by_scope:
        scheduled_current_qtd: { notify_once: true, recheck_interval_minutes: 30, maximum_rechecks: unlimited, auto_resume_on_arrival: true }
        scheduled_historical_roles: { action: block_customer_workflow, recheck_allowed: false }
        manual_or_backfill_all_roles: { action: block_customer_workflow, recheck_allowed: false }
        rerun_locked_roles: { action: block_customer_workflow, recheck_allowed: false }
      downstream_impact_rule: no impact outside WF_CUSTOMER_REVENUE_DETAIL

    governance:
      effective_from: 2026-08-07
      evidence_sources:
        - phase1_5/workflows/customer_revenue_detail/WORKFLOW_v1.md
        - Owner confirmations dated 2026-08-07
      change_reason: Initialize the independent Customer Revenue Detail Workflow design assets.

constraints:
  dataset_dependencies_must_trace_to_active_data_sources: true
  future_backlog_sources_cannot_create_pipelines: true
  dependencies_must_be_explicit: true
  auto_dependency_by_field_similarity: false
  auto_dependency_by_name_match: false
  auto_dependency_by_history: false
  query_session_recovery_policy:
    policy_id: QUERY_SESSION_REFRESH_AND_RETRY_POLICY_V1
    binding_source: phase1_5/assets/execution_policies/QUERY_SESSION_REFRESH_AND_RETRY_POLICY_V1.yaml
    automatic_inheritance_by_source_name_allowed: false
    explicit_pipeline_binding_required: true
  output_assembly_may_calculate: false
  outlook_auto_send: false
  pipeline_owner_for_all_current_and_future_pipelines: WORKFLOW_OWNER
  business_approver_for_all_current_and_future_pipelines: WORKFLOW_OWNER
  source_dataset_query_asset_owners_remain_in_source_registries: true
  all_pipelines_allow_owner_manual_trigger: true
  manual_trigger_default_scope: target_pipeline_only
  manual_trigger_downstream_rerun: explicit_dependency_graph_only
  manual_trigger_period_requirement:
    required: true
    accepted_business_period_inputs:
      - Target Weekly Business Report period
      - Revenue data cutoff date
    missing_input_action: >
      暂停手动触发并向Owner确认，
      禁止根据当前日期自动推断业务周期。
  workflow_specific_manual_trigger_requirements:
    WF_CUSTOMER_REVENUE_DETAIL:
      required_inputs: [WorkflowExecutionDate, CurrentRevenueCutoffDate, CurrentYear, Quarter]
      missing_input_action: block_customer_workflow_only
  regular_inventory_pipeline_history_strategy:
    applies_to: All regular inventory Pipelines
    excludes: Anomaly-triggered customer analysis Pipelines
    normal_current_period_query_count: 1
    prior_period_source: Weekly Inventory Historical Metric Result Store
    non_material_missing_history_action: Ignore and continue
    material_missing_history_action: >
      自动补查一次对应缺失周，
      验证并补写Metrics Store后继续。
    repair_failure_action: Notify owner and pause affected Pipeline
  advertising_product_inventory_source_routing:
    regular_patch_products:
      source_pipeline_id: PL_INVENTORY_PATCH_WEEKLY
      product_routing_asset_id: BR_APOLLO_PRODUCT_FILTER_MAPPING
    all_products_except_regular_patch:
      source_pipeline_id: PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
      product_routing_asset_id: BR_APOLLO_PRODUCT_FILTER_MAPPING
    confirmed_specific_binding:
      product: Brand Moment
      source_pipeline_id: PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
  mvp_pipeline_execution:
    pipeline_ids:
      - PL_REVENUE_TECHNICAL_WEEKLY
      - PL_REVENUE_CTV_WEEKLY
      - PL_REVENUE_SMART_SPEAKER_WEEKLY
      - PL_REVENUE_FAST_VERSION_WEEKLY
      - PL_INVENTORY_FULL_SITE_WEEKLY
      - PL_INVENTORY_PATCH_WEEKLY
      - PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
      - PL_ADVERTISING_BRAND_MOMENT_DELIVERY_WEEKLY
      - PL_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WEEKLY
      - PL_USER_ANALYTICS_PLATFORM_DAU_WEEKLY
      - PL_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
      - PL_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
    first_phase_scheduling_mode: sequential
    registered_pipeline_order_required: true
    parallel_scheduler_required: false
    failed_run_recovery: rerun_pipeline_from_start
    stage_checkpointing_required: false
    resume_from_failed_stage_required: false
  workflow_runtime_contracts:
    applies_by_workflow_scope: true
    workflow_scopes:
      WF_WEEKLY_BUSINESS_REPORT:
        contract_bundle_source: phase1_5/assets/execution/weekly_workflow_runtime_contracts_v1.yaml
      WF_CUSTOMER_REVENUE_DETAIL:
        context_source: phase1_5/assets/execution/customer_revenue_detail_run_context_v1.yaml
        manifest_source: phase1_5/assets/execution/customer_revenue_detail_local_input_contracts_v1.yaml#customer_run_input_manifest_contract
        weekly_contract_reuse_allowed: false
    unscoped_contract_fallback_allowed: false
    workflow_run_context_required_for_all_pipelines: true
    run_input_manifest_required_for_all_dataset_inputs: true
    supported_run_types_by_workflow:
      WF_WEEKLY_BUSINESS_REPORT: [scheduled, manual, backfill]
      WF_CUSTOMER_REVENUE_DETAIL: [scheduled, manual, backfill, rerun]
    outlook_apollo_novabi_execution_date_inference_allowed: false
    product_parameter_must_be_explicit: true
  result_field_consumption:
    calculation_allowed_value_statuses: [valid_value]
    output_allowed_value_statuses: [valid_value]
    missing_and_not_applicable_require_explicit_field_contract: true
    pending_confirmation_consumption_allowed: false
  workflow_completion_status:
    allowed_statuses: [complete_draft, partial_draft, blocked]
    required_pipeline_fallback_draft_status: partial_draft
    partial_draft_warning_required: true
    partial_draft_may_be_labeled_complete_success: false
