  - pipeline_id: PL_REVENUE_SMART_SPEAKER_WEEKLY
    pipeline_name: 智能音箱周度收入分析 Pipeline
    business_domain: Revenue
    business_line: Smart Speaker
    business_context_id: CTX_REVENUE_SMART_SPEAKER_WEEKLY
    trigger_type: Scheduled
    owner: WORKFLOW_OWNER
    business_approver: WORKFLOW_OWNER
    source_and_data_owners: Inherit from Data Source and Dataset registries
    version: 0.1.0-draft
    approval_status: registry_initialized

    pipeline_boundary:
      start: >
        通过Apollo奇胜执行收入查询中的智能音箱收入查询模板，
        获取显式指定日期范围的收入结果。
      includes:
        - 执行智能音箱收入查询模板
        - 获取单行日期区间收入汇总结果
        - 执行后续已确认的标准化、业务规则与指标计算
        - 生成并验证智能音箱周度收入结果
      end: Generate a validated Smart Speaker weekly revenue Result Contract
      excludes:
        - Fast Version revenue processing
        - Technical Line revenue processing
        - CTV revenue processing
        - Weekly Report Revenue Section Assembly
        - Weekly Business Report Output Assembly
        - Outlook Draft creation or sending
      minimum_execution_unit: pipeline
      independently_runnable: true
      independently_validatable: true
      independently_retryable: true

    workflow_bindings:
      - workflow_id: WF_WEEKLY_BUSINESS_REPORT
        required_or_optional: required
        failure_scope: Weekly Report Revenue Section only
        execution_order_or_dependency: >
          Thursday 17:30 revenue-stage pipeline.
          No predecessor dependency on the other revenue pipelines;
          execute sequentially in the registered MVP order.
        failure_handling:
          immediate_action:
            - Notify owner of the failure reason
            - Provide a proposed resolution or required owner action
          recovery_window: >
            等待并允许智能音箱收入Pipeline独立修复或补跑，
            不阻断其他Domain Pipeline继续执行。
          friday_fallback: >
            如果星期五库存等模块完成后收入模块仍未修复成功，
            则先创建仅包含其他已完成模块的Outlook Draft。
          revenue_section_representation_in_fallback_draft: >
            保留“二、本周收入情况”模块标题，
            并注明“收入数据处理失败，待补充”。

    dataset_dependencies:
      - dataset_id: DS_REVENUE_APOLLO_BUSINESS_LINE_SUMMARY
        query_asset_id: QRY_APOLLO_QISHENG_EXECUTION_REVENUE
        query_template_parameter: 智能音箱收入查询模板
        dataset_version_constraint: ">=0.1.0,<0.2.0"
        dependency_role: Smart Speaker date-range revenue result
        required: true
        join_or_relationship_rule_id: not_applicable
        run_input_manifest_required: true
        period_context_source: workflow_run_context

    historical_input_dependencies:
      - dependency_type: Metric Result Store
        store_id: STORE_WEEKLY_REVENUE_HISTORICAL
        store_asset_id: STORE_ASSET_WEEKLY_REVENUE_SMART_SPEAKER
        role: Validated weekly revenue history for QTD accumulation
        read_required_or_optional: required
        missing_data_recovery:
          materiality_basis: Explicit Metric and Business Rule dependency only
          non_material_missing_action: Ignore and continue
          material_missing_action: >
            在本Pipeline内启动有限自动修复，
            不按全部历史缺口逐周回填。
          max_automatic_repair_queries: 2
          repair_query_plan:
            - query_role: One missing week revenue
              date_range: The explicitly identified missing business week
            - query_role: Current-quarter cumulative revenue
              start_date: Current fiscal-quarter first day
              end_date: Target revenue cutoff date
          sequential_backfill_of_all_missing_weeks: false
          repair_failure_conditions:
            - Query execution failed
            - Query returned empty result
            - Query result failed validation
          repair_failure_action: Notify owner and pause this Pipeline
          successful_repair_persistence: >
            补查结果验证通过后，
            将能够完整验证的缺失周记录补写回Store Asset，
            并使用当Q截止累计补查结果完成目标周QTD，
            完成回读验证后再继续。

    execution:
      schedule:
        day_of_week: Thursday
        start_time: "17:30"
        timezone: Asia/Shanghai
      manual_trigger_allowed: true
      query_invocations:
        - invocation_id: INV_APOLLO_SMART_SPEAKER_WEEKLY_REVENUE
          query_count_per_run: 1
          query_template: 智能音箱收入查询模板
