      retry_scope: pipeline_only
      recovery_mode: rerun_pipeline_from_start
      resume_from_failed_stage: false
      restart_from_pipeline_start: true
      restart_must_be_idempotent: true
      stage_checkpoint_persistence_required: false
      downstream_impact_rule: explicit_dependency_graph_only

    governance:
      effective_from: 2026-08-08
      evidence_sources:
        - Dataset Inventory
        - Dataset Readiness Matrix
      change_reason: Initial Pipeline Registry definition

  - pipeline_id: PL_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
    pipeline_name: 分广告产品客户投放变化分析 Pipeline
    business_domain: Advertising
    business_line: Workflow-supplied advertising product
    business_context_id: CTX_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
    trigger_type: Conditional
    owner: WORKFLOW_OWNER
    business_approver: WORKFLOW_OWNER
    source_and_data_owners: Inherit from Data Source and Dataset registries
    version: 0.1.0-draft
    approval_status: registry_initialized
    analysis_only_pipeline: true
    metric_variant_creation_for_result_fields: prohibited

    pipeline_boundary:
      start: >
        接收一个已经通过售卖率异常触发条件的明确广告产品，
        以及当前周期和对比周期参数。
      includes:
        - 接收明确产品与周期参数
        - 执行客户维度投放查询
        - 执行后续已确认的客户变化筛选、排序与数量限制规则
        - 生成并验证单产品客户投放变化分析结果
      end: Generate one validated product-level customer change analysis Result Contract
      excludes:
        - Sell-through calculation
        - Sell-through anomaly detection
        - Product filter inference by name similarity
        - Other product customer analysis within the same Pipeline Run
        - Weekly Report Inventory Section Assembly
        - Outlook Draft creation or sending
      minimum_execution_unit: One product-scoped Pipeline Run
      independently_runnable: true
      independently_validatable: true
      independently_retryable: true

    workflow_bindings:
      - workflow_id: WF_WEEKLY_BUSINESS_REPORT
        required_or_optional: optional
        failure_scope: Triggered product customer explanation only
        execution_order_or_dependency: >
          Run only after a validated product sell-through result satisfies
          the explicitly configured anomaly trigger.
        failure_handling:
          trigger_not_met:
            classification: normal_omission
            notify_owner: false
            fail_pipeline: false
            action: Do not execute the customer query or generate an empty Contract
          qualified_customer_zero_rows:
            classification: normal_empty_record_set
            notify_owner: false
            fail_pipeline: false
            action: Generate the validated product-level Contract context with an empty customer record set so fixed product-change-only commentary remains available
          raw_query_zero_rows:
            classification: source_or_routing_exception
            notify_owner: true
            fail_pipeline: false
            action: Omit target product customer analysis and continue Workflow
          query_failure:
            classification: source_or_routing_exception
            notify_owner: true
            fail_pipeline: false
            action: Omit target product customer analysis and continue Workflow
          invalid_product_mapping:
            classification: source_or_routing_exception
            notify_owner: true
            fail_pipeline: false
            action: Omit target product customer analysis and continue Workflow
          block_workflow: false

    trigger_contract:
      producer_result_type: Validated product sell-through result
      trigger_policy_id: POLICY_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS_V1
      confirmed_rule_input: abs(sell_through_rate_wow_change_pp) >= configured threshold
      current_default_threshold_value: 10.0
      current_default_threshold_unit: percentage_point
      product_override_supported: true
      one_run_per_triggered_product: true
      multiple_product_runs_may_execute_in_parallel: false
      first_phase_scheduling_mode: sequential
      upstream_trigger_field_routing:
        routing_role: runtime_trigger_input
        result_contract_lineage_summary_is_runtime_input: false
        exactly_one_route_required: true
        routes:
          - route_id: regular_patch_products
            route_condition: target_ad_product_name is explicitly classified as a regular patch product
            result_contract_id: RC_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
            result_field_id: patch_brand_sell_through_wow_change_pp
          - route_id: all_products_except_regular_patch_and_brand_moment
            route_condition: target_ad_product_name is explicitly classified as neither a regular patch product nor Brand Moment
            result_contract_id: RC_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
            result_field_id: non_patch_product_brand_sell_through_wow_change_pp
          - route_id: brand_moment
            route_condition: target_ad_product_name is explicitly classified as Brand Moment
            result_contract_id: RC_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WEEKLY
            result_field_id: sell_through_wow_change_pp

    dataset_dependencies:
      - dataset_id: DS_AD_PRODUCT_CUSTOMER_DELIVERY_CHANGE_ANALYSIS
        query_asset_id: QRY_APOLLO_PRODUCT_CUSTOMER_DELIVERY_CHANGE_ANALYSIS
        dataset_version_constraint: ">=0.1.0,<0.2.0"
        dependency_role: Product-customer delivery change input
        required_when_triggered: true
        join_or_relationship_rule_id: not_applicable
        run_input_manifest_required: true
        period_context_source: workflow_run_context
        business_rule_processing_policy_id: POLICY_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS_V1

    execution:
      schedule:
        stage: Friday inventory analysis stage
        start_condition: Product-level anomaly trigger satisfied
        timezone: Asia/Shanghai
      manual_trigger_allowed: true
      manual_trigger_additional_required_input:
        - Explicit advertising product
        - Current period
        - Comparison period
      query_invocations:
        - invocation_id: INV_APOLLO_PRODUCT_CUSTOMER_CURRENT_WEEK
          query_role: Current-week customer delivery summary
          product_parameter: Explicit triggered product
          date_parameters:
            start_date: Workflow Run Context current_period_start_date
            end_date: Workflow Run Context current_period_end_date
          grouping_dimension: 广告主
          detail_dimension_date: deselected
          expected_result_shape: Customer-level period summary rows
        - invocation_id: INV_APOLLO_PRODUCT_CUSTOMER_PREVIOUS_WEEK
          query_role: Previous-week customer delivery summary
          product_parameter: Same explicit triggered product
          date_parameters:
            start_date: Workflow Run Context comparison_period_start_date
            end_date: Workflow Run Context comparison_period_end_date
          grouping_dimension: 广告主
          detail_dimension_date: deselected
          expected_result_shape: Customer-level period summary rows
      cross_period_comparison_input: Two independently validated weekly customer summaries
      cross_period_customer_matching:
        match_key: customer_id
        fuzzy_customer_name_matching_allowed: false
        duplicate_product_period_customer_id_action:
          - Exclude every row for the duplicate key
          - Notify owner
          - Do not automatically merge or select a row
        negative_impression_count_action:
          - Exclude the row before cross-period matching
          - Notify owner
          - Do not include the row in change, materiality, sorting, or ranking
        current_only_customer_comparison_period_impression_count: 0
        comparison_only_customer_current_period_impression_count: 0
        same_customer_id_name_conflict_action:
          - Notify owner
          - Exclude the conflicting customer row
          - Do not automatically choose or merge customer names
      stages:
        - DATA_COLLECTION
        - DATA_STANDARDIZATION
        - BUSINESS_RULE_PROCESSING
        - VALIDATION
      mapping_profile_ids:
        - MAP_ADVERTISING_APOLLO_PRODUCT_CUSTOMER_DELIVERY_CHANGE_V1
      ordered_rule_set_ids: []
      business_rule_processing_policy_id: POLICY_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS_V1
      business_rule_processing_responsibilities:
        - duplicate_and_negative_row_exclusion
        - exact_customer_id_cross_period_matching
        - impression_change_derivation
        - materiality_filtering
        - scenario_ranking_measure_derivation
        - sorting
        - customer_ranking
      metric_variant_ids: []
      validation_rule_ids: []

    outputs:
      result_contract_ids:
        - RC_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
      result_contract_cardinality: One result per triggered product Pipeline Run
      result_contract_shape: record_set
      result_record_grain:
        - target_ad_product_name
        - current_reporting_period
        - customer_id
      final_customer_grain_owner_confirmation:
        key: customer_id
        mapped_customer_or_group_name_role: display_name_only
        aggregate_multiple_customer_ids_by_mapped_name: false
      no_placeholder_result_contract_when:
        - trigger_not_met
        - raw_query_zero_rows
        - query_failure
        - invalid_product_mapping
      qualified_customer_zero_rows_result:
        result_contract_generated: true
        product_level_contract_fields_required: true
        customer_record_set_row_count: 0
        fabricated_customer_record_allowed: false
      omitted_result_behavior: Apply explicit normal-omission or exception notification semantics and continue Weekly Workflow
      output_mapping_ids:
        - OM_WEEKLY_BUSINESS_REPORT_V1
      write_to_metrics_store: false

    recovery:
      retry_scope: One product-scoped Pipeline Run only
      recovery_mode: rerun_pipeline_from_start
      resume_from_failed_stage: false
      restart_from_pipeline_start: true
      restart_must_be_idempotent: true
      stage_checkpoint_persistence_required: false
      downstream_impact_rule: Triggered product explanation only

    governance:
      effective_from: 2026-08-08
      evidence_sources:
        - Dataset Inventory
        - Dataset Readiness Matrix
        - Confirmed historical Weekly Report customer-analysis rules
      change_reason: Initial conditional Pipeline definition

  - pipeline_id: PL_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
    pipeline_name: 分产品售卖率周度计算 Pipeline
    business_domain: Inventory
    business_line: Workflow-supplied product excluding Brand Moment
    business_context_id: CTX_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
    trigger_type: Dependency-triggered
    owner: WORKFLOW_OWNER
    business_approver: WORKFLOW_OWNER
    source_and_data_owners: Inherit from upstream Result Contracts
    version: 0.1.0-draft
    approval_status: registry_initialized

    pipeline_boundary:
      start: >
        接收一个明确的非品牌时刻产品、业务周期、库存来源路由
        以及已确认的Metric Variant。
      includes:
        - 根据显式产品路由读取一个库存上游Result Contract
        - 验证产品、周期、Context与Metric Variant兼容性
        - 执行该产品已确认的售卖率Metric Variant
        - 验证并保存单产品售卖率结果
      end: Generate one validated product-scoped weekly sell-through Result Contract
      excludes:
        - Brand Moment sell-through calculation
        - Product membership inference by name
        - Metric Variant selection by similarity or history
        - Other product calculations within the same Pipeline Run
        - Weekly Report Inventory Section Assembly
        - Outlook Draft creation or sending
      minimum_execution_unit: One product-scoped Pipeline Run
      independently_runnable: true
      independently_validatable: true
      independently_retryable: true

    workflow_bindings:
      - workflow_id: WF_WEEKLY_BUSINESS_REPORT
        required_or_optional: required_per_configured_report_product
        failure_scope: Target product sell-through result only
        execution_order_or_dependency: >
          Run after the explicitly routed upstream inventory Result Contract
          for the target product passes validation.
        failure_handling:
          immediate_action:
            - Notify owner of the failure reason
            - Block only the target product sell-through result
          inventory_section_product_representation:
            retain_product_row: true
            sell_through_value: blank
            annotation: 售卖率计算失败，待补充
            other_products_continue: true
            workflow_continues: true

    dataset_dependencies: []

    result_contract_dependency_routing:
      product_routing_asset_id: BR_APOLLO_PRODUCT_FILTER_MAPPING
      confirmed_routes:
        regular_patch_products:
          producer_pipeline_id: PL_INVENTORY_PATCH_WEEKLY
          result_contract_id: RC_INVENTORY_PATCH_WEEKLY
        all_products_except_regular_patch_and_brand_moment:
          producer_pipeline_id: PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
          result_contract_id: RC_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
      brand_moment_excluded: true

    historical_input_dependencies:
      - dependency_type: Metric Result Store
        store_id: STORE_WEEKLY_INVENTORY_HISTORICAL
        store_asset_id: STORE_ASSET_WEEKLY_INVENTORY_PRODUCT_SELL_THROUGH
        role: Prior-week validated product sell-through result
        product_dimension_required: true
        read_required_or_optional: required_when_referenced_by_metric
        missing_data_recovery:
          materiality_basis: Explicit Metric and Business Rule dependency only
          non_material_missing_action: Ignore and continue
          material_missing_action: >
            按目标产品显式路由补跑上一周库存上游，
            重新计算并补写上一周产品售卖率后继续。
          repair_failure_action: Notify owner and pause target product Pipeline Run

    execution:
      schedule:
        stage: Friday inventory calculation stage
        start_condition: Target product upstream inventory Result Contract validated
        timezone: Asia/Shanghai
      manual_trigger_allowed: true
      manual_trigger_additional_required_input:
        - Explicit product
        - Target business period
        - Explicit Metric Variant ID
      one_run_per_product: true
      multiple_product_runs_may_execute_in_parallel: false
      first_phase_scheduling_mode: sequential
      stages:
        - DATA_COLLECTION
        - DATA_STANDARDIZATION
        - BUSINESS_RULE_PROCESSING
        - METRIC_CALCULATION
        - VALIDATION
      mapping_profile_ids: []
      ordered_rule_set_ids: []
      metric_variant_ids:
        - MV_INVENTORY_PATCH_BRAND_SELL_THROUGH_RATE_V1
        - MV_INVENTORY_PATCH_BRAND_SELL_THROUGH_WOW_CHANGE_V1
        - MV_INVENTORY_NON_PATCH_PRODUCT_BRAND_SELL_THROUGH_RATE_V1
        - MV_INVENTORY_NON_PATCH_PRODUCT_BRAND_SELL_THROUGH_WOW_CHANGE_V1
      validation_rule_ids: []

    outputs:
      result_contract_ids:
        - RC_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
      result_contract_cardinality: One result per product-scoped Pipeline Run
      output_mapping_ids:
        - OM_WEEKLY_BUSINESS_REPORT_V1
      write_to_metrics_store: true
      metric_result_store_id: STORE_WEEKLY_INVENTORY_HISTORICAL
      metric_result_store_asset_id: STORE_ASSET_WEEKLY_INVENTORY_PRODUCT_SELL_THROUGH
      persistence_failure_result:
        pipeline_status: COMPLETED_WITH_WARNING
        validated_result_remains_usable: true
        allow_result_into_inventory_section: true
        notify_owner: true
        notification_reason: Historical Metric Result Store write failure

    downstream_consumers:
      - pipeline_id: PL_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
        dependency_role: Validated sell-through anomaly trigger input
        trigger_policy_id: POLICY_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS_V1
      - component: Weekly Report Inventory Section Assembly
        behavior: Consume validated product result only
        may_calculate: false

    recovery:
      retry_scope: One product-scoped Pipeline Run only
      recovery_mode: rerun_pipeline_from_start
      resume_from_failed_stage: false
      restart_from_pipeline_start: true
      restart_must_be_idempotent: true
      stage_checkpoint_persistence_required: false
      upstream_rerun_required_only_if_contract_invalidated: true
      downstream_impact_rule: Target product outputs only

    governance:
      effective_from: 2026-08-08
      evidence_sources:
        - Pipeline Registry upstream contracts
        - Confirmed advertising product inventory source routing
      change_reason: Initial parameterized derived Pipeline definition

constraints:
  dataset_dependencies_must_trace_to_active_data_sources: true
  future_backlog_sources_cannot_create_pipelines: true
  dependencies_must_be_explicit: true
  auto_dependency_by_field_similarity: false
  auto_dependency_by_name_match: false
  auto_dependency_by_history: false
  query_session_recovery_policy:
    policy_id: QUERY_SESSION_REFRESH_AND_RETRY_POLICY_V1
    binding_source: phase1_5/assets/execution_policies/QUERY_SESSION_REFRESH_AND_RETRY_POLICY_V1.yaml
    automatic_inheritance_by_source_name_allowed: false
    explicit_pipeline_binding_required: true
  output_assembly_may_calculate: false
  outlook_auto_send: false
  pipeline_owner_for_all_current_and_future_pipelines: WORKFLOW_OWNER
  business_approver_for_all_current_and_future_pipelines: WORKFLOW_OWNER
  source_dataset_query_asset_owners_remain_in_source_registries: true
  all_pipelines_allow_owner_manual_trigger: true
  manual_trigger_default_scope: target_pipeline_only
  manual_trigger_downstream_rerun: explicit_dependency_graph_only
  manual_trigger_period_requirement:
    required: true
    accepted_business_period_inputs:
      - Target Weekly Business Report period
      - Revenue data cutoff date
    missing_input_action: >
      暂停手动触发并向Owner确认，
      禁止根据当前日期自动推断业务周期。
  regular_inventory_pipeline_history_strategy:
    applies_to: All regular inventory Pipelines
    excludes: Anomaly-triggered customer analysis Pipelines
    normal_current_period_query_count: 1
    prior_period_source: Weekly Inventory Historical Metric Result Store
    non_material_missing_history_action: Ignore and continue
    material_missing_history_action: >
      自动补查一次对应缺失周，
      验证并补写Metrics Store后继续。
    repair_failure_action: Notify owner and pause affected Pipeline
  advertising_product_inventory_source_routing:
    regular_patch_products:
      source_pipeline_id: PL_INVENTORY_PATCH_WEEKLY
      product_routing_asset_id: BR_APOLLO_PRODUCT_FILTER_MAPPING
    all_products_except_regular_patch:
      source_pipeline_id: PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
      product_routing_asset_id: BR_APOLLO_PRODUCT_FILTER_MAPPING
    confirmed_specific_binding:
      product: Brand Moment
      source_pipeline_id: PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
  mvp_pipeline_execution:
    pipeline_ids:
      - PL_REVENUE_TECHNICAL_WEEKLY
      - PL_REVENUE_CTV_WEEKLY
      - PL_REVENUE_SMART_SPEAKER_WEEKLY
      - PL_REVENUE_FAST_VERSION_WEEKLY
      - PL_INVENTORY_FULL_SITE_WEEKLY
      - PL_INVENTORY_PATCH_WEEKLY
      - PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
      - PL_ADVERTISING_BRAND_MOMENT_DELIVERY_WEEKLY
      - PL_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WEEKLY
      - PL_USER_ANALYTICS_PLATFORM_DAU_WEEKLY
      - PL_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
      - PL_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
    first_phase_scheduling_mode: sequential
    registered_pipeline_order_required: true
    parallel_scheduler_required: false
    failed_run_recovery: rerun_pipeline_from_start
    stage_checkpointing_required: false
    resume_from_failed_stage_required: false
  workflow_runtime_contracts:
    contract_bundle_source: phase1_5/assets/execution/weekly_workflow_runtime_contracts_v1.yaml
    workflow_run_context_required_for_all_pipelines: true
    run_input_manifest_required_for_all_dataset_inputs: true
    supported_run_types: [scheduled, manual, backfill]
    outlook_apollo_novabi_execution_date_inference_allowed: false
    product_parameter_must_be_explicit: true
  result_field_consumption:
    calculation_allowed_value_statuses: [valid_value]
    output_allowed_value_statuses: [valid_value]
    missing_and_not_applicable_require_explicit_field_contract: true
    pending_confirmation_consumption_allowed: false
  workflow_completion_status:
    allowed_statuses: [complete_draft, partial_draft, blocked]
    required_pipeline_fallback_draft_status: partial_draft
    partial_draft_warning_required: true
    partial_draft_may_be_labeled_complete_success: false
