  - pipeline_id: PL_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
    pipeline_name: 分广告产品客户投放变化分析 Pipeline
    business_domain: Advertising
    business_line: Workflow-supplied advertising product
    business_context_id: CTX_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
    trigger_type: Conditional
    owner: WORKFLOW_OWNER
    business_approver: WORKFLOW_OWNER
    source_and_data_owners: Inherit from Data Source and Dataset registries
    version: 0.1.0-draft
    approval_status: registry_initialized
    analysis_only_pipeline: true
    metric_variant_creation_for_result_fields: prohibited

    pipeline_boundary:
      start: >
        接收一个已经通过售卖率异常触发条件的明确广告产品，
        以及当前周期和对比周期参数。
      includes:
        - 接收明确产品与周期参数
        - 执行客户维度投放查询
        - 执行后续已确认的客户变化筛选、排序与数量限制规则
        - 生成并验证单产品客户投放变化分析结果
      end: Generate one validated product-level customer change analysis Result Contract
      excludes:
        - Sell-through calculation
        - Sell-through anomaly detection
        - Product filter inference by name similarity
        - Other product customer analysis within the same Pipeline Run
        - Weekly Report Inventory Section Assembly
        - Outlook Draft creation or sending
      minimum_execution_unit: One product-scoped Pipeline Run
      independently_runnable: true
      independently_validatable: true
      independently_retryable: true

    workflow_bindings:
      - workflow_id: WF_WEEKLY_BUSINESS_REPORT
        required_or_optional: optional
        failure_scope: Triggered product customer explanation only
        execution_order_or_dependency: >
          Run only after a validated product sell-through result satisfies
          the explicitly configured anomaly trigger.
        failure_handling:
          trigger_not_met:
            classification: normal_omission
            notify_owner: false
            fail_pipeline: false
            action: Do not execute the customer query or generate an empty Contract
          qualified_customer_zero_rows:
            classification: normal_empty_record_set
            notify_owner: false
            fail_pipeline: false
            action: Generate the validated product-level Contract context with an empty customer record set so fixed product-change-only commentary remains available
          raw_query_zero_rows:
            classification: source_or_routing_exception
            notify_owner: true
            fail_pipeline: false
            action: Omit target product customer analysis and continue Workflow
          query_failure:
            classification: source_or_routing_exception
            notify_owner: true
            fail_pipeline: false
            action: Omit target product customer analysis and continue Workflow
          invalid_product_mapping:
            classification: source_or_routing_exception
            notify_owner: true
            fail_pipeline: false
            action: Omit target product customer analysis and continue Workflow
          block_workflow: false

    trigger_contract:
      producer_result_type: Validated product sell-through result
      trigger_policy_id: POLICY_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS_V1
      confirmed_rule_input: abs(sell_through_rate_wow_change_pp) >= configured threshold
      current_default_threshold_value: 10.0
      current_default_threshold_unit: percentage_point
      product_override_supported: true
      one_run_per_triggered_product: true
      multiple_product_runs_may_execute_in_parallel: false
      first_phase_scheduling_mode: sequential
      upstream_trigger_field_routing:
        routing_role: runtime_trigger_input
        result_contract_lineage_summary_is_runtime_input: false
        exactly_one_route_required: true
        routes:
          - route_id: regular_patch_products
            route_condition: target_ad_product_name is explicitly classified as a regular patch product
            result_contract_id: RC_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
            result_field_id: patch_brand_sell_through_wow_change_pp
          - route_id: all_products_except_regular_patch_and_brand_moment
            route_condition: target_ad_product_name is explicitly classified as neither a regular patch product nor Brand Moment
            result_contract_id: RC_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
            result_field_id: non_patch_product_brand_sell_through_wow_change_pp
          - route_id: brand_moment
            route_condition: target_ad_product_name is explicitly classified as Brand Moment
            result_contract_id: RC_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WEEKLY
            result_field_id: sell_through_wow_change_pp

    dataset_dependencies:
      - dataset_id: DS_AD_PRODUCT_CUSTOMER_DELIVERY_CHANGE_ANALYSIS
        query_asset_id: QRY_APOLLO_PRODUCT_CUSTOMER_DELIVERY_CHANGE_ANALYSIS
        dataset_version_constraint: ">=0.1.0,<0.2.0"
        dependency_role: Product-customer delivery change input
        required_when_triggered: true
        join_or_relationship_rule_id: not_applicable
        run_input_manifest_required: true
        period_context_source: workflow_run_context
        business_rule_processing_policy_id: POLICY_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS_V1

    execution:
      schedule:
        stage: Friday inventory analysis stage
        start_condition: Product-level anomaly trigger satisfied
        timezone: Asia/Shanghai
      manual_trigger_allowed: true
      manual_trigger_additional_required_input:
        - Explicit advertising product
        - Current period
        - Comparison period
      query_invocations:
        - invocation_id: INV_APOLLO_PRODUCT_CUSTOMER_CURRENT_WEEK
          query_role: Current-week customer delivery summary
          product_parameter: Explicit triggered product
          date_parameters:
            start_date: Workflow Run Context current_period_start_date
            end_date: Workflow Run Context current_period_end_date
          grouping_dimension: 广告主
          detail_dimension_date: deselected
          expected_result_shape: Customer-level period summary rows
        - invocation_id: INV_APOLLO_PRODUCT_CUSTOMER_PREVIOUS_WEEK
          query_role: Previous-week customer delivery summary
          product_parameter: Same explicit triggered product
          date_parameters:
            start_date: Workflow Run Context comparison_period_start_date
            end_date: Workflow Run Context comparison_period_end_date
          grouping_dimension: 广告主
          detail_dimension_date: deselected
          expected_result_shape: Customer-level period summary rows
      cross_period_comparison_input: Two independently validated weekly customer summaries
      cross_period_customer_matching:
        match_key: customer_id
        fuzzy_customer_name_matching_allowed: false
        duplicate_product_period_customer_id_action:
          - Exclude every row for the duplicate key
          - Notify owner
          - Do not automatically merge or select a row
        negative_impression_count_action:
          - Exclude the row before cross-period matching
          - Notify owner
          - Do not include the row in change, materiality, sorting, or ranking
        current_only_customer_comparison_period_impression_count: 0
        comparison_only_customer_current_period_impression_count: 0
        same_customer_id_name_conflict_action:
          - Notify owner
          - Exclude the conflicting customer row
          - Do not automatically choose or merge customer names
      stages:
        - DATA_COLLECTION
        - DATA_STANDARDIZATION
        - BUSINESS_RULE_PROCESSING
        - VALIDATION
      mapping_profile_ids:
        - MAP_ADVERTISING_APOLLO_PRODUCT_CUSTOMER_DELIVERY_CHANGE_V1
      ordered_rule_set_ids: []
      business_rule_processing_policy_id: POLICY_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS_V1
      business_rule_processing_responsibilities:
        - duplicate_and_negative_row_exclusion
        - exact_customer_id_cross_period_matching
        - impression_change_derivation
        - materiality_filtering
        - scenario_ranking_measure_derivation
        - sorting
        - customer_ranking
      metric_variant_ids: []
      validation_rule_ids: []

    outputs:
      result_contract_ids:
        - RC_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
      result_contract_cardinality: One result per triggered product Pipeline Run
      result_contract_shape: record_set
      result_record_grain:
        - target_ad_product_name
        - current_reporting_period
        - customer_id
      final_customer_grain_owner_confirmation:
        key: customer_id
        mapped_customer_or_group_name_role: display_name_only
        aggregate_multiple_customer_ids_by_mapped_name: false
      no_placeholder_result_contract_when:
        - trigger_not_met
        - raw_query_zero_rows
        - query_failure
        - invalid_product_mapping
      qualified_customer_zero_rows_result:
        result_contract_generated: true
        product_level_contract_fields_required: true
        customer_record_set_row_count: 0
        fabricated_customer_record_allowed: false
      omitted_result_behavior: Apply explicit normal-omission or exception notification semantics and continue Weekly Workflow
      output_mapping_ids:
        - OM_WEEKLY_BUSINESS_REPORT_V1
      write_to_metrics_store: false

    recovery:
      retry_scope: One product-scoped Pipeline Run only
      recovery_mode: rerun_pipeline_from_start
      resume_from_failed_stage: false
      restart_from_pipeline_start: true
      restart_must_be_idempotent: true
      stage_checkpoint_persistence_required: false
      downstream_impact_rule: Triggered product explanation only

    governance:
      effective_from: 2026-08-08
      evidence_sources:
        - Dataset Inventory
        - Dataset Readiness Matrix
        - Confirmed historical Weekly Report customer-analysis rules
      change_reason: Initial conditional Pipeline definition

