pipelines:
  - pipeline_id: PL_REVENUE_TECHNICAL_WEEKLY
    pipeline_name: 技术线周度收入分析 Pipeline
    business_domain: Revenue
    business_line: Technical Line
    business_context_id: CTX_REVENUE_TECHNICAL_WEEKLY
    trigger_type: Scheduled
    owner: WORKFLOW_OWNER
    business_approver: WORKFLOW_OWNER
    source_and_data_owners: Inherit from Data Source and Dataset registries
    version: 0.1.0-draft
    approval_status: registry_initialized

    pipeline_boundary:
      start: >
        按已确认条件获取本期销售业务线Rolling Deck季度累计业绩收入数据。
      includes:
        - 获取本期Rolling Deck输入
        - 访问明确对应的去年同期Rolling Deck历史附件
        - 读取技术线Weekly Revenue Historical Metric Result Store历史结果
        - 执行后续已确认的标准化、业务规则与指标计算
        - 生成并验证技术线周度收入结果
        - 写入技术线Weekly Revenue Historical Metric Result Store
      end: >
        生成通过验证的技术线收入Result Contract，
        并按已确认持久化规则尝试更新历史Metric Result Store。
      excludes:
        - CTV revenue processing
        - Smart Speaker revenue processing
        - Fast Version revenue processing
        - Customer Revenue Detail Workflow
        - Weekly Report Revenue Section Assembly
        - Weekly Business Report Output Assembly
        - Outlook Draft creation or sending
      minimum_execution_unit: pipeline
      independently_runnable: true
      independently_validatable: true
      independently_retryable: true

    workflow_bindings:
      - workflow_id: WF_WEEKLY_BUSINESS_REPORT
        required_or_optional: required
        failure_scope: Weekly Report Revenue Section only
        execution_order_or_dependency: >
          Thursday 17:30 revenue-stage pipeline.
          No predecessor dependency on CTV, Smart Speaker, or Fast Version
          revenue pipelines; execute sequentially in the registered MVP order.
        failure_handling:
          immediate_action:
            - Notify owner of the failure reason
            - Provide a proposed resolution or required owner action
          recovery_window: >
            等待并允许技术线收入Pipeline独立修复或补跑，
            不阻断库存等其他Domain Pipeline继续执行。
          friday_fallback: >
            如果星期五库存等模块完成后收入模块仍未修复成功，
            则先创建仅包含其他已完成模块的Outlook Draft。
          revenue_section_representation_in_fallback_draft: >
            保留“二、本周收入情况”模块标题，
            并注明“收入数据处理失败，待补充”。

    dataset_dependencies:
      - dataset_id: DS_REVENUE_SALES_ROLLING_DECK_QTD
        dataset_version_constraint: ">=0.1.0,<0.2.0"
        dependency_role: Current-period technical-line revenue input
        required: true
        join_or_relationship_rule_id: not_applicable
        run_input_manifest_required: true
        period_context_source: workflow_run_context
        acquisition_and_selection_rules:
          source_of_truth: Dataset Readiness Matrix
          automatic_rule_duplication_in_pipeline: false

    historical_input_dependencies:
      - dependency_type: Historical Attachment Archive
        source_id: SRC_CORP_OUTLOOK_PRIMARY_MAILBOX
        archive_id: ARCHIVE_REVENUE_ROLLING_DECK_PRIOR_YEAR
        dataset_id: DS_REVENUE_SALES_ROLLING_DECK_QTD
        role: Prior-year comparable Rolling Deck input
        required: true
        relationship_rule_id: BR_REVENUE_PRIOR_YEAR_COMPARABLE_SOURCE_SELECTION_V1
        missing_input_action: >
          暂停技术线收入Pipeline并通知Owner，
          禁止使用相近日期文件替代。
        multiple_match_action: >
          暂停相关处理并请求Owner确认具体采用文件，
          禁止自动选择。
      - dependency_type: Metric Result Store
        store_id: STORE_WEEKLY_REVENUE_HISTORICAL
        store_asset_id: STORE_ASSET_WEEKLY_REVENUE_TECHNICAL
        role: Prior-week validated technical-line revenue results
        read_required_or_optional: required_for_regular_week
        missing_or_incomplete_action: >
          暂停技术线收入Pipeline并通知Owner，
          禁止使用其他日期或未验证结果替代。

    execution:
      schedule:
        day_of_week: Thursday
        start_time: "17:30"
        timezone: Asia/Shanghai
        schedule_source: Confirmed Weekly Business Report operating sequence
      manual_trigger_allowed: true
      stages:
        - DATA_COLLECTION
        - DATA_STANDARDIZATION
        - BUSINESS_RULE_PROCESSING
        - METRIC_CALCULATION
        - VALIDATION
      mapping_profile_ids:
        - MAP_REVENUE_SALES_ROLLING_DECK_QTD_V1
      conditional_mapping_profile_ids:
        - mapping_profile_id: MAP_REVENUE_SALES_ROLLING_DECK_QTD_BUSINESS_LINE_V1
          applies_when: Quarter-transition or prior-year comparable business-line result is required
        - mapping_profile_id: MAP_REVENUE_SALES_ROLLING_DECK_QUARTER_CLOSE_BUSINESS_LINE_V1
          applies_when: BR_REVENUE_PREVIOUS_QUARTER_RESULT_SOURCE_SELECTION_V1 selects fallback
      ordered_rule_set_ids:
        - BR_REVENUE_ROLLING_DECK_EMAIL_CLASSIFICATION_V1
        - BR_WEEKLY_REVENUE_REPORT_MODE_SELECTION_V1
        - BR_REVENUE_TECHNICAL_SINGLE_COUNT_ELIGIBILITY_V1
        - BR_REVENUE_PRIOR_YEAR_COMPARABLE_SOURCE_SELECTION_V1
        - BR_REVENUE_PREVIOUS_QUARTER_RESULT_SOURCE_SELECTION_V1
      metric_variant_ids:
        - MV_REVENUE_TECHNICAL_QTD_PERFORMANCE_V1
        - MV_REVENUE_TECHNICAL_QTD_PERFORMANCE_YOY_V1
        - MV_REVENUE_TECHNICAL_QTD_EXECUTED_V1
        - MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_V1
        - MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_WOW_V1
        - MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_YOY_V1
      validation_rule_ids: []

    outputs:
      result_contract_ids:
        - RC_REVENUE_TECHNICAL_WEEKLY
      result_contract_modes:
        contract_id: RC_REVENUE_TECHNICAL_WEEKLY
        mode_field: report_mode
        allowed_modes:
          - regular_week
          - quarter_transition_week
        mode_selection_rule_id: BR_WEEKLY_REVENUE_REPORT_MODE_SELECTION_V1
        non_applicable_field_representation: not_applicable
        missing_data_must_not_be_mapped_to_not_applicable: true
      output_mapping_ids:
        - OM_WEEKLY_BUSINESS_REPORT_V1
      write_to_metrics_store: true
      metric_result_store_id: STORE_WEEKLY_REVENUE_HISTORICAL
      metric_result_store_asset_id: STORE_ASSET_WEEKLY_REVENUE_TECHNICAL
      persistence_failure_result:
        pipeline_status: COMPLETED_WITH_WARNING
        validated_result_remains_usable: true
        allow_revenue_section_consumption: true
        owner_notification_required: true
        notification_reason: Historical Metric Result Store persistence failed

    recovery:
      retry_scope: pipeline_only
      recovery_mode: rerun_pipeline_from_start
      resume_from_failed_stage: false
      restart_from_pipeline_start: true
      restart_must_be_idempotent: true
      stage_checkpoint_persistence_required: false
      downstream_impact_rule: explicit_dependency_graph_only

    cross_pipeline_dependencies:
      upstream_pipeline_ids: []
      parallel_peer_pipeline_contexts:
        - CTV weekly revenue
        - Smart Speaker weekly revenue
        - Fast Version weekly revenue
      downstream_consumer:
        component: Weekly Report Revenue Section Assembly
        behavior: Wait for applicable revenue Pipeline results
        may_calculate: false

    governance:
      effective_from: 2026-08-08
      evidence_sources:
        - Dataset Inventory
        - Historical Weekly Report Context Extraction
        - Weekly Revenue Historical Metric Result Store Registry
      change_reason: Initial Pipeline Registry definition

