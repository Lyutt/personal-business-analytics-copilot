scope_exclusions:
  - CTV weekly incremental executed revenue
  - CTV weekly incremental executed revenue week-over-week
  - CTV weekly incremental executed revenue year-over-year
  - Output rounding, units, phrasing, and template placement

approval:
  metric_concept_taxonomy: Confirmed
  technical_and_ctv_variant_scope: Confirmed
  calculation_rules: Confirmed
  smart_speaker_and_fast_version_variant_scope: Confirmed
  owner_confirmation: confirmed_complete
  readiness_status: Passed
  committed_or_pushed: true
