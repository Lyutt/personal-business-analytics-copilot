      store_asset_id: STORE_ASSET_WEEKLY_REVENUE_SMART_SPEAKER
      required_period_scope: Same fiscal quarter only
    calculation_method: Previous validated QTD plus current validated weekly result
    formula_regular_week: Prior same-quarter QTD Executed Revenue + current-week Executed Revenue.
    formula_quarter_transition_first_week: Current validated weekly query result.
    aggregation_level: Target fiscal quarter × Smart Speaker
    validation_rules:
      zero_negative_blank_or_non_numeric_action: Pause Smart Speaker Pipeline and notify owner
      source_validation: Inherit upstream Pipeline validation
    base_unit: CNY yuan
    result_precision: Preserve source precision
    version: "1.0.0-draft"

