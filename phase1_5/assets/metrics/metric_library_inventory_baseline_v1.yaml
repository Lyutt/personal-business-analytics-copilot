  - metric_variant_id: MV_INVENTORY_FULL_SITE_AVAILABLE_VOLUME_WOW_V1
    metric_id: METRIC_INVENTORY_CHANGE_RATE
    metric_name: 全站可用库存环比
    business_domain: Inventory
    business_context: Full-site Weekly Inventory
    comparison_type: Week-over-week
    period_type: Query-result period
    numerator_metric_variant_id: MV_INVENTORY_FULL_SITE_AVAILABLE_VOLUME_V1
    historical_result_dependency:
      store_id: STORE_WEEKLY_INVENTORY_HISTORICAL
      store_asset_id: STORE_ASSET_WEEKLY_INVENTORY_FULL_SITE
      required_period_scope: Prior validated weekly inventory result
      missing_history_recovery: Inherit Pipeline Registry policy
    calculation_method: Direct ratio comparison
    formula: Current-week Available Inventory / prior-week Available Inventory - 1.
    denominator_invalid_action: Leave growth result blank and notify owner; do not pause Full-site Inventory Pipeline
    base_unit: Decimal ratio
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_variant_id: MV_INVENTORY_PATCH_GROSS_VOLUME_V1
    metric_id: METRIC_INVENTORY_VOLUME
    metric_name: 贴片总库存
    business_domain: Inventory
    business_context: Patch Weekly Inventory
