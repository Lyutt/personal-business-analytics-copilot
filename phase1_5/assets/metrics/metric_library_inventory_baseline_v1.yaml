schema_version: "0.1"
asset_type: Metric Library
library_id: METRIC_LIBRARY_INVENTORY_WEEKLY_V1
library_name: Inventory Metric Library — Weekly Business Report
scope_status: Completed
approval_status: Approved
owner: WORKFLOW_OWNER
business_approver: WORKFLOW_OWNER
scope_boundary: >
  登记Weekly Business Report当前需要的全站、贴片、非贴片分产品库存，
  产品售卖率、品牌时刻可用库存与售卖率，以及所需广告曝光量Metric Variant。
architecture_constraints:
  metric_concept_is_stable: true
  metric_variant_is_context_specific_implementation: true
  dependencies_must_be_explicit: true
  automatic_date_grain_inference: false
  output_assembly_may_calculate: false
  unconfirmed_content_policy: TBD

metric_definitions:
  - metric_id: METRIC_INVENTORY_VOLUME
    metric_name: Inventory Volume
    business_name: 库存量
    business_domain: Inventory
    definition: >
      在明确的库存类型、数据集、业务上下文与统计周期下确认的库存数量。
    base_unit: Individual inventory unit
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_id: METRIC_SELL_THROUGH_RATE
    metric_name: Sell-through Rate
    business_name: 售卖率
    business_domain: Inventory
    definition: >
      在明确产品、库存分母、投放/曝光分子、数据集与业务上下文下计算的售卖率。
    base_unit: Decimal ratio
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_id: METRIC_INVENTORY_CHANGE_RATE
    metric_name: Inventory Change Rate
    business_name: 库存变动率
    business_domain: Inventory
    definition: >
      对明确库存Metric Variant在指定比较类型与比较周期下计算的变动率。
    base_unit: Decimal ratio
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_id: METRIC_IMPRESSION_COUNT
    metric_name: Impression Count
    business_name: 曝光量
    business_domain: Advertising
    definition: >
      在明确广告产品、数据集、业务上下文与统计周期下确认的投放曝光数量。
    base_unit: Individual impression
    result_precision: Preserve source precision
    version: "1.0.0-draft"

normalization_rules:
  - rule_id: NORM_RAW_QUANTITY_TO_CPM_V1
    applies_to_metric_ids:
      - METRIC_INVENTORY_VOLUME
      - METRIC_IMPRESSION_COUNT
    formula: Raw individual inventory or impression quantity / 1000.
    normalized_unit: CPM
    rule_boundary: >
      原始Metric Result仍保存为单个库存或单次曝光数量。
      该归一化规则可被已确认的Metric Variant或Output Mapping显式引用，
      不得自动替换原始结果或推断展示口径。

metric_variants:
  - metric_variant_id: MV_INVENTORY_FULL_SITE_GROSS_VOLUME_V1
    metric_id: METRIC_INVENTORY_VOLUME
    metric_name: 全站总库存
    business_domain: Inventory
    business_context: Full-site Weekly Inventory
    inventory_type: Gross inventory
    period_type: Query-result period
    dataset_dependencies:
      - DS_INVENTORY_APOLLO_FULL_SITE_STOCK_SUMMARY
    result_contract_dependency: RC_INVENTORY_FULL_SITE_WEEKLY
    calculation_method: Aggregate query-result records only
    formula: SUM(stock_quantity) over validated query-result records.
    aggregation_level: Query-result record set × Full site
    date_grain_policy: >
      按查询结果记录处理；在日期展开形态明确前，不得自行按天累计、平均或推断日期粒度。
    validation_rules:
      source_validation: Inherit upstream Pipeline validation
      final_zero_action: Continue and notify in final output
      final_negative_action: Pause Full-site Inventory calculation and notify owner
    base_unit: Individual inventory unit
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_variant_id: MV_INVENTORY_FULL_SITE_DISABLED_VOLUME_V1
    metric_id: METRIC_INVENTORY_VOLUME
    metric_name: 全站禁用库存
    business_domain: Inventory
    business_context: Full-site Weekly Inventory
    inventory_type: Disabled inventory
    period_type: Query-result period
    dataset_dependencies:
      - DS_INVENTORY_APOLLO_FULL_SITE_STOCK_SUMMARY
    result_contract_dependency: RC_INVENTORY_FULL_SITE_WEEKLY
    calculation_method: Aggregate query-result records only
    formula: SUM(disabled_stock_quantity) over validated query-result records.
    aggregation_level: Query-result record set × Full site
    date_grain_policy: >
      按查询结果记录处理；在日期展开形态明确前，不得自行按天累计、平均或推断日期粒度。
    validation_rules:
      source_validation: Inherit upstream Pipeline validation
      final_zero_action: Continue and notify in final output
      final_negative_action: Pause Full-site Inventory calculation and notify owner
    base_unit: Individual inventory unit
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_variant_id: MV_INVENTORY_FULL_SITE_AVAILABLE_VOLUME_V1
    metric_id: METRIC_INVENTORY_VOLUME
    metric_name: 全站可用库存
    business_domain: Inventory
    business_context: Full-site Weekly Inventory
    inventory_type: Available inventory
    period_type: Query-result period
    dataset_dependencies:
      - DS_INVENTORY_APOLLO_FULL_SITE_STOCK_SUMMARY
    result_contract_dependency: RC_INVENTORY_FULL_SITE_WEEKLY
    calculation_method: Row-level derivation followed by aggregation
    formula: >
      SUM(stock_quantity - disabled_stock_quantity) over validated query-result records satisfying either:
      (ad_placement is not the locally configured special-placement exception AND commercial_sellability_flag equals 是),
      or (ad_placement is the locally configured special-placement exception AND vip_status equals 非vip).
    aggregation_level: Query-result record set × Full site
    date_grain_policy: >
      按查询结果记录处理；在日期展开形态明确前，不得自行按天累计、平均或推断日期粒度。
    validation_rules:
      source_validation: Inherit upstream Pipeline validation
      final_zero_action: Continue and notify in final output
      final_negative_action: Pause Full-site Inventory calculation and notify owner
    local_knowledge_pack_dependency:
      asset_name: 是否商广售卖index
      purpose: Resolve commercial_sellability_flag by explicit ad-placement mapping
      storage_location: '${LOCAL_WORKFLOW_KNOWLEDGE_PACK_ROOT}'
      mapping_content_must_remain_local_only: true
      special_placement_exception_key: '${SPECIAL_PLACEMENT_EXCEPTION_LOCAL_ONLY}'
      mapping_missing_or_unmatched_handling: >
        If an ad placement is unmatched, the mapped value is blank, or the mapped value is neither 是 nor 否,
        treat commercial_sellability_flag as 是.
    base_unit: Individual inventory unit
    result_precision: Preserve source precision
    version: "1.0.0-draft"

