      - MV_INVENTORY_FULL_SITE_PERFORMANCE_DELIVERY_VOLUME_V1
    result_contract_dependency: RC_INVENTORY_FULL_SITE_WEEKLY
    calculation_method: Derived from validated component metrics
    formula: Full-site Brand Delivery Inventory + Full-site Performance Delivery Inventory.
    aggregation_level: Query-result record set × Full site
    validation_rules:
      input_validation: Both component Metric Variants must be validated
