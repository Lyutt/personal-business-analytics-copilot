  - metric_variant_id: MV_INVENTORY_PATCH_BRAND_SELL_THROUGH_RATE_V1
    metric_id: METRIC_SELL_THROUGH_RATE
    metric_name: 贴片当周品牌售卖率
    business_domain: Inventory
    business_context: Patch Weekly Inventory
    period_type: Query-result period
    numerator_metric_variant_id: MV_INVENTORY_PATCH_BRAND_DELIVERY_VOLUME_V1
    denominator_metric_variant_id: MV_INVENTORY_PATCH_AVAILABLE_VOLUME_V1
    calculation_method: Direct ratio
    formula: Patch Brand Delivery Inventory / Patch Available Inventory.
    aggregation_level: Query-result record set × Patch
    validation_rules:
      numerator_zero_action: Continue
      numerator_empty_action: Treat as 0; calculate sell-through result as 0
      numerator_negative_or_non_numeric_action: Block Brand Sell-through result only and notify owner
      denominator_zero_negative_empty_or_non_numeric_action: Block Brand Sell-through result only and notify owner
    base_unit: Decimal ratio
    result_precision: Preserve source precision
    version: "1.0.0-draft"

