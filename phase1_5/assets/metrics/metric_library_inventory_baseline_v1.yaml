scope_exclusions:
  - Brand Moment exposure week-over-week comparison
  - Product-scoped sell-through outside explicitly configured report products
  - Output rounding, template placement, and prose

conditional_analysis_handoff:
  producer_pipeline_id: PL_INVENTORY_PRODUCT_SELL_THROUGH_WEEKLY
  applies_to: Explicitly configured Weekly Report products excluding Brand Moment
  product_execution_cardinality: One Pipeline Run per explicit configured product
  route_selection_rule: >
    Use only the explicit product-to-upstream-result-contract route.
    Automatic selection by field similarity, name similarity, or history is prohibited.
  trigger_input_metric_variant_role: Validated product sell-through week-over-week absolute rate change
  trigger_condition: Absolute sell-through week-over-week rate change is greater than or equal to the configured product threshold
  default_threshold: 10 percentage points
  product_specific_override_supported: true
  trigger_consumer_pipeline_id: PL_ADVERTISING_PRODUCT_CUSTOMER_CHANGE_ANALYSIS
  consumer_pipeline_scope: Customer delivery change analysis only
  no_customer_query_when_trigger_not_met: true

approval:
  baseline_metric_taxonomy: Confirmed
  full_site_base_variants: Confirmed
  quantity_normalization_rule: Confirmed
  patch_product_variant_scope: Confirmed
  non_patch_product_variant_scope: Confirmed
  brand_moment_variant_scope: Confirmed
  customer_analysis_trigger_boundary: Confirmed
  owner_confirmation: confirmed_complete
  readiness_status: Passed
  committed_or_pushed: false
