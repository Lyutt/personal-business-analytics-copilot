    calculation_method: Direct rate difference
    formula: Current-week Brand Sell-through Rate - prior-week Brand Sell-through Rate.
    input_invalid_action: Block Brand Sell-through result only and notify owner
    base_unit: Decimal rate-point difference
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_GROSS_VOLUME_V1
    metric_id: METRIC_INVENTORY_VOLUME
    metric_name: 非贴片产品总库存
    business_domain: Inventory
    business_context: Explicit configured non-patch product excluding Brand Moment
    parameterization:
      required_parameter: explicit_product_rule_id
      automatic_product_inference: false
    period_type: Query-result period
    dataset_dependencies:
      - DS_INVENTORY_APOLLO_NON_PATCH_PRODUCT_STOCK_SUMMARY
    result_contract_dependency: RC_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
    calculation_method: Aggregate records explicitly assigned to the requested product
    formula: SUM(total_inventory_quantity) over records assigned by the local product-rule registry.
    local_product_rule_dependency: &non_patch_product_rule_registry
      asset_name: 分产品库存及售卖率计算逻辑
      role: Explicit product assignment and product-specific inventory calculation rules
      storage_location: '${LOCAL_WORKFLOW_KNOWLEDGE_PACK_ROOT}'
      actual_product_rules_must_remain_local_only: true
      authoritative_for_runtime: true
      changes_require_explicit_owner_confirmation: true
      unconfirmed_filter_condition_action: Ask owner; do not infer condition
      multi_product_match_action: Mark conflict, notify owner, exclude record from all product metrics
      no_product_match_action: Exclude from product metrics without notification
    aggregation_level: Query-result record set × Explicit product
    validation_rules:
      final_zero_action: Continue and notify in final output
      final_negative_action: Pause target product inventory result and notify owner
    base_unit: Individual inventory unit
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_DISABLED_VOLUME_V1
