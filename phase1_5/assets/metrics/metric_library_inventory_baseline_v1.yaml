    period_type: Query-result period
    dataset_dependencies:
      - DS_INVENTORY_APOLLO_PATCH_STOCK
    result_contract_dependency: RC_INVENTORY_PATCH_WEEKLY
    calculation_method: Aggregate filtered query-result records only
    formula: SUM(stock_quantity) over validated records that pass the local time-slice exclusion rule.
    local_filter_dependency: &patch_time_slice_filter
      filter_id: FILTER_PATCH_TIME_SLICE_EXCLUSION_LOCAL_ONLY
      purpose: Exclude explicitly configured time-slice records from all Patch Inventory Metric Variants
      storage_location: '${LOCAL_WORKFLOW_KNOWLEDGE_PACK_ROOT}'
      actual_filter_values_must_remain_local_only: true
    aggregation_level: Query-result record set × Patch
    validation_rules:
      source_validation: Inherit upstream Pipeline validation
      final_zero_action: Continue and notify in final output
      final_negative_action: Pause Patch Inventory calculation and notify owner
    base_unit: Individual inventory unit
    result_precision: Preserve source precision
    version: "1.0.0-draft"

