schema_version: "0.1"
asset_type: Metric Library
library_id: METRIC_LIBRARY_USER_ANALYTICS_DAU_V1
library_name: User Analytics Metric Library — Full-platform DAU
scope_status: Completed
approval_status: Approved
owner: WORKFLOW_OWNER
business_approver: WORKFLOW_OWNER
architecture_constraints:
  metric_concept_is_stable: true
  metric_variant_is_context_specific_implementation: true
  dependencies_must_be_explicit: true
  automatic_period_inference: false
  output_assembly_may_calculate: false

metric_definitions:
  - metric_id: METRIC_DAILY_ACTIVE_USERS
    metric_name: Daily Active Users
    business_name: DAU
    business_domain:
      - User Analytics
      - Platform Operation
    definition: Active users for a specified calendar date and scope.
    base_unit: Individual users
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_id: METRIC_USER_ACTIVITY_CHANGE_RATE
    metric_name: User Activity Change Rate
    business_name: 用户活跃变动率
    business_domain:
      - User Analytics
      - Platform Operation
    definition: Change rate of a specified user-activity Metric Variant across an explicit comparison period.
    base_unit: Decimal ratio
    result_precision: Preserve source precision
    version: "1.0.0-draft"

metric_variants:
  - metric_variant_id: MV_USER_ANALYTICS_PLATFORM_DAILY_DAU_V1
    metric_id: METRIC_DAILY_ACTIVE_USERS
    metric_name: 全平台分日DAU
    business_context: Full-platform Weekly DAU
    period_type: Daily snapshot
    dataset_dependencies:
      - DS_NOVABI_PLATFORM_DAU
    output_binding:
      result_contract_id: RC_USER_ANALYTICS_PLATFORM_DAU_WEEKLY
      result_field_id: dau_count
      record_set_id: daily_activity
    calculation_method: Consume validated daily query-result records
    formula: Validated DAU value for each returned calendar date.
    aggregation_level: Calendar date × Full platform
    validation_rules:
      expected_daily_date_count: 7
      unique_date_required: true
      invalid_date_coverage_action: Leave DAU content blank, notify owner, continue Weekly Workflow
      invalid_dau_value_conditions:
        - Empty
        - Zero
        - Negative
        - Non-numeric
      invalid_dau_value_action: Leave DAU content blank, notify owner, continue Weekly Workflow
    base_unit: Individual users
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_variant_id: MV_USER_ANALYTICS_PLATFORM_WEEKLY_AVERAGE_DAU_V1
    metric_id: METRIC_DAILY_ACTIVE_USERS
    metric_name: 全平台周均DAU
    business_context: Full-platform Weekly DAU
    period_type: Weekly average
    dataset_dependencies:
      - DS_NOVABI_PLATFORM_DAU
    output_binding:
      result_contract_id: RC_USER_ANALYTICS_PLATFORM_DAU_WEEKLY
      result_field_id: weekly_average_dau
    input_metric_variant_id: MV_USER_ANALYTICS_PLATFORM_DAILY_DAU_V1
    calculation_method: Arithmetic mean
    formula: Arithmetic mean of the seven validated daily DAU values in the explicit weekly period.
    aggregation_level: Weekly period × Full platform
    validation_rules:
      require_seven_valid_daily_values: true
      invalid_input_action: Leave DAU content blank, notify owner, continue Weekly Workflow
    base_unit: Individual users
    result_precision: Preserve source precision
    version: "1.0.0-draft"

  - metric_variant_id: MV_USER_ANALYTICS_PLATFORM_WEEKLY_AVERAGE_DAU_WOW_V1
    metric_id: METRIC_USER_ACTIVITY_CHANGE_RATE
    metric_name: 全平台周均DAU环比
    business_context: Full-platform Weekly DAU
    comparison_type: Week-over-week
    period_type: Weekly average
    numerator_metric_variant_id: MV_USER_ANALYTICS_PLATFORM_WEEKLY_AVERAGE_DAU_V1
    output_binding:
      result_contract_id: RC_USER_ANALYTICS_PLATFORM_DAU_WEEKLY
      result_field_id: weekly_average_dau_wow
    historical_result_dependency:
      store_id: STORE_WEEKLY_USER_ANALYTICS_HISTORICAL
      store_asset_id: STORE_ASSET_WEEKLY_PLATFORM_DAU
      required_period_scope: Prior validated weekly DAU result
      missing_history_recovery: >
        Automatically re-query the prior week once; if it still fails, notify owner,
        leave DAU content blank, and continue Weekly Workflow.
    calculation_method: Direct ratio comparison
    formula: Current-week Average DAU / prior-week Average DAU - 1.
    denominator_invalid_action: Leave DAU content blank, notify owner, continue Weekly Workflow
    base_unit: Decimal ratio
    result_precision: Preserve source precision
    version: "1.0.0-draft"

scope_exclusions:
  - DAU display-unit conversion
  - DAU display rounding and percentage formatting
  - Other NovaBI query assets such as UV, traffic, duration, or audience analysis

approval:
  metric_scope: Confirmed
  calculation_rules: Confirmed
  owner_confirmation: confirmed_complete
  readiness_status: Passed
  committed_or_pushed: false
