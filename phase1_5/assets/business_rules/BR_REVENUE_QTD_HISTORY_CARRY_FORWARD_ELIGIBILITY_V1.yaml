config_type: business_rule
rule_id: BR_REVENUE_QTD_HISTORY_CARRY_FORWARD_ELIGIBILITY_V1
rule_name: 细分业务线QTD历史累计承接资格规则
rule_category: Revenue Historical Result Eligibility
business_domains:
  - Revenue
applicable_workflow_ids:
  - WF_WEEKLY_BUSINESS_REPORT
applicable_pipeline_ids:
  - PL_REVENUE_SMART_SPEAKER_WEEKLY
  - PL_REVENUE_FAST_VERSION_WEEKLY
business_context_ids:
  - CTX_REVENUE_BUSINESS_LINE_QTD_ACCUMULATION
owner: WORKFLOW_OWNER
business_approver: WORKFLOW_OWNER
version: 1.0.0
approval_status: approved
effective_from: 2026-07-31

purpose: >
  判定上一条已验证QTD历史结果是否可以作为智能音箱或极速版目标周的累计基线，
  或是否需要先执行缺失周补查，或在季度切换时禁止跨季度承接。

inputs:
  required_context_fields:
    - target_business_line
    - target_revenue_cutoff_date
    - target_fiscal_quarter
  required_result_contract_ids: []
  required_historical_result_fields:
    - historical_business_line
    - historical_revenue_cutoff_date
    - historical_fiscal_quarter
    - historical_qtd_revenue

conditions:
  carry_forward_allowed_when_all:
    - historical_business_line exactly equals target_business_line
    - historical_fiscal_quarter exactly equals target_fiscal_quarter
    - historical_revenue_cutoff_date is the directly preceding weekly cutoff
    - historical_qtd_revenue is validated
  missing_week_repair_required_when_all:
    - historical_business_line exactly equals target_business_line
    - historical_fiscal_quarter exactly equals target_fiscal_quarter
    - historical_revenue_cutoff_date is earlier than the directly preceding weekly cutoff
  new_quarter_reset_when:
    - historical_fiscal_quarter differs from target_fiscal_quarter

actions:
  on_carry_forward_allowed:
    set_history_baseline_status: eligible
  on_missing_week_repair_required:
    set_history_baseline_status: repair_required
    required_action:
      - execute_confirmed_single_missing_week_repair
      - validate_repaired_result
      - persist_repaired_result_before_continuing
  on_new_quarter_reset:
    set_history_baseline_status: not_applicable_new_quarter
    cross_quarter_carry_forward_allowed: false
  on_repair_failure:
    - pause_affected_business_line_pipeline
    - notify_owner

calculation_boundary:
  qtd_formula_defined_here: false
  weekly_revenue_formula_defined_here: false
  historical_result_is_only_qualified_or_rejected: true

validation:
  deterministic: true
  business_line_exact_match_required: true
  fiscal_quarter_exact_match_required: true
  direct_previous_week_required: true
  automatic_cross_week_skip_allowed: false
  automatic_cross_quarter_carry_forward_allowed: false
  ambiguous_result_behavior: pause_affected_pipeline_and_notify_owner
  owner_notification_required_on_normal_quarter_reset: false

governance:
  evidence_sources:
    - Owner confirmations in Business Rule Initialization
    - phase1_5/assets/pipelines/pipeline_registry.yaml
    - phase1_5/assets/metric_stores/metric_result_store_registry.yaml
  change_reason: Initial approved QTD historical carry-forward eligibility rule

constraints:
  automatic_field_inference_allowed: false
  automatic_rule_completion_allowed: false
  metric_formula_allowed: false
  output_formatting_allowed: false
  unknown_decisions_remain_tbd: true
