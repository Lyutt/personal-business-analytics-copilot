config_type: result_contract
result_contract_id: RC_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WEEKLY
contract_name: Brand Moment Weekly Sell-through Result Contract
contract_version: 1.0.0
status: active
workflow_id: WF_WEEKLY_BUSINESS_REPORT
business_domain: Inventory
business_context_id: CTX_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WEEKLY
producer: { producer_pipeline_id: PL_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WEEKLY, producer_pipeline_version_constraint: 0.1.0-draft, producer_must_be_unique: true }
contract_shape: single_record
input_dependency_authority:
  canonical_source_asset: phase1_5/assets/metrics/metric_library_inventory_baseline_v1.yaml
  canonical_source_path: metric_variants[].input_contract_fields
  contract_lineage_role: derived_validation_summary
  pipeline_registry_role: orchestration_routing_only
input_contract_fields:
  - { result_contract_id: RC_ADVERTISING_BRAND_MOMENT_DELIVERY_WEEKLY, result_field_id: impression_count, required_or_optional: required }
  - { result_contract_id: RC_INVENTORY_NON_PATCH_PRODUCT_WEEKLY, result_field_id: brand_moment_available_inventory_count, required_or_optional: required }
contract_fields:
  - field_id: available_inventory_wow
    field_name: 品牌时刻可用库存环比
    business_definition: 当周品牌时刻可用库存与上周已验证结果的比率变化。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_BRAND_MOMENT_AVAILABLE_VOLUME_WOW_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Current upstream inventory field must validate; invalid prior result leaves the change blank and notifies owner.
    lineage_required: true
  - field_id: sell_through_rate
    field_name: 品牌时刻当周售卖率
    business_definition: 当周品牌时刻曝光量除以当周品牌时刻可用库存。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_BRAND_MOMENT_SELL_THROUGH_RATE_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: 0, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Both upstream fields must be positive numeric values; invalid input blocks only Brand Moment sell-through.
    lineage_required: true
  - field_id: sell_through_wow_change_pp
    field_name: 品牌时刻售卖率环比变化
    business_definition: 当周品牌时刻售卖率减上周已验证售卖率。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_BRAND_MOMENT_SELL_THROUGH_WOW_CHANGE_V1
    data_type: number
    base_unit: percentage_point
    numeric_constraints: { numeric_semantics: percentage_point_change, unit: percentage_point, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Current and prior sell-through values must validate; invalid input blocks only this result and notifies owner.
    lineage_required: true
record_sets: []
mode_semantics:
  allowed_value_statuses: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation]
  missing_must_not_be_mapped_to_not_applicable: true
  downstream_consumption:
    calculation_allowed_value_statuses: [valid_value]
    output_allowed_value_statuses: [valid_value]
    missing_and_not_applicable_require_explicit_field_contract: true
    pending_confirmation_calculation_allowed: false
    pending_confirmation_output_allowed: false
validation:
  producer_pipeline_validation_required: true
  required_fields: [available_inventory_wow, sell_through_rate, sell_through_wow_change_pp]
  conditional_fields: []
  unit_validation: true
  data_type_validation: true
  numeric_constraint_validation: true
  duplicate_field_id_check: true
  metric_variant_binding_check: true
  contract_completeness_check: true
lineage: { required_instance_fields: [result_id, workflow_run_id, pipeline_run_id, reporting_period, cutoff_date, report_mode, dataset_instance_ids, mapping_profile_versions, business_rule_versions, metric_variant_versions, generated_at, validation_status, approval_status] }
constraints: { automatic_business_inference_allowed: false, output_mapping_may_calculate: false, unknown_business_values_remain_tbd: true }
