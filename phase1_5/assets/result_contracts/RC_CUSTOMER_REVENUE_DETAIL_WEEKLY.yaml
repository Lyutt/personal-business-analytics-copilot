        validation_requirement: Never average customer ratios; recompute from aggregate numerator and denominator.
        lineage_required: true

mode_semantics:
  allowed_value_statuses: [valid_value, missing, calculation_failed, pending_confirmation]
  missing_must_not_be_mapped_to_not_applicable: true
  downstream_consumption:
    calculation_allowed_value_statuses: [valid_value]
    output_allowed_value_statuses: [valid_value]
    missing_and_not_applicable_require_explicit_field_contract: true
    pending_confirmation_calculation_allowed: false
    pending_confirmation_output_allowed: false

validation:
  producer_pipeline_validation_required: true
  required_fields: []
  conditional_fields:
    - M/N/Q/R are blank only in quarter week one
    - forecast_top20 may be empty while the quarter has no populated D values
  unit_validation: true
  data_type_validation: true
  numeric_constraint_validation: true
  duplicate_field_id_check: true
  metric_variant_binding_check: true
  contract_completeness_check: true
  customer_row_uniqueness_required: true
  source_reconciliation_absolute_tolerance_CNY: 1
  top20_membership_validation:
    valid_template_membership_preserved_and_frozen: true
    prior_year_generated_ranking:
      D_available: [C_desc, D_desc, customer_name_asc]
      D_unavailable: [C_desc, customer_name_asc]
    forecast_generated_ranking:
      D_available: [D_desc, C_desc, customer_name_asc]
      D_unavailable: not_applicable_header_only
    post_freeze_new_customer_routes_to_Other: true
    forecast_record_set_requires_D_availability: true

lineage:
  required_instance_fields: [result_id, workflow_run_id, pipeline_run_id, reporting_period, cutoff_date, report_mode, dataset_instance_ids, local_input_instance_ids, mapping_profile_versions, business_rule_versions, metric_variant_versions, generated_at, validation_status, approval_status]

constraints:
  automatic_business_inference_allowed: false
  output_mapping_may_calculate: false
  formula_mirror_does_not_change_result_authority: true
  customer_rows_must_remain_local_only: true
  shared_metric_store_write_allowed: false
  cross_workflow_contract_publish_allowed: false
