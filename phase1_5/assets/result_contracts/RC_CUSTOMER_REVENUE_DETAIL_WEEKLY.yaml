config_type: result_contract
result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
contract_name: Customer Revenue Detail Weekly Result Contract
contract_version: 1.0.0
status: approved_design_only
workflow_id: WF_CUSTOMER_REVENUE_DETAIL
business_domain: Revenue
business_context_id: CTX_CUSTOMER_REVENUE_DETAIL_WEEKLY

producer:
  producer_pipeline_id: PL_CUSTOMER_REVENUE_DETAIL_WEEKLY
  producer_pipeline_version_constraint: 1.0.0-design
  producer_must_be_unique: true

contract_shape: record_set
contract_fields: []
record_sets:
  - record_set_id: customer_detail
    record_grain: [customer_name]
    record_dimensions: []
    context_fields: []
    record_fields:
      - &text_policy
        field_id: industry
        field_name: Industry
        business_definition: Quarter-baseline industry or the confirmed deterministic source-industry fallback.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: string
        base_unit: text
        nullable: true
        value_status_allowed: [valid_value, missing, pending_confirmation]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Apply the confirmed industry fallback order and notify on the final name-order fallback.
        lineage_required: true
      - field_id: customer_name
        field_name: Customer or Group
        business_definition: Exact mapped customer/group; unmatched advertiser temporarily uses its raw name.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: string
        base_unit: text
        nullable: false
        value_status_allowed: [valid_value, missing, pending_confirmation]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Exactly one output row per customer/group; duplicate rows block the Workflow.
        lineage_required: true
      - &money_required
        field_id: prior_year_quarter_revenue
        field_name: Prior-Year Quarter Revenue
        business_definition: Quarter-baseline C when populated, otherwise archive-supplemented prior-year quarter revenue.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PRIOR_YEAR_QUARTER_REVENUE_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: &money_constraints { numeric_semantics: signed_money_amount, unit: CNY_yuan, integer_only: false, precision: preserve_full_precision, minimum: null, maximum: null }
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Reconcile within absolute CNY 1 whenever supplemented from the archive.
        lineage_required: true
      - field_id: current_quarter_forecast
        field_name: Current-Quarter Forecast
        business_definition: Owner-supplied quarter forecast D; blank is preserved while forecast D is unavailable, and a new customer defaults to zero only after forecast availability is established.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_CURRENT_QUARTER_FORECAST_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Must originate from the approved quarter baseline or the availability-aware new-customer default; blank must not be coerced to zero.
        lineage_required: true
      - &ratio_nullable
        field_id: forecast_yoy
        field_name: Forecast YoY
        business_definition: Current-quarter forecast divided by prior-year quarter revenue minus one.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_FORECAST_YOY_V1
        data_type: number
        base_unit: Decimal ratio
        numeric_constraints: &ratio_constraints { numeric_semantics: signed_decimal_ratio, unit: decimal_ratio, integer_only: false, precision: preserve_full_precision, minimum: null, maximum: null }
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Unavailable forecast D or an invalid denominator produces blank; absolute value at least 100 percent warns only.
        lineage_required: true
      - field_id: current_qtd_performance
        field_name: Current QTD Performance
        business_definition: Eligible Technical performance revenue grouped by exact mapped customer/group; zero when a retained union customer is absent from the validated current snapshot.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_CURRENT_QTD_PERFORMANCE_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Reconcile to the filtered Technical source total within absolute CNY 1; missing/blank is prohibited after zero-fill.
        lineage_required: true
      - field_id: performance_completion_rate
        field_name: Performance Completion Rate
        business_definition: Current QTD performance divided by current-quarter forecast.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_FORECAST_COMPLETION_RATE_V1
        data_type: number
        base_unit: Decimal ratio
        numeric_constraints: *ratio_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Unavailable forecast D or an invalid denominator produces blank; absolute value at least 100 percent warns only.
        lineage_required: true
      - field_id: performance_yoy
        field_name: Performance YoY
        business_definition: Current QTD performance divided by prior-year comparable QTD performance minus one.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PERFORMANCE_YOY_V1
        data_type: number
        base_unit: Decimal ratio
        numeric_constraints: *ratio_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Invalid denominator produces blank; absolute value at least 100 percent warns only.
        lineage_required: true
      - field_id: weekly_incremental_performance
        field_name: Weekly Incremental Performance
        business_definition: Current QTD performance less prior-week QTD performance; first quarter week equals current QTD performance.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_WEEKLY_INCREMENTAL_PERFORMANCE_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Negative values warn only.
        lineage_required: true
      - field_id: current_qtd_executed
        field_name: Current QTD Executed
        business_definition: Eligible Technical executed revenue grouped by exact mapped customer/group; zero when a retained union customer is absent from the validated current snapshot.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_CURRENT_QTD_EXECUTED_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Reconcile to the filtered Technical source total within absolute CNY 1; missing/blank is prohibited after zero-fill.
        lineage_required: true
      - field_id: prior_year_qtd_performance
        field_name: Prior-Year Comparable QTD Performance
        business_definition: Performance revenue from the Customer-specific exact prior-year comparable QTD snapshot using identical filtering and grouping; it is not the C full-quarter source.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PRIOR_YEAR_QTD_PERFORMANCE_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Reconcile to the exact archive's filtered Technical total within absolute CNY 1.
        lineage_required: true
      - field_id: prior_year_qtd_executed
        field_name: Prior-Year Comparable QTD Executed
        business_definition: Executed revenue from the Customer-specific exact prior-year comparable QTD snapshot using identical filtering and grouping; it is not the C full-quarter source.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PRIOR_YEAR_QTD_EXECUTED_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Reconcile to the exact archive's filtered Technical total within absolute CNY 1.
        lineage_required: true
      - &money_quarter_first_blank
        field_id: prior_week_qtd_performance
        field_name: Prior-Week QTD Performance
        business_definition: F from the immediately preceding approved output.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PRIOR_WEEK_QTD_PERFORMANCE_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Blank only in quarter week one; otherwise the preceding approved output is required.
        lineage_required: true
      - field_id: prior_week_qtd_executed
        field_name: Prior-Week QTD Executed
        business_definition: J from the immediately preceding approved output.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PRIOR_WEEK_QTD_EXECUTED_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Blank only in quarter week one; otherwise the preceding approved output is required.
        lineage_required: true
      - field_id: variance_reason_type
        field_name: Variance Reason Type
        business_definition: Owner-supplied quarter baseline O; never inferred.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: string
        base_unit: text
        nullable: true
        value_status_allowed: [valid_value, missing, pending_confirmation]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Blank is allowed; new customers default blank.
        lineage_required: true
      - field_id: budget_change_reason
        field_name: Budget Change Reason
        business_definition: Owner-supplied quarter baseline P; never inferred.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: string
        base_unit: text
        nullable: true
        value_status_allowed: [valid_value, missing, pending_confirmation]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Blank is allowed; new customers default blank.
        lineage_required: true
      - field_id: prior_output_comparable_performance
        field_name: Prior Output Comparable Performance
        business_definition: K from the immediately preceding approved output.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PRIOR_OUTPUT_COMPARABLE_PERFORMANCE_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Blank only in quarter week one; otherwise the preceding approved output is required.
        lineage_required: true
      - field_id: prior_output_comparable_executed
        field_name: Prior Output Comparable Executed
        business_definition: L from the immediately preceding approved output.
        source_type: metric_variant
        source_metric_variant_id: MV_CUSTOMER_PRIOR_OUTPUT_COMPARABLE_EXECUTED_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Blank only in quarter week one; otherwise the preceding approved output is required.
        lineage_required: true

  - record_set_id: prior_year_top20
    record_grain: [py_top20_customer_name]
    record_dimensions: []
    context_fields: []
    record_fields:
      - &top20_text
