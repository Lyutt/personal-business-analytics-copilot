        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: string
        base_unit: text
        nullable: false
        value_status_allowed: [valid_value]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Exactly 20 frozen members with no tie expansion, plus Other.
        lineage_required: true
      - &top20_money
        field_id: py_top20_prior_year_quarter_revenue
        field_name: Prior-Year Quarter Revenue
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Must aggregate from the authoritative detail Result Contract.
        lineage_required: true
      - field_id: py_top20_current_quarter_forecast
        field_name: Current-Quarter Forecast
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Aggregate from the authoritative detail Result Contract; blank is required while forecast D is unavailable.
        lineage_required: true
      - field_id: py_top20_current_qtd_performance
        field_name: Current QTD Performance
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Must aggregate from the authoritative detail Result Contract.
        lineage_required: true
      - field_id: py_top20_prior_year_qtd_performance
        field_name: Prior-Year Comparable QTD Performance
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: false
        value_status_allowed: [valid_value, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Must aggregate from the authoritative detail Result Contract.
        lineage_required: true
      - &top20_ratio
        field_id: py_top20_completion_rate
        field_name: Completion Rate
        business_definition: Recomputed from the row's aggregate amounts.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: Decimal ratio
        numeric_constraints: *ratio_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Never average customer ratios; recompute from aggregate numerator and denominator.
        lineage_required: true
      - field_id: py_top20_performance_yoy
        field_name: Performance YoY
        business_definition: Recomputed from the row's aggregate amounts.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: Decimal ratio
        numeric_constraints: *ratio_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Never average customer ratios; recompute from aggregate numerator and denominator.
        lineage_required: true

  - record_set_id: forecast_top20
    record_grain: [forecast_top20_customer_name]
    record_dimensions: []
    context_fields:
      - field_id: forecast_top20_D_availability
        field_name: Forecast D Availability
        business_definition: Locked run-level availability that distinguishes explicit zero forecasts from blank/unavailable forecasts.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: string
        base_unit: status
        allowed_values: [available, unavailable]
        nullable: false
        value_status_allowed: [valid_value]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Must equal the locked Customer Run Context forecast_D_availability.
        lineage_required: true
    record_fields:
      - field_id: forecast_top20_customer_name
        field_name: Forecast Top20 Customer
        business_definition: Frozen forecast Top20 customer member or Other; absent while the quarter has no D values.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: string
        base_unit: text
        nullable: true
        value_status_allowed: [valid_value, missing]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: Header-only is valid until D values become available; then freeze exactly 20 members with no tie expansion, plus Other.
        lineage_required: true
      - field_id: forecast_top20_prior_year_quarter_revenue
        field_name: Prior-Year Quarter Revenue
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: May be blank only while the forecast Top20 record set is header-only.
        lineage_required: true
      - field_id: forecast_top20_current_quarter_forecast
        field_name: Current-Quarter Forecast
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: May be blank only while the forecast Top20 record set is header-only.
        lineage_required: true
      - field_id: forecast_top20_current_qtd_performance
        field_name: Current QTD Performance
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: May be blank only while the forecast Top20 record set is header-only.
        lineage_required: true
      - field_id: forecast_top20_prior_year_qtd_performance
        field_name: Prior-Year Comparable QTD Performance
        business_definition: Validated static aggregate for the frozen row.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: CNY yuan
        numeric_constraints: *money_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
        applicable_report_modes: [regular_week, quarter_first_week]
        validation_requirement: May be blank only while the forecast Top20 record set is header-only.
        lineage_required: true
      - field_id: forecast_top20_completion_rate
        field_name: Completion Rate
        business_definition: Recomputed from the row's aggregate amounts.
        source_type: policy_derived_field
        source_policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
        data_type: number
        base_unit: Decimal ratio
        numeric_constraints: *ratio_constraints
        nullable: true
        value_status_allowed: [valid_value, missing, calculation_failed]
