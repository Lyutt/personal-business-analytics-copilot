config_type: result_contract
result_contract_id: RC_USER_ANALYTICS_PLATFORM_DAU_WEEKLY
contract_name: Full-platform Weekly DAU Result Contract
contract_version: 1.0.0
status: active
workflow_id: WF_WEEKLY_BUSINESS_REPORT
business_domain:
  - User Analytics
  - Platform Operation
business_context_id: CTX_USER_ANALYTICS_PLATFORM_DAU_WEEKLY
producer: { producer_pipeline_id: PL_USER_ANALYTICS_PLATFORM_DAU_WEEKLY, producer_pipeline_version_constraint: 0.1.0-draft, producer_must_be_unique: true }
contract_shape: composite
record_sets:
  - record_set_id: daily_activity
    record_grain: [activity_date, platform_scope]
    record_dimensions:
      - dimension_id: platform_scope
        dimension_type: fixed_scope
        fixed_value: full_platform
    expected_record_count: 7
    fixed_dimensions:
      platform_scope: full_platform
    context_fields:
      - field_id: activity_date
        field_name: 数据日期
        business_definition: NovaBI分日DAU结果的已验证活动日期。
        source_type: standardized_field
        source_standard_field_id: activity_date
        data_type: date
        base_unit: date
        nullable: false
        value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
        applicable_report_modes: [regular_week, quarter_transition_week]
        validation_requirement: Exactly one row per activity_date in the requested period; format YYYY-MM-DD.
        lineage_required: true
    record_fields:
      - field_id: dau_count
        field_name: 全平台日活跃用户数
        business_definition: 指定activity_date的已验证全平台DAU。
        source_type: metric_variant
        source_metric_variant_id: MV_USER_ANALYTICS_PLATFORM_DAILY_DAU_V1
        data_type: number
        base_unit: user
        numeric_constraints: { numeric_semantics: integer_count, unit: user, integer_only: true, precision: integer, minimum: 0, maximum: null, minimum_inclusive: false }
        nullable: false
        value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
        applicable_report_modes: [regular_week, quarter_transition_week]
        validation_requirement: Seven unique daily values are required; blank, zero, negative or non-numeric value omits DAU content and notifies owner.
        lineage_required: true
contract_fields:
  - field_id: weekly_average_dau
    field_name: 全平台周均DAU
    business_definition: 明确7日周期内7个已验证日DAU值的算术平均数。
    source_type: metric_variant
    source_metric_variant_id: MV_USER_ANALYTICS_PLATFORM_WEEKLY_AVERAGE_DAU_V1
    data_type: number
    base_unit: user
    numeric_constraints: { numeric_semantics: average_count, unit: user, integer_only: false, precision: preserve_source_precision, minimum: 0, maximum: null, minimum_inclusive: false }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Requires seven valid daily DAU records; invalid input omits DAU content and notifies owner.
    lineage_required: true
  - field_id: weekly_average_dau_wow
    field_name: 全平台周均DAU环比
    business_definition: 当周周均DAU与上周已验证周均DAU的比率变化。
    source_type: metric_variant
    source_metric_variant_id: MV_USER_ANALYTICS_PLATFORM_WEEKLY_AVERAGE_DAU_WOW_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Invalid or unavailable prior-week result leaves DAU content blank, notifies owner and continues Workflow.
    lineage_required: true
mode_semantics:
  allowed_value_statuses: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation]
  missing_must_not_be_mapped_to_not_applicable: true
  downstream_consumption:
    calculation_allowed_value_statuses: [valid_value]
    output_allowed_value_statuses: [valid_value]
    missing_and_not_applicable_require_explicit_field_contract: true
    pending_confirmation_calculation_allowed: false
    pending_confirmation_output_allowed: false
validation:
  producer_pipeline_validation_required: true
  required_fields: [daily_activity.activity_date, daily_activity.dau_count, weekly_average_dau, weekly_average_dau_wow]
  conditional_fields: []
  record_set_cardinality_validation: true
  unit_validation: true
  data_type_validation: true
  numeric_constraint_validation: true
  duplicate_field_id_check: true
  metric_variant_binding_check: true
  contract_completeness_check: true
lineage: { required_instance_fields: [result_id, workflow_run_id, pipeline_run_id, reporting_period, cutoff_date, report_mode, dataset_instance_ids, mapping_profile_versions, business_rule_versions, metric_variant_versions, generated_at, validation_status, approval_status] }
constraints: { automatic_business_inference_allowed: false, output_mapping_may_calculate: false, unknown_business_values_remain_tbd: true, daily_detail_must_not_be_array_object: true }
