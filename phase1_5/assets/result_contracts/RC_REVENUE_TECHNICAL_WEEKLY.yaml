config_type: result_contract
result_contract_id: RC_REVENUE_TECHNICAL_WEEKLY
contract_name: Technical Line Weekly Revenue Result Contract
contract_version: 1.0.0
status: active
workflow_id: WF_WEEKLY_BUSINESS_REPORT
business_domain: Revenue
business_context_id: CTX_REVENUE_TECHNICAL_WEEKLY
producer:
  producer_pipeline_id: PL_REVENUE_TECHNICAL_WEEKLY
  producer_pipeline_version_constraint: 0.1.0-draft
  producer_must_be_unique: true
contract_shape: single_record
contract_fields:
  - field_id: qtd_performance_revenue
    field_name: 技术线QTD签单金额
    business_definition: 目标财务季度内通过技术线单计硬广收入资格规则的累计签单金额。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_TECHNICAL_QTD_PERFORMANCE_V1
    data_type: number
    base_unit: CNY yuan
    numeric_constraints: { numeric_semantics: monetary_amount, unit: CNY_yuan, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Inherit Metric Variant source validation; zero or negative final value continues with final-output notification.
    lineage_required: true
  - field_id: qtd_performance_revenue_yoy
    field_name: 技术线QTD签单金额同比
    business_definition: 技术线QTD签单金额与明确去年同期结果的日均化同比。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_TECHNICAL_QTD_PERFORMANCE_YOY_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Leave blank and notify owner when denominator or prior-year comparable result is invalid or unavailable.
    lineage_required: true
  - field_id: qtd_executed_revenue
    field_name: 技术线QTD已执行金额
    business_definition: 目标财务季度内通过技术线单计硬广收入资格规则的累计已执行金额。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_TECHNICAL_QTD_EXECUTED_V1
    data_type: number
    base_unit: CNY yuan
    numeric_constraints: { numeric_semantics: monetary_amount, unit: CNY_yuan, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Inherit Metric Variant source validation; zero or negative final value continues with final-output notification.
    lineage_required: true
  - field_id: weekly_incremental_executed_revenue
    field_name: 技术线当周新增已执行金额
    business_definition: 当周QTD已执行金额与上周同季度QTD已执行金额之差。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_V1
    data_type: number
    base_unit: CNY yuan
    numeric_constraints: { numeric_semantics: monetary_amount, unit: CNY_yuan, integer_only: false, precision: preserve_source_precision, minimum: 0, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation]
    applicable_report_modes: [regular_week]
    validation_requirement: Negative result pauses the Technical Line result; quarter-transition first week is not applicable.
    lineage_required: true
  - field_id: weekly_incremental_executed_revenue_wow
    field_name: 技术线当周新增已执行金额环比
    business_definition: 技术线当周新增已执行金额与上周对应结果的比率变化。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_WOW_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation]
    applicable_report_modes: [regular_week]
    validation_requirement: Leave blank and notify owner when denominator is invalid; quarter-transition first week is not applicable.
    lineage_required: true
  - field_id: weekly_incremental_executed_revenue_yoy
    field_name: 技术线当周新增已执行金额同比
    business_definition: 技术线当周新增已执行金额与去年同期对应结果的比率变化。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_TECHNICAL_WEEKLY_INCREMENTAL_EXECUTED_YOY_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation]
    applicable_report_modes: [regular_week]
    validation_requirement: Leave blank and notify owner when denominator is invalid; quarter-transition first week is not applicable.
    lineage_required: true
record_sets: []
mode_semantics:
  allowed_value_statuses: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation]
  missing_must_not_be_mapped_to_not_applicable: true
  downstream_consumption:
    calculation_allowed_value_statuses: [valid_value]
    output_allowed_value_statuses: [valid_value]
    missing_and_not_applicable_require_explicit_field_contract: true
    pending_confirmation_calculation_allowed: false
    pending_confirmation_output_allowed: false
validation:
  producer_pipeline_validation_required: true
  required_fields: [qtd_performance_revenue, qtd_performance_revenue_yoy, qtd_executed_revenue, weekly_incremental_executed_revenue, weekly_incremental_executed_revenue_wow, weekly_incremental_executed_revenue_yoy]
  conditional_fields:
    - { field_ids: [weekly_incremental_executed_revenue, weekly_incremental_executed_revenue_wow, weekly_incremental_executed_revenue_yoy], condition: report_mode == regular_week }
  unit_validation: true
  data_type_validation: true
  numeric_constraint_validation: true
  duplicate_field_id_check: true
  metric_variant_binding_check: true
  contract_completeness_check: true
lineage:
  required_instance_fields: [result_id, workflow_run_id, pipeline_run_id, reporting_period, cutoff_date, report_mode, dataset_instance_ids, mapping_profile_versions, business_rule_versions, metric_variant_versions, generated_at, validation_status, approval_status]
constraints: { automatic_business_inference_allowed: false, output_mapping_may_calculate: false, unknown_business_values_remain_tbd: true }
