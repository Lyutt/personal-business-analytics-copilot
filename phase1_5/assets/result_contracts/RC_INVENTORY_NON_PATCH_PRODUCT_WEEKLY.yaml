config_type: result_contract
result_contract_id: RC_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
contract_name: Non-patch Product Weekly Inventory Result Contract
contract_version: 1.0.0
status: active
workflow_id: WF_WEEKLY_BUSINESS_REPORT
business_domain: Inventory
business_context_id: CTX_INVENTORY_NON_PATCH_PRODUCT_WEEKLY
producer: { producer_pipeline_id: PL_INVENTORY_NON_PATCH_PRODUCT_WEEKLY, producer_pipeline_version_constraint: 0.1.0-draft, producer_must_be_unique: true }
contract_shape: parameterized_single_record
record_grain: [explicit_product_rule_id, reporting_period]
contract_fields:
  - field_id: gross_inventory_count
    field_name: 非贴片产品总库存
    business_definition: 本地产品规则显式分配给目标非贴片产品的总库存汇总。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_GROSS_VOLUME_V1
    data_type: number
    base_unit: Individual inventory unit
    numeric_constraints: { numeric_semantics: integer_count, unit: inventory_unit, integer_only: true, precision: integer, minimum: 0, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Negative value pauses the target product result; zero continues with notification.
    lineage_required: true
  - field_id: disabled_inventory_count
    field_name: 非贴片产品禁用库存
    business_definition: 本地产品规则显式分配给目标非贴片产品的禁用库存汇总。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_DISABLED_VOLUME_V1
    data_type: number
    base_unit: Individual inventory unit
    numeric_constraints: { numeric_semantics: integer_count, unit: inventory_unit, integer_only: true, precision: integer, minimum: 0, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Negative value pauses the target product result; zero continues with notification.
    lineage_required: true
  - field_id: available_inventory_count
    field_name: 非贴片产品可用库存
    business_definition: 本地产品规则显式分配记录的总库存减禁用库存汇总。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_AVAILABLE_VOLUME_V1
    data_type: number
    base_unit: Individual inventory unit
    numeric_constraints: { numeric_semantics: integer_count, unit: inventory_unit, integer_only: true, precision: integer, minimum: 0, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Negative value pauses the target product result; zero continues with notification.
    lineage_required: true
  - field_id: brand_delivery_inventory_count
    field_name: 非贴片产品品牌投放库存
    business_definition: 本地产品规则显式分配给目标产品的品牌投放库存汇总。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_BRAND_DELIVERY_VOLUME_V1
    data_type: number
    base_unit: Individual inventory unit
    numeric_constraints: { numeric_semantics: integer_count, unit: inventory_unit, integer_only: true, precision: integer, minimum: 0, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Negative value pauses the target product result; zero continues with notification.
    lineage_required: true
  - field_id: performance_delivery_inventory_count
    field_name: 非贴片产品效果投放库存
    business_definition: 本地产品规则显式分配给目标产品的效果投放库存汇总。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_PERFORMANCE_DELIVERY_VOLUME_V1
    data_type: number
    base_unit: Individual inventory unit
    numeric_constraints: { numeric_semantics: integer_count, unit: inventory_unit, integer_only: true, precision: integer, minimum: 0, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Negative value pauses the target product result; zero continues with notification.
    lineage_required: true
  - field_id: commercial_delivery_inventory_count
    field_name: 非贴片产品商广投放库存
    business_definition: 目标产品品牌投放库存与效果投放库存之和。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_COMMERCIAL_DELIVERY_VOLUME_V1
    data_type: number
    base_unit: Individual inventory unit
    numeric_constraints: { numeric_semantics: integer_count, unit: inventory_unit, integer_only: true, precision: integer, minimum: 0, maximum: null }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Both component Metric Variants must validate; negative value pauses the target product result.
    lineage_required: true
  - field_id: available_inventory_wow
    field_name: 非贴片产品可用库存环比
    business_definition: 当周产品可用库存与上周已验证可用库存的比率变化。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_NON_PATCH_PRODUCT_AVAILABLE_VOLUME_WOW_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Invalid denominator leaves the change result blank and notifies owner without pausing the target product result.
    lineage_required: true
  - field_id: brand_moment_available_inventory_count
    field_name: 品牌时刻可用库存
    business_definition: 已批准本地产品规则中定义的品牌时刻可用库存分母结果。
    source_type: metric_variant
    source_metric_variant_id: MV_INVENTORY_BRAND_MOMENT_AVAILABLE_VOLUME_V1
    data_type: number
    base_unit: Individual inventory unit
    numeric_constraints: { numeric_semantics: integer_count, unit: inventory_unit, integer_only: true, precision: integer, minimum: 0, maximum: null, minimum_inclusive: false }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Empty, zero, negative or non-numeric value blocks only Brand Moment sell-through and notifies owner.
    lineage_required: true
record_sets: []
mode_semantics: { allowed_value_statuses: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation], missing_must_not_be_mapped_to_not_applicable: true }
validation:
  producer_pipeline_validation_required: true
  required_fields: [gross_inventory_count, disabled_inventory_count, available_inventory_count, brand_delivery_inventory_count, performance_delivery_inventory_count, commercial_delivery_inventory_count, available_inventory_wow, brand_moment_available_inventory_count]
  conditional_fields: []
  unit_validation: true
  data_type_validation: true
  numeric_constraint_validation: true
  duplicate_field_id_check: true
  metric_variant_binding_check: true
  contract_completeness_check: true
lineage: { required_instance_fields: [result_id, workflow_run_id, pipeline_run_id, reporting_period, cutoff_date, report_mode, dataset_instance_ids, mapping_profile_versions, business_rule_versions, metric_variant_versions, generated_at, validation_status, approval_status] }
constraints: { automatic_business_inference_allowed: false, output_mapping_may_calculate: false, unknown_business_values_remain_tbd: true }
