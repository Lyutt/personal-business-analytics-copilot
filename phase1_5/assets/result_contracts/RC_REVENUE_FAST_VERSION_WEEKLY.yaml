config_type: result_contract
result_contract_id: RC_REVENUE_FAST_VERSION_WEEKLY
contract_name: Fast Version Weekly Revenue Result Contract
contract_version: 1.0.0
status: active
workflow_id: WF_WEEKLY_BUSINESS_REPORT
business_domain: Revenue
business_context_id: CTX_REVENUE_FAST_VERSION_WEEKLY
producer: { producer_pipeline_id: PL_REVENUE_FAST_VERSION_WEEKLY, producer_pipeline_version_constraint: 0.1.0-draft, producer_must_be_unique: true }
contract_shape: single_record
contract_fields:
  - field_id: qtd_executed_revenue
    field_name: 极速版QTD已执行金额
    business_definition: 上期同季度已验证QTD结果与当周已执行金额之和；季度切换首周为当周查询结果。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_FAST_VERSION_QTD_EXECUTED_V1
    data_type: number
    base_unit: CNY yuan
    numeric_constraints: { numeric_semantics: monetary_amount, unit: CNY_yuan, integer_only: false, precision: preserve_source_precision, minimum: 0, maximum: null, minimum_inclusive: false }
    nullable: false
    value_status_allowed: [valid_value, calculation_failed, pending_confirmation]
    applicable_report_modes: [regular_week, quarter_transition_week]
    validation_requirement: Zero, negative, blank or non-numeric value pauses the Fast Version Pipeline and notifies owner.
    lineage_required: true
  - field_id: weekly_executed_revenue
    field_name: 极速版当周已执行金额
    business_definition: 明确周期范围的已验证极速版收入查询结果。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_FAST_VERSION_WEEKLY_EXECUTED_V1
    data_type: number
    base_unit: CNY yuan
    numeric_constraints: { numeric_semantics: monetary_amount, unit: CNY_yuan, integer_only: false, precision: preserve_source_precision, minimum: 0, maximum: null, minimum_inclusive: false }
    nullable: true
    value_status_allowed: [valid_value, calculation_failed, not_applicable, pending_confirmation]
    applicable_report_modes: [regular_week]
    validation_requirement: Quarter-transition first week is not calculated or written; other invalid values pause the Pipeline.
    lineage_required: true
  - field_id: weekly_executed_revenue_wow
    field_name: 极速版当周已执行金额环比
    business_definition: 极速版当周已执行金额与上周对应结果的比率变化。
    source_type: metric_variant
    source_metric_variant_id: MV_REVENUE_FAST_VERSION_WEEKLY_EXECUTED_WOW_V1
    data_type: number
    base_unit: Decimal ratio
    numeric_constraints: { numeric_semantics: ratio, unit: decimal_ratio, integer_only: false, precision: preserve_source_precision, minimum: null, maximum: null }
    nullable: true
    value_status_allowed: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation]
    applicable_report_modes: [regular_week]
    validation_requirement: Invalid denominator leaves the result blank and notifies owner; quarter-transition first week is not applicable.
    lineage_required: true
record_sets: []
mode_semantics: { allowed_value_statuses: [valid_value, missing, calculation_failed, not_applicable, pending_confirmation], missing_must_not_be_mapped_to_not_applicable: true }
validation:
  producer_pipeline_validation_required: true
  required_fields: [qtd_executed_revenue, weekly_executed_revenue, weekly_executed_revenue_wow]
  conditional_fields:
    - { field_ids: [weekly_executed_revenue, weekly_executed_revenue_wow], condition: report_mode == regular_week }
  unit_validation: true
  data_type_validation: true
  numeric_constraint_validation: true
  duplicate_field_id_check: true
  metric_variant_binding_check: true
  contract_completeness_check: true
lineage: { required_instance_fields: [result_id, workflow_run_id, pipeline_run_id, reporting_period, cutoff_date, report_mode, dataset_instance_ids, mapping_profile_versions, business_rule_versions, metric_variant_versions, generated_at, validation_status, approval_status] }
constraints: { automatic_business_inference_allowed: false, output_mapping_may_calculate: false, unknown_business_values_remain_tbd: true }
