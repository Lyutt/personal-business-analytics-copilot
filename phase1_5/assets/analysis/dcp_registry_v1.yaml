config_type: data_capability_profile_registry
dcp_registry_id: DCP_REGISTRY_PHASE1_5_V1
registry_version: 1.0.1
status: confirmed_for_final_acceptance
owner: WORKFLOW_OWNER

matching_policy:
  match_method: exact_canonical_metadata_match
  required_capability_selection_metadata: [domain, intent, capability_scope_id, dimensions, metrics]
  brief_semantic_parsing_is_separate_from_asset_selection: true
  brief_parser_may_emit_business_asset_ids: false
  final_asset_selection_uses_registered_ids_only: true
  name_similarity_inference_allowed: false
  no_match_action: request_owner_confirmation
  multiple_match_action: request_owner_confirmation
  automatic_first_match_selection_allowed: false

brief_canonicalization_catalog:
  catalog_role: Convert understood Brief concepts into canonical ARC metadata; never select business assets directly.
  match_method: explicitly_registered_term_or_canonical_id
  semantic_similarity_fallback_allowed: false
  entries:
    - canonical_concept_id: revenue_technical_performance
      registered_brief_terms: [技术线收入表现, technical revenue performance]
      arc_metadata:
        domain: Revenue
        intent: revenue_performance
        capability_scope_id: revenue_technical
        dimensions: [reporting_period]
        metrics: [qtd_performance_revenue, qtd_performance_revenue_yoy, qtd_executed_revenue, weekly_incremental_executed_revenue, weekly_incremental_executed_revenue_wow, weekly_incremental_executed_revenue_yoy]
    - canonical_concept_id: revenue_ctv_performance
      registered_brief_terms: [CTV收入表现, CTV revenue performance]
      arc_metadata:
        domain: Revenue
        intent: revenue_performance
        capability_scope_id: revenue_ctv
        dimensions: [reporting_period]
        metrics: [qtd_performance_revenue, qtd_performance_revenue_yoy, qtd_executed_revenue]
    - canonical_concept_id: revenue_smart_speaker_performance
      registered_brief_terms: [智能音箱收入表现, smart speaker revenue performance]
      arc_metadata:
        domain: Revenue
        intent: revenue_performance
        capability_scope_id: revenue_smart_speaker
        dimensions: [reporting_period]
        metrics: [qtd_executed_revenue, weekly_executed_revenue, weekly_executed_revenue_wow]
    - canonical_concept_id: revenue_fast_version_performance
      registered_brief_terms: [极速版收入表现, fast version revenue performance]
      arc_metadata:
        domain: Revenue
        intent: revenue_performance
        capability_scope_id: revenue_fast_version
        dimensions: [reporting_period]
        metrics: [qtd_executed_revenue, weekly_executed_revenue, weekly_executed_revenue_wow]
    - canonical_concept_id: inventory_full_site_availability
      registered_brief_terms: [全站库存情况, full-site inventory availability]
      arc_metadata:
        domain: Inventory
        intent: inventory_availability
        capability_scope_id: inventory_full_site
        dimensions: [reporting_period]
        metrics: [gross_inventory_count, disabled_inventory_count, available_inventory_count, brand_delivery_inventory_count, performance_delivery_inventory_count, commercial_delivery_inventory_count, available_inventory_wow]
    - canonical_concept_id: inventory_patch_availability
      registered_brief_terms: [贴片库存情况, patch inventory availability]
      arc_metadata:
        domain: Inventory
        intent: inventory_availability
        capability_scope_id: inventory_patch
        dimensions: [reporting_period]
        metrics: [gross_inventory_count, disabled_inventory_count, available_inventory_count, brand_delivery_inventory_count, performance_delivery_inventory_count, commercial_delivery_inventory_count, available_inventory_wow]
    - canonical_concept_id: inventory_non_patch_product_availability
      registered_brief_terms: [非贴片产品库存情况, non-patch product inventory availability]
      arc_metadata:
        domain: Inventory
        intent: inventory_availability
        capability_scope_id: inventory_non_patch_product
        dimensions: [target_ad_product_name, reporting_period]
        metrics: [gross_inventory_count, disabled_inventory_count, available_inventory_count, brand_delivery_inventory_count, performance_delivery_inventory_count, commercial_delivery_inventory_count, available_inventory_wow, brand_moment_available_inventory_count]

allowed_standard_analysis_operations:
  - filter
  - group_by
  - sum
  - avg
  - count
  - period_compare
  - sort
  - rank
  - topN
  - share
  - dimension_decomposition

operation_boundary:
  standardized_or_validated_data_only: true
  may_create_new_business_metric_formula: false
  new_business_definition_requires_registered_metric_variant_or_business_rule: true
  one_time_request_plan_type: Temporary Execution Plan
  one_time_request_creates_formal_workflow: false

