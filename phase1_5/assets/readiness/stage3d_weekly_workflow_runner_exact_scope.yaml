runner_contract:
  entry_point: weekly_business_runtime.WeeklyWorkflowRunner.execute
  execution_unit: existing Pipeline Run identity
  pipeline_run_identity_binding: explicit_caller_binding_required
  activation_authority:
    required_optional_conditional_and_dependency_triggered_preserved: true
    optional_pipeline_without_explicit_input: normal_omission
    customer_trigger_not_met: normal_omission_without_executor_invocation
    product_or_activation_inference_allowed: false
  dependency_authority:
    sources:
      - Pipeline Registry result_contract_dependencies
      - Pipeline Registry result_contract_dependency_routing
      - Explicit configured product routes
      - Frozen customer trigger routes
    dependency_reference_validation: fail_closed
    cycle_detection: fail_closed
    deterministic_topological_order: true
    deterministic_tie_break: existing_registry_mvp_order_then_explicit_product_binding_order
    generic_dag_engine: false
  result_contract_handoff:
    exact_workflow_run_identity_required: true
    exact_pipeline_run_identity_required: true
    exact_reporting_period_required: true
    exact_workflow_reporting_date_required: true
    exact_context_and_product_binding_required: true
    validation_status_required: passed
    store_latest_or_fuzzy_fallback_allowed: false
  failure_isolation:
    required_invalid_upstream_blocks_dependent_scope: true
    independent_pipeline_continuation_required: true
    target_product_failure_isolated: true
    revenue_context_failure_does_not_block_non_revenue: true
    core_context_or_manifest_invalid_action: fail_closed
  report_mode_integration:
    authority: BR_WEEKLY_REVENUE_REPORT_MODE_SELECTION_V1 and locked Workflow Run Context
    default_value_allowed: false
    invalid_or_unbound_action: block_revenue_scope_and_continue_independent_non_revenue
  workflow_execution_summary:
    representation: immutable_mapping_of_existing_execution_results
    new_workflow_result_model_created: false
    new_lifecycle_enum_created: false
    business_completion_status_created_or_inferred: false
    complete_draft_or_partial_draft_created: false
  recovery:
    rerun_from_runner_entry: true
    retry_framework: false
    checkpoint_or_resume: false

explicit_exclusions:
  - Provider acquisition
  - Provider capability validation
  - Scheduler and Queue
  - Generic DAG or Workflow framework
  - Retry, checkpoint, resume, or partial replay framework
  - Weekly Output Mapping
  - Weekly Report Preview or Output Assembly
  - Narrative, Excel, HTML, or Email body generation
  - Automatic Draft
  - Outlook Draft
  - Outlook Send
  - Stage 3F integrated local real-data qualification
  - Runtime Acceptance
  - Cutover
  - Baseline promotion or refreeze
  - Customer Revenue Detail Workflow

exit_criteria:
  - A clear WeeklyWorkflowRunner entry point consumes the locked Context, finalized Manifest, explicit Pipeline Run identities, existing executors, and explicit local rule bindings.
  - Required, Optional, Conditional, Dependency-triggered, normal-omission, and product-scoped activation semantics are preserved without inference.
  - Dependency references, cycles, deterministic topological ordering, and Registry-order tie-break are validated before sequential execution.
  - Revenue and Stage 3C capabilities are invoked through their existing interfaces or the Runner's pipeline-specific thin invocation helper.
  - Only exact validated Result Contracts are handed to registered downstream Pipeline Runs.
  - Independent, Revenue, Brand Moment, and target-product failure scopes remain isolated as registered.
  - The immutable summary mapping contains existing execution results, dependency status, warnings, errors, blocked scopes, normal omissions, Result Contract references, and lineage without a new business Completion Status.
  - Same inputs, bindings, generated_at, and Pipeline Run identities produce deterministic business results on rerun.
  - Stage 3D targeted tests, integrated synthetic qualification, affected Stage 3C and Revenue regression, lint, compile, asset integrity, consistency, repository safety, and diff checks pass.
  - No explicit exclusion is implemented, activated, qualified, or represented as accepted.
  - Completion does not imply Stage 3 completion, Stage 3E or Stage 3F authorization, Runtime Acceptance, Cutover, Production Ready, or Baseline promotion/refreeze.

