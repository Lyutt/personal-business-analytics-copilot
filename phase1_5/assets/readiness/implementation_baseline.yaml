mvp_development_constraints:
  mvp_execution_mode: sequential
  parallel_product_scheduler_required: false
  mvp_recovery_mode: rerun_pipeline_from_start
  stage_checkpointing_required: false
  failed_stage_resume_required: false
  physical_metric_store_strategy: shared_local_sqlite
  shared_local_sqlite_logical_stores:
    - STORE_WEEKLY_INVENTORY_HISTORICAL
    - STORE_WEEKLY_USER_ANALYTICS_HISTORICAL
    - STORE_WEEKLY_ADVERTISING_HISTORICAL
  shared_local_sqlite_table: metric_results
  shared_local_sqlite_configured_display_value_table: configured_display_values
  shared_local_sqlite_discriminator_fields: [store_id, store_asset_id]
  revenue_physical_metric_store_strategy: existing_excel_history_store
  separate_physical_storage_engine_per_logical_store_required: false
  multi_provider_metric_store_required: false
  plugin_metric_store_architecture_required: false
  complex_orm_required: false
  customer_analysis_output_implementation: fixed_narrative_template_rendering
  customer_analysis_output_section: inventory_and_sell_through
  customer_analysis_output_positions:
    - patch_and_similar_resource_commentary
    - page_resource_commentary
  generic_dynamic_table_renderer_required: false
  generic_record_set_display_engine_required: false
  dynamic_html_column_generation_required: false
  implementation_sequence:
    - sequence: 1
      scope: Local input -> standardization -> rules -> metrics -> Result Contract -> fixed narrative output -> Weekly Report preview -> Store
    - sequence: 2
      scope: Outlook Draft
      auto_send: false
    - sequence: 3
      scope: Progressively integrate Outlook, Apollo, and NovaBI Adapters

change_control:
  baseline_is_logically_frozen: true
  repository_commit_binding_status: freeze_candidate_reviewed
  frozen_content_includes_customer_fixed_narrative_strategy: true
  frozen_content_includes_shared_local_sqlite_contract: true
  post_freeze_behavior_or_output_change_requires_version_review: true
  any_asset_change_requires:
    - Baseline version impact review
    - Re-run repository safety validation
    - Re-run asset integrity validation
    - Owner review before Code Implementation approval
  latest_baseline_version_impact_review:
    review_date: 2026-08-09
    change_class: phase1_5_design_contract_closure
    behavior_or_output_change: true
    changes_reviewed:
      - Revenue source-selection required fields now bind only real fields in each primary or fallback Mapping Profile
      - target_business_line is Pipeline-scoped with exact per-Pipeline Rule Context identities
      - Revenue current-email selection uses workflow_reporting_date and source_report_date independently from the business-data cutoff
      - Manual Report Mode uses explicit target report period and workflow reporting date only
      - Core Weekly Context locks independently while Revenue-only fields resolve conditionally and fail only Revenue scope
      - Expected previous Revenue reporting date is exactly the adjacent Weekly period with no older-success fallback
      - All four Weekly Revenue Result Contracts and the Revenue Store record workflow_reporting_date plus current_revenue_cutoff_date and prohibit generic cutoff_date
      - Technical incremental WoW reads the exact previous validated incremental Metric; YoY uses Owner-confirmed option A from the exact prior-year comparable Technical Store Metric
      - Prior-year source failure leaves only dependent YoY fields missing with warning while retaining valid current-period Revenue fields
      - Baseline lineage uses merge-neutral freeze-time semantics
    customer_analysis_output_strategy: fixed_narrative_template_rendering
    customer_analysis_initial_mvp_status: included
    physical_metric_store_strategy: shared_local_sqlite
    mvp_execution_mode: sequential
    mvp_recovery_mode: rerun_pipeline_from_start
    development_complexity_reduction: true
    code_implementation_started: false
    code_implementation_owner_approved: false
    baseline_version_increment_required: false
    baseline_freeze_action: refreeze_same_version_before_code_implementation
    final_acceptance_synthetic_scenario_count: 14
    final_acceptance_result: passed
    rationale: The review corrects pre-implementation design contracts and source-selection authority without changing formulas, Metric Variant or Result Contract counts, sequential MVP execution, or implementation authorization.
  final_adhoc_capability_patch_review:
    review_date: 2026-08-08
    change_class: adhoc_index_and_arc_resolution_only
    weekly_mvp_behavior_or_output_change: false
    revenue_dcp_profiles_added: 4
    inventory_dcp_index_gaps_closed: [full_site, patch, non_patch_product]
    natural_language_brief_to_arc_supported: true
    business_asset_selection_remains_exact_registry_id_only: true
    new_metric_rule_result_contract_pipeline_or_workflow_created: false
    code_implementation_started: false
    owner_code_implementation_approval_granted: false
    baseline_version_increment_required: false
    incorporated_before_current_freeze: true
  final_acceptance_behavior_change_review:
    review_date: 2026-08-08
    change_class: pre_implementation_runtime_contract_closure
    behavior_or_output_change: true
    changes_reviewed:
      - Workflow Run Context and Run Input Manifest become the only business-date and input authorities
      - Percentage-point outputs store true pp values using rate difference multiplied by 100
      - Invalid duplicate and negative customer rows are excluded before calculation
      - Partial Draft status and warning semantics are explicit
      - Configured display state uses a second table in the existing shared SQLite
      - ARC, DCP and synthetic acceptance contracts are added without a Workflow Engine
    incorporated_before_current_freeze: true
    current_frozen_baseline_includes_change: true
    code_implementation_started: false
    baseline_version_increment_required: false
    owner_code_implementation_approval_granted: false
  pre_freeze_customer_narrative_acceptance_review:
    review_date: 2026-08-06
    change_class: customer_analysis_fixed_narrative_output_acceptance
    behavior_or_output_change: true
    incorporated_before_current_freeze: true
    current_frozen_baseline_includes_change: true
    code_implementation_started: false
    baseline_version_increment_required: false
    rationale: The Owner-approved fixed narrative strategy was incorporated before the current 2026-08-08 freeze of baseline 1.0.0.
  force_push_allowed: false
  auto_merge_allowed: false
  automatic_next_stage_allowed: false
remaining_tbd_classification:
  blocking: []
  runtime-only:
    - Local Metric Store bootstrap and runtime connectivity checks already listed in the Code Implementation Gate
    - Local source availability, access, retention, and presentation-technology details that must resolve before the affected runtime scope activates
  not-required-for-MVP:
