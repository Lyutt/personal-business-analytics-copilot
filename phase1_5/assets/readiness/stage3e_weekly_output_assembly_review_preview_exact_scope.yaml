  output_mapping_gate_does_not_authorize_implementation: true
  stage3d_completion_does_not_authorize_stage3e_implementation: true
  configured_display_value_policy_may_not_be_extended: true
  configured_display_value_state_may_not_be_reclassified_as_metric_result: true
  generated_preview_must_not_enter_git: true
  auto_send: false
  auto_merge: false
