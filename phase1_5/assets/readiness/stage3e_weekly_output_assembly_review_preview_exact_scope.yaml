  stage3b_authorized: true
  exact_scope_registered: true
  exact_scope_owner_confirmed: true
  implementation_authorized: false
  implementation_may_start: false
  implementation_started: false
  exit_qualification_authorized: false
  separate_explicit_owner_authorization_required: true
  required_owner_authorization_statement: 我正式授权按照已登记的 Stage 3E exact scope 实施 Weekly Output Assembly and Review Preview
  stage3f_authorized: false
  outlook_draft_or_send_authorized: false
  provider_authorized: false
  scheduler_or_queue_authorized: false
  runtime_acceptance_authorized: false
  cutover_authorized: false
  baseline_promotion_or_refreeze_authorized: false
  merge_authorized: false
