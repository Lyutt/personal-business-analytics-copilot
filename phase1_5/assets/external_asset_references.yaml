config_type: external_asset_reference_registry
registry_version: 1.0.0
status: active
version_contract_status: complete
version_resolution_policy:
  repository_records_reference_contract_versions_only: true
  actual_local_versions_and_fingerprints_must_remain_local_only: true
  runtime_version_and_fingerprint_resolution_required_before_use: true
  unresolved_or_changed_version_action: Block the dependent scope, notify owner, and do not substitute another local asset.
  owner_confirmation_required_after_local_asset_change: true

external_assets:
  - asset_id: MAP_ADVERTISER_NAME_OWNERSHIP_INDEX
    asset_type: local_reference_mapping
    availability_scope: local_only
    tracked_in_git: false
    reference_status: registered
    reference_contract_version: 1.0.0
    runtime_version_placeholder: '${MAP_ADVERTISER_NAME_OWNERSHIP_INDEX_VERSION_LOCAL_ONLY}'
    runtime_content_fingerprint_placeholder: '${MAP_ADVERTISER_NAME_OWNERSHIP_INDEX_SHA256_LOCAL_ONLY}'
    version_resolution_status: runtime_required
    runtime_verification_required: true
    owner_confirmation_required_on_version_change: true

