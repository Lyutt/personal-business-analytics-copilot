constraints:
  external_assets_are_definitions_not_business_logic: true
  external_assets_cannot_contain_local_paths: true
  external_assets_cannot_contain_personal_identifiers: true
  external_assets_cannot_be_auto_activated: true
  runtime_version_values_must_not_enter_git: true
  runtime_content_fingerprints_must_not_enter_git: true
  unresolved_external_asset_version_blocks_only_dependent_scope: true
