config_type: output_mapping
output_mapping_id: OM_CUSTOMER_REVENUE_DETAIL_EXCEL_V1
mapping_version: 1.0.0
status: approved_design_only
owner: WORKFLOW_OWNER
workflow_id: WF_CUSTOMER_REVENUE_DETAIL

output_target:
  type: Customer Revenue Detail Excel
  format: XLSX
  storage_scope: local_only
  storage_location: ${CUSTOMER_REVENUE_OUTPUT_DIR_LOCAL_ONLY}
  filename_pattern: '{YY}年Q{Quarter}硬广预算盘点-收入截止{YYYYMMDD}.xlsx'
  collision_policy:
    overwrite_allowed: false
    next_available_suffix: v2_v3_and_so_on
    owner_notification_required: true
  source_template_reference: TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY
  source_template_version_binding:
    asset_id: TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY
    reference_contract_version: 1.0.0
    runtime_version_reference: '${TEMPLATE_CUSTOMER_REVENUE_DETAIL_VERSION_LOCAL_ONLY}'
    runtime_version_verification_required: true
  source_template_files_must_not_enter_git: true
  generated_output_must_not_enter_git: true
  weekly_report_attachment: false
  weekly_report_file_dependency: false

assembly_constraints:
  input_must_be_validated_result_or_approved_local_input: true
  may_read_raw_dataset: false
  may_calculate: false
  may_apply_business_rule: false
  may_select_metric_variant: false
  may_create_partial_file_on_failure: false
  output_engine_role: Presentation assembly, formula-mirror validation, template mapping and XLSX generation only
  authoritative_result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
  calculation_engine_result_is_authoritative: true
  formula_cells_are_non_authoritative_audit_mirrors: true
  formula_mirror_mismatch_action: block_output

workbook_layout:
  preserve_template_style: true
  preserve_template_sheet_order: true
  header_row: 1
  data_start_row: 2
  sheets:
    - sheet_id: CUSTOMER_DETAIL_LIST
      sheet_name_pattern: 分客户list
      role: Primary customer detail list
      result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
      result_record_set_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail }
      observed_used_range: A1:R138
      observed_column_count: 18
      observed_formula_cells: 10
      output_fields:
        - { output_field_id: detail_A_industry, target_column: A, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: industry } }
        - { output_field_id: detail_B_customer_name, target_column: B, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: customer_name } }
        - { output_field_id: detail_C_prior_year_quarter_revenue, target_column: C, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: prior_year_quarter_revenue } }
        - { output_field_id: detail_D_current_quarter_forecast, target_column: D, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: current_quarter_forecast } }
        - { output_field_id: detail_E_forecast_yoy, target_column: E, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: forecast_yoy } }
        - { output_field_id: detail_F_current_qtd_performance, target_column: F, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: current_qtd_performance } }
        - { output_field_id: detail_G_performance_completion_rate, target_column: G, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: performance_completion_rate } }
        - { output_field_id: detail_H_performance_yoy, target_column: H, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: performance_yoy } }
        - { output_field_id: detail_I_weekly_incremental_performance, target_column: I, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: weekly_incremental_performance } }
        - { output_field_id: detail_J_current_qtd_executed, target_column: J, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: current_qtd_executed } }
        - { output_field_id: detail_K_prior_year_qtd_performance, target_column: K, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: prior_year_qtd_performance } }
        - { output_field_id: detail_L_prior_year_qtd_executed, target_column: L, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: prior_year_qtd_executed } }
        - { output_field_id: detail_M_prior_week_qtd_performance, target_column: M, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: prior_week_qtd_performance } }
        - { output_field_id: detail_N_prior_week_qtd_executed, target_column: N, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: prior_week_qtd_executed } }
        - { output_field_id: detail_O_variance_reason_type, target_column: O, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: variance_reason_type } }
        - { output_field_id: detail_P_budget_change_reason, target_column: P, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: budget_change_reason } }
        - { output_field_id: detail_Q_prior_output_comparable_performance, target_column: Q, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: prior_output_comparable_performance } }
        - { output_field_id: detail_R_prior_output_comparable_executed, target_column: R, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: customer_detail, result_field_id: prior_output_comparable_executed } }
      column_mapping:
        - column: A
          template_header: 行业
          semantic_role: industry
        - column: B
          template_header: 广告主
          semantic_role: customer
        - column: C
          template_header_pattern: '{PriorYear}年Q{Quarter}收入'
          semantic_role: prior_year_quarter_revenue
        - column: D
          template_header_pattern: '{CurrentYear}年Q{Quarter}预估'
          semantic_role: current_quarter_forecast
        - column: E
          template_header: 预估同比
          semantic_role: forecast_yoy
        - column: F
          template_header_pattern: '{CurrentYear}年Q{Quarter}截止{AsOfDate}业绩'
          semantic_role: current_qtd_performance_as_of_date
        - column: G
          template_header: 业绩完成率
          semantic_role: performance_completion_rate
        - column: H
          template_header: 业绩同比
          semantic_role: performance_yoy
        - column: I
          template_header: 本周新增业绩
          semantic_role: weekly_incremental_performance
        - column: J
          template_header_pattern: '{CurrentYear}年Q{Quarter}截止{AsOfDate}执行'
          semantic_role: current_qtd_executed_as_of_date
        - column: K
          template_header_pattern: '{PriorYear}年Q{Quarter}截止{AsOfDate}业绩'
          semantic_role: prior_year_qtd_performance_as_of_date
        - column: L
          template_header_pattern: '{PriorYear}年Q{Quarter}截止{AsOfDate}执行'
          semantic_role: prior_year_qtd_executed_as_of_date
        - column: M
          template_header_pattern: '{CurrentYear}年Q{Quarter}截止{PriorWeekAsOfDate}业绩'
          semantic_role: prior_week_qtd_performance_as_of_date
        - column: N
          template_header_pattern: '{CurrentYear}年Q{Quarter}截止{PriorWeekAsOfDate}执行'
          semantic_role: prior_week_qtd_executed_as_of_date
        - column: O
          template_header: 变化原因类型
          semantic_role: variance_reason_type
        - column: P
          template_header: 预算变动原因
          semantic_role: budget_change_reason
        - column: Q
          template_header_pattern: '{PriorYear}年Q{Quarter}截止{PriorComparableAsOfDate}业绩'
          semantic_role: prior_year_comparable_performance_as_of_date
        - column: R
          template_header_pattern: '{PriorYear}年Q{Quarter}截止{PriorComparableAsOfDate}执行'
          semantic_role: prior_year_comparable_executed_as_of_date
      formula_policy:
        formula_cells_are_display_and_audit_mirrors_only: true
        authoritative_values_source: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY.customer_detail
        formulas:
          E: 'IF(D="","",IFERROR(D/C-1,""))'
          G: 'IF(D="","",IFERROR(F/D,""))'
          H: 'IFERROR(F/K-1,"")'
          I_regular_week: F-M
          I_quarter_first_week: F
        mismatch_tolerance: exact_at_full_precision
        mismatch_action: block_output
        output_engine_must_not_invent_or_change_business_values: true
      style_policy:
        clear_inherited_red_manual_cell_fills: true
        preserve_normal_template_style: true
        extend_formula_filter_and_style_to_dynamic_rows: true
        money_display_format: integer_with_thousands_separator
        percentage_display_format: integer_percentage

    - sheet_id: PRIOR_YEAR_TOP20
      sheet_name_pattern: '{PriorYear}年Q{Quarter}收入Top20'
      role: Prior-year quarter customer summary
      result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
      result_record_set_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20 }
      observed_used_range: A1:G22
      observed_column_count: 7
      header_row: 1
      data_start_row: 2
      observed_formula_cells: 0
      output_fields:
        - { output_field_id: prior_top20_A_customer_name, target_column: A, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20, result_field_id: py_top20_customer_name } }
        - { output_field_id: prior_top20_B_prior_year_quarter_revenue, target_column: B, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20, result_field_id: py_top20_prior_year_quarter_revenue } }
        - { output_field_id: prior_top20_C_current_quarter_forecast, target_column: C, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20, result_field_id: py_top20_current_quarter_forecast } }
        - { output_field_id: prior_top20_D_current_qtd_performance, target_column: D, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20, result_field_id: py_top20_current_qtd_performance } }
        - { output_field_id: prior_top20_E_prior_year_qtd_performance, target_column: E, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20, result_field_id: py_top20_prior_year_qtd_performance } }
        - { output_field_id: prior_top20_F_completion_rate, target_column: F, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20, result_field_id: py_top20_completion_rate } }
        - { output_field_id: prior_top20_G_performance_yoy, target_column: G, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: prior_year_top20, result_field_id: py_top20_performance_yoy } }
      columns:
        - A: 广告主
        - B: '{PriorYear}年Q{Quarter}收入'
        - C: '{CurrentYear}年Q{Quarter}预估'
        - D: '{CurrentYear}年Q{Quarter}累计业绩截止{AsOfDate}'
        - E: 去年同期累计业绩
        - F: 业绩完成率
        - G: '截止{AsOfDate}业绩同比'

    - sheet_id: CURRENT_QUARTER_TOP20
      sheet_name_pattern: '{CurrentYear}年Q{Quarter}预估Top20'
      role: Current-quarter estimate customer summary
      result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
      result_record_set_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20 }
      observed_used_range: A1:H22
      observed_column_count: 8
      populated_columns: A:G
      reserved_blank_columns: H
      header_row: 1
      data_start_row: 2
      observed_formula_cells: 0
      output_fields:
        - { output_field_id: forecast_top20_A_customer_name, target_column: A, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20, result_field_id: forecast_top20_customer_name } }
        - { output_field_id: forecast_top20_B_prior_year_quarter_revenue, target_column: B, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20, result_field_id: forecast_top20_prior_year_quarter_revenue } }
        - { output_field_id: forecast_top20_C_current_quarter_forecast, target_column: C, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20, result_field_id: forecast_top20_current_quarter_forecast } }
        - { output_field_id: forecast_top20_D_current_qtd_performance, target_column: D, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20, result_field_id: forecast_top20_current_qtd_performance } }
        - { output_field_id: forecast_top20_E_prior_year_qtd_performance, target_column: E, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20, result_field_id: forecast_top20_prior_year_qtd_performance } }
        - { output_field_id: forecast_top20_F_completion_rate, target_column: F, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20, result_field_id: forecast_top20_completion_rate } }
        - { output_field_id: forecast_top20_G_performance_yoy, target_column: G, result_field_binding: { result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY, record_set_id: forecast_top20, result_field_id: forecast_top20_performance_yoy } }
      columns:
        - A: 广告主
        - B: '{PriorYear}年Q{Quarter}收入'
        - C: '{CurrentYear}年Q{Quarter}预估'
        - D: '{CurrentYear}年Q{Quarter}累计业绩截止{AsOfDate}'
        - E: 去年同期累计业绩
        - F: 业绩完成率
        - G: '截止{AsOfDate}业绩同比'

parameterization:
  required_runtime_parameters:
    - WorkflowExecutionDate
    - CurrentRevenueCutoffDate
    - CurrentYear
    - Quarter
  derived_runtime_parameters:
    - PriorYear
    - AsOfDate
    - PriorWeekAsOfDate
    - PriorComparableAsOfDate
  prior_year_date_rule:
    workflow_year_2026: current cutoff minus one year plus one day
    workflow_year_2027_or_later: block_for_owner_reconfirmation
  missing_required_parameter_action: block_workflow
  date_and_period_header_generation: Use the approved template pattern and validated Workflow parameters.

input_sources:
  status: validated_result_contract_only
  result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
  producer_pipeline_id: PL_CUSTOMER_REVENUE_DETAIL_WEEKLY
  output_mapping_may_read_prior_workbook_directly: false
  note: Current, prior-year, quarter-baseline and prior-output inputs are ingested and validated upstream by the producer Pipeline.

result_record_set_bindings:
  - sheet_id: CUSTOMER_DETAIL_LIST
    result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
    record_set_id: customer_detail
    target_columns: A:R
  - sheet_id: PRIOR_YEAR_TOP20
    result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
    record_set_id: prior_year_top20
    target_columns: A:G
    values_must_be_static: true
  - sheet_id: CURRENT_QUARTER_TOP20
    result_contract_id: RC_CUSTOMER_REVENUE_DETAIL_WEEKLY
    record_set_id: forecast_top20
    target_columns: A:G
    values_must_be_static: true
    header_only_allowed_while_no_forecast_values_exist: true

failure_and_warning_policy:
  input_missing_or_invalid:
    notify_owner: true
    block_workflow: true
    block_scope: WF_CUSTOMER_REVENUE_DETAIL only
    weekly_report_impact: none
  output_generation_failure:
    notify_owner: true
    block_workflow: true
    create_partial_file: false
  blocking_conditions:
    - required_source_missing_unreadable_or_ambiguous
    - previous_reporting_period_validated_output_missing_for_regular_week
    - previous_reporting_period_validated_output_missing_for_quarter_first_week_when_template_unavailable
    - duplicate_customer_result_row
    - reconciliation_outside_absolute_CNY_1
    - required_template_structure_invalid
    - formula_mirror_mismatch
  warning_only_conditions:
    - unmatched_advertiser
    - negative_money_value
    - negative_weekly_incremental_performance
    - absolute_rate_at_least_100_percent
  warning_source: Validated Pipeline notification records
  notification_delivery: Codex task result and local-only exception/run record
  outlook_or_external_message_allowed: false

governance:
  design_assets_complete: true
  code_implementation_authorized: false
  output_mapping_does_not_define_business_rules_or_metric_formulas: true
  workflow_file_dependency_on_weekly_report: false
  customer_data_and_generated_workbooks_must_remain_local_only: true
  outlook_auto_send: not_applicable
  evidence_sources:
    - TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY
