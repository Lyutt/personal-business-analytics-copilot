config_type: customer_revenue_detail_local_input_contracts
bundle_id: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
bundle_version: 1.0.0
status: approved_design_only
workflow_id: WF_CUSTOMER_REVENUE_DETAIL
owner: WORKFLOW_OWNER
context_id: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
quarter_template_eligibility_contract:
  required_metadata_fields:
    template_asset_id: { data_type: string, nullable: false }
    template_version: { data_type: string, nullable: false }
    template_current_year: { data_type: integer, nullable: false }
    template_quarter: { data_type: integer, allowed_values: [1, 2, 3, 4], nullable: false }
    structure_validation_status: { data_type: string, allowed_values: [passed], nullable: false }
  exact_eligibility_match:
    template_asset_id: TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY
    template_version: locked confirmed_template_version
    template_current_year: locked current_year
    template_quarter: locked quarter
    structure_validation_status: passed
  all_conditions_required: true
  bind_eligible_metadata_to_context:
    - { metadata_field_id: template_asset_id, context_field_id: selected_template_asset_id }
    - { metadata_field_id: template_version, context_field_id: selected_template_version }
    - { metadata_field_id: template_current_year, context_field_id: selected_template_current_year }
    - { metadata_field_id: template_quarter, context_field_id: selected_template_quarter }
  mismatch_or_missing_metadata_result: unavailable
  availability_binding_consistency:
    eligible_result: quarter_template_availability must equal available
    ineligible_or_missing_result: quarter_template_availability must equal unavailable
    selected_template_fields_when_unavailable: all null
  unavailable_behavior:
    may_use_as_current_quarter_template: false
    prohibited_inheritance_fields: [C, D, O, P]
    prohibited_inheritance_record_sets: [prior_year_top20, forecast_top20]
    previous_quarter_membership_may_be_frozen_for_current_quarter: false
  filename_parsing_for_eligibility_allowed: false
previous_reporting_period_output_metadata_contract:
  required_metadata_fields:
    workflow_run_id: { data_type: string, nullable: false }
    result_id: { data_type: string, nullable: false }
    reporting_period_id: { data_type: string, nullable: false }
    output_version: { data_type: integer, minimum: 1, nullable: false }
    output_file_reference: { data_type: local_only_opaque_reference, nullable: false }
    validation_status: { data_type: string, allowed_values: [passed], nullable: false }
    completed_at: { data_type: datetime, nullable: false }
  selection_predicates:
    reporting_period_id: exact locked previous_reporting_period_id
    validation_status: passed
    same_reporting_period_as_current_run_allowed: false
    select_highest_output_version: true
    highest_version_must_be_unique: true
  bind_selected_metadata_to_context:
    result_id: selected_previous_output_result_id
    output_version: selected_previous_output_version
    output_file_reference: selected_previous_output_file_reference
  filename_parsing_for_history_selection_allowed: false
  ambiguous_missing_or_invalid_metadata_action: block_customer_workflow
constraints:
  local_file_contents_must_not_enter_git: true
  customer_rows_must_not_enter_metadata: true
  local_paths_must_not_enter_repository_assets: true
  runtime_metadata_field_guessing_allowed: false
