config_type: customer_revenue_detail_local_input_contracts
bundle_id: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
bundle_version: 1.0.0
status: approved_design_only
workflow_id: WF_CUSTOMER_REVENUE_DETAIL
owner: WORKFLOW_OWNER
context_id: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
quarter_template_eligibility_contract:
  candidate_discovery:
    candidate_presence_authority: explicit local current-quarter candidate registration before eligibility validation
    business_key: [template_asset_id, template_current_year, template_quarter]
    candidate_scope: exact locked current_year and quarter
    no_exact_candidate_result: absent
    one_exact_candidate_result: present
    multiple_exact_candidates_action: block_customer_workflow
    filename_or_latest_selection_allowed: false
  required_metadata_fields:
    template_asset_id: { data_type: string, nullable: false }
    template_version: { data_type: string, nullable: false }
    template_current_year: { data_type: integer, nullable: false }
    template_quarter: { data_type: integer, allowed_values: [1, 2, 3, 4], nullable: false }
    template_file_reference: { data_type: local_only_opaque_reference, nullable: false }
    structure_validation_status: { data_type: string, allowed_values: [passed], nullable: false }
  exact_eligibility_match:
    template_asset_id: TEMPLATE_CUSTOMER_REVENUE_DETAIL_LATEST_LOCAL_ONLY
    template_version: locked confirmed_template_version
    template_current_year: locked current_year
    template_quarter: locked quarter
    structure_validation_status: passed
  confirmed_template_version_requirement:
    template_candidate_present: required and exact-match validated
    no_template_candidate: must be null and must not block context initialization
  all_conditions_required: true
  bind_eligible_metadata_to_context:
    - { metadata_field_id: template_asset_id, context_field_id: selected_template_asset_id }
    - { metadata_field_id: template_version, context_field_id: selected_template_version }
    - { metadata_field_id: template_current_year, context_field_id: selected_template_current_year }
    - { metadata_field_id: template_quarter, context_field_id: selected_template_quarter }
    - { metadata_field_id: template_file_reference, context_field_id: selected_template_file_reference }
  candidate_present_invalid_metadata_version_or_structure_action: block_customer_workflow
  candidate_absent_result: unavailable
  availability_binding_consistency:
    eligible_result: quarter_template_availability must equal available
    absent_result: quarter_template_availability must equal unavailable
    invalid_present_candidate_has_no_availability_result: block
    selected_template_fields_when_unavailable: all null including selected_template_file_reference
  unavailable_behavior:
    may_use_as_current_quarter_template: false
    prohibited_inheritance_fields: [C, D, O, P]
    prohibited_inheritance_record_sets: [prior_year_top20, forecast_top20]
    previous_quarter_membership_may_be_frozen_for_current_quarter: false
  filename_parsing_for_eligibility_allowed: false
previous_reporting_period_output_metadata_contract:
  required_metadata_fields:
    workflow_run_id: { data_type: string, nullable: false }
    result_id: { data_type: string, nullable: false }
    reporting_period_id: { data_type: string, nullable: false }
    output_version: { data_type: integer, minimum: 1, nullable: false }
    output_file_reference: { data_type: local_only_opaque_reference, nullable: false }
    validation_status: { data_type: string, allowed_values: [passed], nullable: false }
    completed_at: { data_type: datetime, nullable: false }
    workflow_reporting_date: { data_type: date, nullable: false }
    current_revenue_cutoff_date: { data_type: date, nullable: false }
    prior_comparable_as_of_date: { data_type: date, nullable: false }
    target_fiscal_quarter: { data_type: string, nullable: false }
    history_consumption_status: { data_type: string, allowed_values: [consumable], nullable: false }
  selection_predicates:
    reporting_period_id: exactly equals locked expected_previous_reporting_period_id
    workflow_reporting_date: exactly equals locked expected_previous_reporting_date
    validation_status: passed
    history_consumption_status: consumable
    same_reporting_period_as_current_run_allowed: false
    select_highest_output_version_within_exact_expected_period: true
    selected_highest_version_must_be_unique: true
    derive_expected_period_or_reporting_date_from_selected_metadata: false
    older_reporting_period_fallback_allowed: false
  bind_selected_metadata_to_context:
    result_id: selected_previous_output_result_id
    output_version: selected_previous_output_version
    output_file_reference: selected_previous_output_file_reference
    current_revenue_cutoff_date: selected_previous_output_current_revenue_cutoff_date
    prior_comparable_as_of_date: prior_week_comparable_as_of_date
    target_fiscal_quarter: selected_previous_output_target_fiscal_quarter
  filename_parsing_for_history_selection_allowed: false
  no_exact_expected_output_result:
    regular_week: block_customer_workflow even when an older validated consumable output exists
    quarter_first_week_with_eligible_current_quarter_template: selected previous metadata fields may be null; M_N_Q_R remain blank and I equals F
    quarter_first_week_without_eligible_current_quarter_template: block unless the exact expected prior-quarter output is available for layout customer list and A fallback
  quarter_first_week_exact_previous_output_usage_limit: [layout, customer_membership, detail_A_industry]
  quarter_first_week_previous_output_business_value_usage_allowed: false
  missing_action_when_previous_output_is_required_for_values_or_layout: block_customer_workflow
  ambiguous_invalid_or_unresolvable_metadata_action: block_customer_workflow
  same_period_rerun_behavior: retain the originally locked expected previous reporting date, expected previous reporting period ID, and exact selected output; never reselect an older period
customer_run_input_manifest_contract:
  manifest_id: CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1
  workflow_scope: WF_CUSTOMER_REVENUE_DETAIL
  context_id: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
  required_for_run_types: [scheduled, manual, backfill, rerun]
  one_manifest_per_workflow_run: true
  required_input_roles: [current_qtd, prior_year_full_quarter, prior_year_comparable]
  exactly_one_entry_per_required_input_role: true
  entry_business_key: [workflow_run_id, input_role]
  generated_and_validated_before_stage: DATA_COLLECTION
  required_manifest_fields:
    workflow_run_id: { binding: workflow_run_id, nullable: false }
    run_attempt: { binding: run_attempt, nullable: false }
    run_type: { binding: run_type, nullable: false }
    workflow_id: { constant: WF_CUSTOMER_REVENUE_DETAIL }
    context_id: { constant: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1 }
    dataset_id: { constant: DS_REVENUE_SALES_ROLLING_DECK_QTD }
    dataset_version: { source: approved dataset inventory governance version, nullable: false }
    input_role: { allowed_values: [current_qtd, prior_year_full_quarter, prior_year_comparable] }
    source_instance_reference: { data_type: local_only_opaque_reference, nullable: false }
    reporting_period_id: { binding: reporting_period_id, nullable: false }
    workflow_reporting_date: { binding: workflow_reporting_date, nullable: false, semantics: Workflow period identity date }
    source_report_date: { data_type: date, nullable: false, semantics: email or attachment report date; never a business-data cutoff }
    source_business_data_cutoff_date: { data_type: date, nullable: false, semantics: actual latest business date represented by the bound source instance }
    target_fiscal_quarter: { binding: target_fiscal_quarter, nullable: false }
    prior_year_fiscal_quarter: { binding: prior_year_fiscal_quarter, nullable: false }
    current_revenue_cutoff_date: { binding: current_revenue_cutoff_date, nullable: false }
    prior_comparable_as_of_date: { binding: prior_comparable_as_of_date, nullable: false }
    prior_year_full_quarter_period_id: { binding: prior_year_full_quarter_period_id, nullable: false }
    advertiser_mapping_version: { binding: advertiser_mapping_version, nullable: false }
    validation_status: { allowed_values: [passed], nullable: false }
  exact_role_bindings:
    current_qtd:
      fiscal_quarter_field: target_fiscal_quarter
      other_fields: [reporting_period_id, workflow_reporting_date, source_report_date, source_business_data_cutoff_date]
      context_bindings:
        source_report_date: current_source_report_date
        source_business_data_cutoff_date: current_revenue_cutoff_date
    prior_year_full_quarter:
      fiscal_quarter_field: prior_year_fiscal_quarter
      other_fields: [prior_year_full_quarter_period_id]
    prior_year_comparable:
      fiscal_quarter_field: prior_year_fiscal_quarter
      other_fields: [prior_comparable_as_of_date]
  duplicate_or_missing_required_role_action: block_customer_workflow
  weekly_runtime_contract_reuse_allowed: false
  filename_latest_file_or_execution_date_selection_allowed_for_WF_CUSTOMER_REVENUE_DETAIL: false
  context_mismatch_action: block_customer_workflow
effective_layout_source_contract:
  context_field_id: effective_layout_source
  reference_context_field_id: effective_layout_reference
  deterministic_priority:
    - when: one current-quarter candidate is present and passes exact metadata, version, and structure validation
      value: current_quarter_template
      reference: selected_template_file_reference
    - when: no current-quarter candidate exists and previous_reporting_period_output_metadata_contract returns one validated result
      value: previous_period_output_layout_only
      reference: selected_previous_output_file_reference
  candidate_present_but_invalid_action: block_customer_workflow
  candidate_absent_fallback_allowed: true
  template_version_verification_required_when: effective_layout_source equals current_quarter_template
  template_version_verification_required_when_layout_fallback: false
  previous_period_output_layout_only_reuse:
    allowed: [workbook_structure, workbook_style, customer_membership, detail_A_industry]
    prohibited_detail_fields: [C, D, O, P]
    prohibited_record_sets: [prior_year_top20, forecast_top20]
    prior_quarter_business_values_or_memberships_must_be_rebuilt_or_blank_per_current_context: true
  no_eligible_source_action: block_customer_workflow
  runtime_alternate_layout_selection_allowed: false
local_output_metadata_write_contract:
  write_when: validated local XLSX output succeeds
  required_metadata_fields:
    workflow_run_id: { binding: workflow_run_id, nullable: false }
    result_id: { source: validated result contract instance identifier, nullable: false }
    reporting_period_id: { binding: reporting_period_id, nullable: false }
    output_version: { data_type: integer, minimum: 1, nullable: false }
    output_file_reference: { data_type: local_only_opaque_reference, nullable: false }
    validation_status: { constant: passed }
    completed_at: { data_type: datetime, nullable: false }
    workflow_reporting_date: { binding: workflow_reporting_date, nullable: false }
    current_revenue_cutoff_date: { binding: current_revenue_cutoff_date, nullable: false }
    prior_comparable_as_of_date: { binding: prior_comparable_as_of_date, nullable: false }
    target_fiscal_quarter: { binding: target_fiscal_quarter, nullable: false }
    history_consumption_status: { constant: consumable }
  version_contract:
    output_version_is_authoritative_integer: true
    logical_version_label_mapping:
      1: v1
      2: v2
      3: v3
      n_greater_than_3: vN
    filename_suffix_mapping:
      1: no_suffix
      2: v2
      3: v3
      n_greater_than_3: vN
    next_version_for_same_reporting_period: one plus highest unique passed metadata output_version
    filename_parsing_to_determine_output_version_allowed: false
  next_period_read_contract: previous_reporting_period_output_metadata_contract
  failed_or_partial_output_metadata_write_allowed: false
  transactional_success_contract:
    run_history_success_requires_both_validated_file_and_persisted_metadata: true
    metadata_write_failure_action: [mark_run_not_consumable, block_success_history_registration, notify_owner]
    workbook_may_be_reported_as_next_period_history_when_metadata_write_fails: false
  filesystem_metadata_consistency:
    physical_file_and_metadata_output_version_must_match: true
    existing_physical_file_overwrite_allowed: false
    orphan_physical_file_without_metadata_action: [block_output, notify_owner]
    metadata_without_resolvable_physical_file_action: [block_output, notify_owner]
    duplicate_output_version_action: [block_output, notify_owner]
    collision_next_version_requires_both_filesystem_and_metadata_slot_free: true
  local_only_metadata_no_customer_rows: true
quarter_top20_membership_state_contract:
  state_scope: local_only
  state_business_key: [workflow_id, current_year, quarter, membership_type]
  membership_types: [prior_year_top20, forecast_top20]
  required_state_metadata: [workflow_id, current_year, quarter, membership_type, membership_reference, validation_status, frozen_at, source_type]
  membership_reference_type: local_only_opaque_reference
  validation_status_required: passed
  deterministic_selection_priority:
    - exact current_year and quarter validated frozen membership state
    - eligible current-quarter template membership
    - first confirmed ranking result generated in the current run
  prior_year_membership_first_freeze_allowed: true
  forecast_membership_first_freeze_allowed_only_when: forecast_D_availability equals available
  subsequent_week_or_rerun_reranking_allowed: false
  previous_quarter_membership_reuse_allowed: false
  duplicate_validated_state_for_business_key_action: block_customer_workflow
  state_mismatch_or_unresolvable_reference_action: block_customer_workflow
quarter_top20_membership_state_write_contract:
  write_trigger: no validated state exists for the exact state_business_key and an authoritative first-freeze membership has passed Customer Result Contract validation
  write_timing: after validated membership is fixed and before the run or workbook may become consumable history
  required_write_fields: [workflow_id, current_year, quarter, membership_type, membership_reference, validation_status, frozen_at, source_type, source_workflow_run_id, source_result_id]
  validation_status_written: passed
  first_freeze_source_types: [eligible_current_quarter_template_membership, first_confirmed_ranking]
  atomic_write_required: true
  idempotent_rerun:
    exact_business_key_and_identical_membership_reference: reuse_existing_state_without_second_write
    exact_business_key_and_identical_membership_payload: success
    reranking_or_new_reference_allowed: false
  conflict_contract:
    existing_same_business_key_with_different_membership_reference: block_customer_workflow
    multiple_validated_states_for_business_key: block_customer_workflow
    previous_quarter_state_as_write_target_allowed: false
    notify_owner: true
  write_failure_contract:
    action: [block_customer_workflow_success, mark_output_not_consumable_for_next_period, notify_owner]
    workbook_or_metadata_may_claim_frozen_state: false
    retry_must_reuse_same_locked_membership: true
  local_only_contract:
    storage_scope: local_only
    repository_persistence_allowed: false
    customer_rows_in_state_metadata_allowed: false
    membership_reference_type: local_only_opaque_reference
constraints:
  local_file_contents_must_not_enter_git: true
  customer_rows_must_not_enter_metadata: true
  local_paths_must_not_enter_repository_assets: true
  runtime_metadata_field_guessing_allowed: false
