config_type: customer_revenue_detail_run_context
context_id: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
context_version: 1.0.0
status: approved_design_only
workflow_id: WF_CUSTOMER_REVENUE_DETAIL
owner: WORKFLOW_OWNER
one_context_per_workflow_run: true
lock_policy:
  lock_before_stage: DATA_COLLECTION
  immutable_after_lock: true
  missing_or_conflicting_field_action: block_customer_workflow
required_fields:
  workflow_run_id: { data_type: string, nullable: false }
  run_attempt: { data_type: integer, minimum: 1, nullable: false }
  run_type: { data_type: string, allowed_values: [scheduled, manual, backfill, rerun] }
  workflow_execution_date: { data_type: date, nullable: false }
  current_revenue_cutoff_date: { data_type: date, nullable: false }
  current_year: { data_type: integer, nullable: false }
  prior_year: { data_type: integer, nullable: false }
  quarter: { data_type: integer, allowed_values: [1, 2, 3, 4] }
  target_fiscal_quarter: { data_type: string, pattern_semantics: 'YYYYQ[1-4]', nullable: false, derivation_only: true }
  prior_year_fiscal_quarter: { data_type: string, pattern_semantics: 'YYYYQ[1-4]', nullable: false, derivation_only: true }
  report_mode: { data_type: string, allowed_values: [regular_week, quarter_first_week] }
  reporting_period_id: { data_type: string, nullable: false }
  expected_previous_cutoff: { data_type: date, nullable: false, derivation_only: true }
  expected_previous_reporting_period_id: { data_type: string, nullable: false, derivation_only: true }
  previous_reporting_period_id: { data_type: string, nullable: false, derivation_only: true }
  prior_comparable_as_of_date: { data_type: date, nullable: false }
  prior_year_full_quarter_period_id: { data_type: string, nullable: false }
  quarter_template_candidate_presence: { data_type: string, allowed_values: [present, absent] }
  quarter_template_availability: { data_type: string, allowed_values: [available, unavailable] }
  forecast_D_availability: { data_type: string, allowed_values: [available, unavailable] }
  confirmed_template_version:
    data_type: string
    nullable: true
    required_when: quarter_template_candidate_presence equals present
    must_be_null_when: quarter_template_candidate_presence equals absent
  selected_template_version: { data_type: string, nullable: true }
  selected_template_asset_id: { data_type: string, nullable: true }
  selected_template_current_year: { data_type: integer, nullable: true }
  selected_template_quarter: { data_type: integer, nullable: true }
  selected_template_file_reference: { data_type: local_only_opaque_reference, nullable: true }
  selected_previous_output_result_id: { data_type: string, nullable: true }
  selected_previous_output_version: { data_type: integer, minimum: 1, nullable: true }
  selected_previous_output_file_reference: { data_type: local_only_opaque_reference, nullable: true }
  selected_previous_output_current_revenue_cutoff_date: { data_type: date, nullable: true }
  selected_previous_output_target_fiscal_quarter: { data_type: string, pattern_semantics: 'YYYYQ[1-4]', nullable: true }
  prior_week_comparable_as_of_date: { data_type: date, nullable: true }
  effective_layout_source: { data_type: string, allowed_values: [current_quarter_template, previous_period_output_layout_only], nullable: false }
  effective_layout_reference: { data_type: local_only_opaque_reference, nullable: false }
  advertiser_mapping_version: { data_type: string, nullable: false }
  selected_prior_year_top20_membership_reference: { data_type: local_only_opaque_reference, nullable: true }
  selected_forecast_top20_membership_reference: { data_type: local_only_opaque_reference, nullable: true }
  rerun_of_workflow_run_id: { data_type: string, nullable: true }
derived_field_bindings:
  prior_year:
    source_field_ids: [current_year]
    deterministic_expression: current_year minus 1
    derive_before_context_lock: true
  target_fiscal_quarter:
    source_field_ids: [current_year, quarter]
    deterministic_expression: concatenate current_year, literal Q, and quarter
    output_pattern: 'YYYYQ[1-4]'
    derive_before_context_lock: true
    runtime_code_may_guess_or_rederive_after_lock: false
  prior_year_fiscal_quarter:
    source_field_ids: [prior_year, quarter]
    deterministic_expression: concatenate prior_year, literal Q, and quarter
    output_pattern: 'YYYYQ[1-4]'
    derive_before_context_lock: true
    runtime_code_may_guess_or_rederive_after_lock: false
  reporting_period_id:
    source_field_ids: [target_fiscal_quarter, current_revenue_cutoff_date]
    deterministic_expression: concatenate literal CUSTOMER, target_fiscal_quarter, and ISO current_revenue_cutoff_date with colon separators
    identity_semantics: technical workflow period identity; not an Owner business input
    derive_before_context_lock: true
  report_mode:
    source_field_ids: [current_year, quarter, current_revenue_cutoff_date]
    authoritative_reference: Customer Thursday reporting cadence in Asia/Shanghai
    deterministic_expression: quarter_first_week only when current_revenue_cutoff_date equals the first Thursday on or after the calendar start date of target_fiscal_quarter; otherwise regular_week
    history_output_presence_or_target_quarter_membership_may_influence_mode: false
    derive_before_context_lock: true
  expected_previous_cutoff:
    source_field_ids: [current_revenue_cutoff_date]
    deterministic_expression: current_revenue_cutoff_date minus 7 calendar days under the locked Customer Thursday reporting cadence
    derive_before_context_lock: true
  expected_previous_reporting_period_id:
    source_field_ids: [expected_previous_cutoff]
    deterministic_expression: concatenate literal CUSTOMER, the fiscal quarter containing expected_previous_cutoff, and ISO expected_previous_cutoff with colon separators
    derive_before_context_lock: true
  previous_reporting_period_id:
    source_field_ids: [expected_previous_reporting_period_id]
    deterministic_expression: exact alias of expected_previous_reporting_period_id used as the only permitted previous-output selection key
    older_successful_output_search_or_fallback_allowed: false
    derive_before_context_lock: true
  prior_comparable_as_of_date:
    source_field_ids: [current_revenue_cutoff_date, current_year]
    deterministic_expression: for CurrentYear 2026 only, shift cutoff date back one year and add one calendar day
    unsupported_current_year_action: block_for_owner_confirmation
    derive_before_context_lock: true
  prior_year_full_quarter_period_id:
    source_field_ids: [prior_year, quarter]
    deterministic_expression: concatenate prior_year, literal Q, and quarter
    derive_before_context_lock: true
  prior_week_comparable_as_of_date:
    source_field_ids: [selected_previous_output_result_id]
    deterministic_expression: selected previous output metadata prior_comparable_as_of_date
    null_when: no selected previous output
    derive_before_context_lock: true
deterministic_initialization_contract:
  initialization_deadline: before DATA_COLLECTION
  all_required_and_conditionally_required_fields_resolved_before_lock: true
  reporting_period_id:
    scheduled_source: deterministic technical identity from target_fiscal_quarter and current_revenue_cutoff_date
    manual_or_backfill_source: deterministic technical identity from the four Owner inputs after canonical binding
    rerun_source: original locked Customer Run Context
    execution_date_or_filename_inference_allowed: false
  workflow_execution_date:
    scheduled_source: trigger execution date
    manual_or_backfill_source: explicit canonical workflow_execution_date run parameter
    rerun_source: new attempt execution date while business-period fields remain copied from original locked context
  current_revenue_cutoff_date:
    scheduled_source: exact selected scheduled current_qtd source cutoff
    manual_or_backfill_source: explicit canonical current_revenue_cutoff_date Owner input
    rerun_source: original locked Customer Run Context
  current_year_and_quarter:
    scheduled_source: configured scheduled Customer run parameters validated against the selected current_qtd source
    manual_or_backfill_source: explicit CurrentYear and Quarter Owner inputs
  prior_year: derived from current_year
  report_mode: derived only from whether the locked current cutoff is the actual first Thursday reporting cutoff on or after the target quarter start date
  expected_previous_cutoff: derived independently as current_revenue_cutoff_date minus 7 calendar days
  expected_previous_reporting_period_id: derived independently from expected_previous_cutoff and the fiscal quarter containing that date
  previous_reporting_period_id: exact alias of expected_previous_reporting_period_id; never inferred from available output history
  prior_comparable_as_of_date: derived by the Customer comparable-source rule binding
  prior_year_full_quarter_period_id: derived from prior_year and quarter
  quarter_template_availability:
    source: quarter_template_eligibility_contract result after candidate-presence branching
  quarter_template_candidate_presence:
    source: exact local candidate discovery for locked current_year and quarter
  confirmed_template_version:
    source_when_template_candidate_exists: candidate metadata version confirmed against approved local-only configuration
    required_only_when_candidate_present: true
    unavailable_value: null
  forecast_D_availability:
    source: eligible current-quarter template authoritative D baseline inspection
    available_when: at least one explicit owner-supplied D value exists, including zero
    no_eligible_quarter_template_value: unavailable
  advertiser_mapping_version:
    source: validated local advertiser ownership mapping metadata version
    missing_or_ambiguous_action: block_customer_workflow
  effective_layout_source:
    source: effective_layout_source_contract selection result
  effective_layout_reference:
    source: selected eligible template file reference or validated previous-period output opaque reference
  runtime_code_may_guess_alias_period_file_or_latest_asset: false
prelock_resolution_sequence:
  - bind exactly four manual or backfill Owner parameters, or resolve the scheduled or rerun equivalents
  - derive prior_year, target_fiscal_quarter, prior_year_fiscal_quarter, reporting_period_id, report_mode, expected_previous_cutoff, expected_previous_reporting_period_id, previous_reporting_period_id, prior_comparable_as_of_date, and prior_year_full_quarter_period_id without consulting output history
  - resolve only the exact expected previous-period consumable output metadata when required and bind selected previous dates and prior_week_comparable_as_of_date
  - resolve conditional confirmed_template_version only when a current-quarter template candidate exists
  - validate quarter template metadata and bind eligible selected_template fields
  - validate and select previous reporting period output metadata when required
  - bind selected previous-output metadata fields
  - resolve forecast_D_availability, advertiser_mapping_version, effective_layout_source, and effective_layout_reference
  - select exact current-quarter Top20 frozen membership states or bind the permitted first-freeze source
  - generate and validate the Customer Run Input Manifest against this locked context candidate
  - validate all required consumer Context Bindings
  - lock Customer Run Context before DATA_COLLECTION
postlock_metadata_selection_or_rebinding_allowed: false
consumer_context_bindings:
  BR_CUSTOMER_REVENUE_TECHNICAL_ELIGIBILITY_ADAPTER_V1: [target_fiscal_quarter, prior_year_fiscal_quarter, report_mode]
  BR_CUSTOMER_REVENUE_PRIOR_YEAR_FULL_QUARTER_SOURCE_SELECTION_V1: [current_year, prior_year, quarter, prior_year_full_quarter_period_id, prior_year_fiscal_quarter]
  BR_CUSTOMER_REVENUE_PRIOR_YEAR_COMPARABLE_SOURCE_SELECTION_V1: [current_revenue_cutoff_date, current_year, prior_year, quarter, prior_comparable_as_of_date, prior_year_fiscal_quarter]
  POLICY_CUSTOMER_REVENUE_DETAIL_V1: [workflow_execution_date, current_revenue_cutoff_date, current_year, prior_year, quarter, target_fiscal_quarter, prior_year_fiscal_quarter, report_mode, reporting_period_id, expected_previous_cutoff, expected_previous_reporting_period_id, previous_reporting_period_id, selected_previous_output_target_fiscal_quarter, quarter_template_candidate_presence, quarter_template_availability, forecast_D_availability, confirmed_template_version, advertiser_mapping_version, effective_layout_source, selected_prior_year_top20_membership_reference, selected_forecast_top20_membership_reference]
  CUSTOMER_REVENUE_DETAIL_RUN_INPUT_MANIFEST_V1: [workflow_run_id, run_attempt, run_type, reporting_period_id, current_revenue_cutoff_date, target_fiscal_quarter, prior_year_fiscal_quarter, prior_comparable_as_of_date, prior_year_full_quarter_period_id, advertiser_mapping_version]
  OM_CUSTOMER_REVENUE_DETAIL_EXCEL_V1: [current_revenue_cutoff_date, prior_comparable_as_of_date, selected_previous_output_current_revenue_cutoff_date, prior_week_comparable_as_of_date, effective_layout_source, confirmed_template_version]
manual_parameter_bindings:
  WorkflowExecutionDate: workflow_execution_date
  CurrentRevenueCutoffDate: current_revenue_cutoff_date
  CurrentYear: current_year
  Quarter: quarter
  unmapped_parameter_inference_allowed: false
selection_and_rerun_semantics:
  actual_execution_date_may_infer_business_period: false
  previous_output_period_must_equal: expected_previous_reporting_period_id
  previous_output_cutoff_must_equal: expected_previous_cutoff
  regular_week_missing_exact_previous_output_action: block_customer_workflow
  older_reporting_period_fallback_allowed: false
  same_reporting_period_attempt_may_be_previous_output: false
  same_week_rerun_retains_expected_previous_cutoff: true
  same_week_rerun_retains_expected_previous_reporting_period_id: true
  same_week_rerun_retains_previous_reporting_period_id: true
  same_week_rerun_retains_selected_previous_output: true
  changed_mapping_requires_new_run_context_and_current_week_rerun_only: true
  source_roles_locked_separately:
    F_J: current_qtd
    C: prior_year_full_quarter
    K_L: prior_year_comparable
  scheduled_manual_backfill_and_rerun_dataset_selection_must_use_locked_context: true
constraints:
  local_paths_allowed: false
  customer_rows_allowed: false
  credentials_allowed: false
  external_side_effects_allowed: false
  runtime_field_alias_guessing_allowed: false
