schema_version: "1.0"
asset_type: Pipeline Policy
pipeline_id: PL_CUSTOMER_REVENUE_DETAIL_WEEKLY
policy_id: POLICY_CUSTOMER_REVENUE_DETAIL_V1
approval_status: approved_design_only

scope:
  workflow_id: WF_CUSTOMER_REVENUE_DETAIL
  version: 1.0.0
  authoritative_design: phase1_5/workflows/customer_revenue_detail/WORKFLOW_v1.md
  output_scope: local_only_xlsx
  shared_metric_store_write: false
  cross_workflow_result_contract_publish: false

trigger:
  schedule: { day_of_week: Thursday, start_time: "17:40", timezone: Asia/Shanghai }
  source_wait_policy:
    scheduled_current_qtd:
      initial_missing_action: notify_once
      recheck_interval_minutes: 30
      maximum_rechecks: unlimited
      auto_resume_on_arrival: true
      multiple_or_unreadable_action: block_customer_workflow
    scheduled_historical_C_and_K_L:
      missing_multiple_or_unreadable_action: block_customer_workflow
      wait_or_recheck_allowed: false
    manual_or_backfill_all_roles:
      missing_multiple_or_unreadable_action: block_customer_workflow
      wait_or_recheck_allowed: false
    rerun_locked_roles:
      missing_multiple_or_unreadable_action: block_customer_workflow
      wait_or_recheck_allowed: false
  manual_required_parameters:
    - WorkflowExecutionDate
    - CurrentRevenueCutoffDate
    - CurrentYear
    - Quarter
  prior_year_date_rule:
    workflow_year_2026: current cutoff minus one year plus one day
    workflow_year_2027_or_later: block_for_owner_reconfirmation
  run_context:
    context_id: CUSTOMER_REVENUE_DETAIL_RUN_CONTEXT_V1
    lock_before_data_collection: true
    immutable_after_lock: true
    canonical_field_id_binding_required: true
    target_fiscal_quarter_binding:
      source_field_ids: [current_year, quarter]
      target_field_id: target_fiscal_quarter
      derive_before_lock: true
    prior_year_fiscal_quarter_binding:
      source_field_ids: [prior_year, quarter]
      target_field_id: prior_year_fiscal_quarter
      derive_before_lock: true
    technical_period_identity:
      workflow_reporting_date: exact canonical alias of WorkflowExecutionDate for the target reporting period
      current_source_report_date: exact report date from selected current_qtd email or attachment metadata
      current_revenue_cutoff_date: actual latest revenue business-data date represented by the selected current_qtd source; never derived from Thursday cadence or email report date
      reporting_period_id: derive from target_fiscal_quarter and workflow_reporting_date
      reporting_cadence: weekly Thursday in Asia/Shanghai
      actual_quarter_first_reporting_date: first Thursday on or after the calendar start date of target_fiscal_quarter
      report_mode: quarter_first_week only when workflow_reporting_date equals actual_quarter_first_reporting_date; otherwise regular_week
      report_mode_may_depend_on_available_output_history: false
      expected_previous_reporting_date: workflow_reporting_date minus 7 calendar days
      expected_previous_reporting_period_id: derive from expected_previous_reporting_date and the fiscal quarter containing that date
      previous_reporting_period_id: exact alias of expected_previous_reporting_period_id before metadata selection
      older_successful_output_search_allowed: false
      external_calendar_dependency_allowed: false
    runtime_context_field_guessing_allowed: false

processing:
  technical_filter_and_single_count_rule_id: BR_CUSTOMER_REVENUE_TECHNICAL_ELIGIBILITY_ADAPTER_V1
  prior_year_source_roles:
    C_full_quarter:
      rule_id: BR_CUSTOMER_REVENUE_PRIOR_YEAR_FULL_QUARTER_SOURCE_SELECTION_V1
      input_role: prior_year_full_quarter
      fiscal_quarter_context_field: prior_year_fiscal_quarter
      may_supply_fields: [C]
      may_supply_fields_forbidden: [K, L]
    K_L_comparable_qtd:
      rule_id: BR_CUSTOMER_REVENUE_PRIOR_YEAR_COMPARABLE_SOURCE_SELECTION_V1
      input_role: prior_year_comparable
      fiscal_quarter_context_field: prior_year_fiscal_quarter
      may_supply_fields: [K, L]
      may_supply_fields_forbidden: [C]
  advertiser_mapping:
    external_asset_id: MAP_ADVERTISER_NAME_OWNERSHIP_INDEX
    explicit_field_chain:
      standardized_source_field: advertiser_name
      canonical_raw_field: raw_advertiser_name
      mapping_key_field: raw_advertiser_name
      mapped_output_field: mapped_customer_or_group_name
      result_identity_field: customer_name
    industry_source_field: industry_level_1
    matching: exact_only
    fuzzy_matching_allowed: false
    unmatched_action: temporary_customer_equals_raw_advertiser_and_warn
    unmatched_blocks: false
    rerun_scope_after_mapping_change: current_week_only
    unmatched_advertiser_notification:
      aggregation_grain: one_row_per_raw_advertiser_company_name
      payload_fields:
        - raw_advertiser_company_name
        - temporary_customer_name
        - grouped_current_qtd_performance_F
        - grouped_current_qtd_executed_J
        - advertiser_mapping_version
      payload_source_bindings:
        raw_advertiser_company_name: unmatched standardized advertiser_name
        temporary_customer_name: exact raw advertiser company name fallback
        grouped_current_qtd_performance_F: grouped validated Customer F result
        grouped_current_qtd_executed_J: grouped validated Customer J result
        advertiser_mapping_version: locked advertiser_mapping_version
      prohibited_payload: [raw_order_rows, order_ids, email_content, source_attachment]
      persistence_scope: local_only_exception_or_run_record
      repository_or_shared_log_persistence_allowed: false
  source_record_handling:
    preserve_negative_values: true
    preserve_reversals: true
    preserve_exact_duplicates: true
    additional_deduplication_allowed: false
  row_grain: one_row_per_customer_or_group
  duplicate_result_row_action: block_workflow
  customer_universe: union_of_quarter_baseline_prior_output_current_and_prior_year_results
  retain_zero_customers_through_quarter: true
  industry_selection:
    output_field: A
    authoritative_first_choice:
      source: eligible current-quarter template
      field: industry
      condition: nonblank
    no_template_previous_output_choice:
      condition: effective_layout_source equals previous_period_output_layout_only and customer exists in selected previous output and previous A is nonblank
      source: selected previous output detail A
      action: inherit A directly without rerunning fallback
    fallback_applies_only_when:
      - customer is new relative to selected previous output
      - selected previous output A is blank
    source_fallback_candidate_grain: customer_or_group_and_source_industry
    source_fallback_order:
      - { key: grouped_signed_current_performance_F, direction: descending }
      - { key: grouped_signed_current_executed_J, direction: descending }
      - { key: matches_previous_reporting_period_industry, direction: true_first }
      - { key: industry_name, direction: ascending }
    final_name_order_fallback_notification_required: true
    blank_after_all_candidates: allowed_with_warning
    runtime_tie_break_guessing_allowed: false
  detail_sorting:
    output_record_set: customer_detail
    primary_order: { key: C, direction: descending, signed_numeric_order: true }
    existing_customer_equal_C_tie:
      regular_or_previous_output_available: preserve_previous_reporting_period_row_order
      quarter_first_week_without_previous_output_with_eligible_current_template: preserve_current_quarter_template_row_order
      any_other_runtime_tie_break_allowed: false
    new_customer_equal_C_tie_order:
      - { key: D, direction: descending, blank_position: last }
      - { key: F, direction: descending }
      - { key: customer_name, direction: ascending }
    new_customer_blank_or_zero_C_partition: bottom
    sorting_must_be_deterministic: true
    runtime_sort_key_inference_allowed: false
  missing_current_customer_zero_fill:
    condition: Customer is in the union but has no eligible row in the validated current snapshot.
    F: 0
    J: 0
    missing_or_blank_allowed: false
  forecast_D_semantics:
    availability_source: locked Run Context forecast_D_availability
    available_when: At least one owner-supplied D value, including an explicit zero, is present in the authoritative quarter baseline.
    unavailable_behavior: Preserve D as blank for every customer; do not convert blank to zero.
    formula_E_exception: D remains blank in the Result Contract and output cell, but formula E consumes blank D with Excel numeric zero semantics.
    new_customer_when_available: D equals zero unless an owner-supplied value exists.
    new_customer_when_unavailable: D remains blank.
  quarter_first_week_prior_output_fields: blank_M_N_Q_R
  quarter_first_week_prior_output_dependency:
    template_available: optional
    template_unavailable: required_for_layout_customer_list_and_industry
    template_and_previous_output_both_unavailable: block_customer_workflow
    permitted_previous_output_period: exact expected_previous_reporting_period_id in the immediately preceding quarter
    permitted_previous_output_reuse: [layout, customer_membership, detail_A_industry]
    M_N_Q_R: blank
    I: F
    prior_quarter_business_value_or_top20_reuse_allowed: false
  quarter_template_eligibility:
    local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
    exact_match_required: [template_asset_id, template_version, template_current_year, template_quarter, structure_validation_status]
    context_match: { template_current_year: current_year, template_quarter: quarter, template_version_when_candidate_exists: confirmed_template_version }
    confirmed_template_version_when_no_candidate: null
    no_candidate_result: unavailable_and_layout_fallback_allowed
    candidate_present_invalid_metadata_version_or_structure_action: block_customer_workflow
    previous_quarter_C_D_O_P_inheritance_allowed: false
    previous_quarter_top20_membership_inheritance_allowed: false
    filename_parsing_allowed: false
  quarter_first_week_incremental_performance: I_equals_F
  previous_output_selection:
    local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
    metadata_contract_section: previous_reporting_period_output_metadata_contract
    required_metadata_fields: [workflow_run_id, result_id, reporting_period_id, output_version, output_file_reference, validation_status, completed_at, workflow_reporting_date, current_revenue_cutoff_date, prior_comparable_as_of_date, target_fiscal_quarter, history_consumption_status]
    required_reporting_period_id: locked expected_previous_reporting_period_id
    required_reporting_date: locked expected_previous_reporting_date
    selected_previous_output_business_cutoff_source: selected metadata current_revenue_cutoff_date; no expected-cutoff equality inference
    context_period_identity_is_derived_before_metadata_selection: true
    validation_status: passed
    same_reporting_period_attempt_allowed: false
    unique_highest_output_version_within_exact_expected_period_required: true
    older_reporting_period_fallback_allowed: false
    regular_week_missing_exact_expected_period_action: block_customer_workflow
    quarter_first_week_missing_exact_expected_period_with_eligible_template_action: continue_with_blank_M_N_Q_R_and_I_equal_F
    quarter_first_week_missing_exact_expected_period_without_eligible_template_action: block_customer_workflow
    quarter_first_week_selected_output_usage_limit: [layout, customer_membership, detail_A_industry]
    same_week_rerun_reuses_locked_selection: true
    same_week_rerun_reuses_locked_expected_period_identity: true
    same_week_rerun_must_not_shift_M_N_Q_R: true
    filename_parsing_for_period_or_version_allowed: false
  effective_layout_source:
    local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
    contract_section: effective_layout_source_contract
    locked_context_field: effective_layout_source
    eligible_current_template_priority: first
    no_template_fallback: validated_previous_period_output_layout_only
    previous_output_allowed_reuse: [workbook_structure, workbook_style, customer_membership, detail_A_industry]
    previous_output_prohibited_inheritance: [detail_C, detail_D, detail_O, detail_P, prior_year_top20, forecast_top20]
    runtime_alternate_selection_allowed: false
    invalid_current_quarter_candidate_may_be_treated_as_absent: false
  formulas:
    E: 'IFERROR(D/C-1,"")'
    E_blank_D_numeric_semantics: treat_as_zero
    G: 'IF(D="","",IFERROR(F/D,""))'
    H: 'IFERROR(F/K-1,"")'
    I_regular_week: F-M
    I_quarter_first_week: F
    calculation_precision: full_precision
  top20:
    memberships_independent: true
    freeze_period: quarter
    member_count: 20
    tie_expansion: false
    other_includes_all_remaining_values: true
    ratios_recomputed_after_aggregation: true
    output_cells: static_validated_values_A_to_G
    cross_run_membership_state:
      local_input_contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
      contract_section: quarter_top20_membership_state_contract
      business_key: [workflow_id, current_year, quarter, membership_type]
      selection_priority: [validated_current_quarter_frozen_state, eligible_current_quarter_template_membership, first_confirmed_ranking]
      subsequent_week_or_rerun_reranking_allowed: false
      previous_quarter_membership_reuse_allowed: false
      top20_is_ordinary_layout_inheritance: false
      write_contract_section: quarter_top20_membership_state_write_contract
      first_freeze_write_required_before_consumable_success: true
      same_week_rerun_idempotency: identical state key and membership reference reuses the passed local state without reranking or a second write
      conflict_or_write_failure_action: block_customer_workflow_and_mark_output_not_consumable
      state_persistence_scope: local_only
    existing_template_membership:
      eligibility_prerequisite: quarter_template_eligibility equals available for locked current_year and quarter
      valid_existing_list_is_authoritative: true
      preserve_and_freeze_without_reranking: true
      invalid_or_missing_list_action: generate_by_confirmed_ranking_then_freeze
    prior_year_ranking:
      D_available: [C_desc, D_desc, customer_name_asc]
      D_unavailable: [C_desc, customer_name_asc]
    forecast_ranking:
      D_available: [D_desc, C_desc, customer_name_asc]
      D_unavailable: not_applicable_header_only
    newly_eligible_customer_after_freeze: aggregate_into_Other
    forecast_availability:
      source: locked Run Context forecast_D_availability
      unavailable_output: header_only
      available_output: freeze_20_members_plus_Other
      first_freeze_only_after_D_available: true

failure_handling:
  blocking_conditions:
    - required_source_missing_unreadable_or_ambiguous
    - prior_output_missing_for_regular_week
    - prior_output_missing_when_quarter_first_week_template_unavailable
    - duplicate_customer_result_row
    - reconciliation_outside_absolute_CNY_1
    - required_template_structure_invalid
    - quarter_template_metadata_ineligible_when_template_is_required
    - previous_output_metadata_missing_invalid_or_ambiguous
    - formula_mirror_mismatch
  warning_only_conditions:
    - unmatched_advertiser
    - negative_money_value
    - negative_weekly_incremental_performance
    - absolute_yoy_rate_at_least_100_percent
  warning_field_scope:
    absolute_yoy_rate_at_least_100_percent: [forecast_yoy, performance_yoy, py_top20_performance_yoy, forecast_top20_performance_yoy]
    performance_completion_rate_triggers_absolute_100_percent_warning: false
  partial_file_allowed: false
  weekly_business_report_impact: none

output_boundary:
  calculation_engine_result_is_authoritative: true
  output_mapping_may_calculate_business_values: false
  excel_formula_mirror_columns: [E, G, H, I]
  formula_mirror_mismatch_action: block_output
  formula_mirror_numeric_comparison:
    comparison_algorithm: math_isclose_on_unrounded_numeric_results
    relative_tolerance: 1.0e-12
    absolute_tolerance: 1.0e-9
    pass_condition: absolute_difference_lte_max_of_absolute_tolerance_and_relative_tolerance_times_larger_absolute_operand
    display_rounding_must_not_enter_comparison: true
    blank_error_nan_or_infinity_equivalence: exact_status_match_required
    calculation_failed_or_non_numeric_mirror_action: block_output
    comparison_pass_may_change_authoritative_result: false
  collision_policy: create_next_v_suffix_without_overwrite_and_notify
  local_output_metadata_consistency_contract:
    contract_bundle: CUSTOMER_REVENUE_DETAIL_LOCAL_INPUT_CONTRACTS_V1
    contract_section: local_output_metadata_write_contract
    history_success_requires_validated_file_and_persisted_metadata: true
    physical_file_overwrite_allowed: false
    orphan_file_metadata_failure_or_duplicate_version_action: block_and_notify
  inherited_red_manual_fill_action: clear
  preserve_normal_template_style: true
  outlook_draft: false
  external_message: false

governance:
  customer_data_local_only: true
  raw_order_rows_in_repository_or_logs: false
  code_implementation_authorized: false
  evidence_sources:
    - Owner confirmations dated 2026-08-07
    - phase1_5/workflows/customer_revenue_detail/WORKFLOW_v1.md
