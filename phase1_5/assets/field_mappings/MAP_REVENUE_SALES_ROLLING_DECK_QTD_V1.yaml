    covered_field_path_patterns: []
  unclassified_occurrence_count: 0
  business_value_inference_allowed: false

validation:
  required_standard_fields: []
  field_missing_validation_required: false
  missing_field_behavior: accept_without_validation_failure
  entry_level_required_flags_evaluated: false
  type_validation_required: true
