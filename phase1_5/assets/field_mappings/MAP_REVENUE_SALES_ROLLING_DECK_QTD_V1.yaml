derived_lookup_mapping_requirements:
  - requirement_id: LKP_REVENUE_ADVERTISER_TO_CUSTOMER_GROUP
    input_standard_field_id: advertiser_name
    input_business_meaning: 广告主下单公司名
    output_standard_field_id: customer_name
    output_standard_field_name: 广告主
    output_business_meaning: 经广告主归属映射后的客户/集团名称
    reference_mapping_asset_id: MAP_ADVERTISER_NAME_OWNERSHIP_INDEX
    reference_mapping_contract_version: 1.0.0
    reference_mapping_runtime_version: '${MAP_ADVERTISER_NAME_OWNERSHIP_INDEX_VERSION_LOCAL_ONLY}'
    reference_mapping_runtime_verification_required: true
    reference_mapping_asset_candidate:
      source_path: '${LOCAL_WORKFLOW_DATA_ROOT}\匹配表\广告主名称归属index.csv'
      input_column: A
      input_column_name: 广告主名称
      output_column: C
      output_column_name: 广告主
      review_marker_column: D
      review_marker_column_name: 映射审查标记
      review_marker_value: 可能冲突
      source_encoding: GB18030_or_GBK
      quality_review_status: owner_confirmed_and_cleaned
      quality_review_record: phase1_5/discovery/Advertiser_Name_Ownership_Mapping_Audit_2026-07-30.md
      possible_conflict_review:
        review_record: phase1_5/discovery/Advertiser_Name_Possible_Conflict_Flagging_2026-07-30.md
        flagged_row_count: 4793
        marker_is_advisory: true
        marker_blocks_exact_lookup: false
        automatic_customer_mapping_change_allowed: false
    exact_match_or_normalization_rule:
      source_decode: GB18030_or_GBK
      non_destructive: true
      preserve_source_values: true
      normalization_steps:
        - trim_leading_and_trailing_whitespace
        - remove_leading_and_trailing_carriage_return_or_line_feed
        - unicode_nfkc_compatibility_normalization
      match_method: exact_match_after_normalization
      automatic_fuzzy_or_similarity_matching: false
    unmatched_value_policy:
      temporary_output: retain_original_advertiser_name_as_customer_name
      collect_weekly_unmatched_list: true
      notify_owner: true
      owner_adjustment_overrides_temporary_output: true
      writeback_only_after_owner_confirmation: true
    automatic_name_similarity_matching_allowed: false
    status: owner_confirmed_ready_for_use

standardization_policies:
  text_fields:
    non_destructive: true
    preserve_source_values: true
    normalization_steps:
      - trim_leading_and_trailing_whitespace
      - remove_leading_and_trailing_carriage_return_or_line_feed
    preserve_internal_whitespace: true
    preserve_character_case: true
    preserve_punctuation: true

  source_derived_formula_result_fields:
    applicable_raw_field_inventory_ids:
      - RF018
      - RF019
      - RF022
      - RF042
      - RF043
    ingestion_behavior: read_current_cell_result
    blank_result_handling: preserve_blank_without_missing_field_anomaly
    excel_error_values:
      - '#N/A'
      - '#VALUE!'
      - '#REF!'
      - '#DIV/0!'
      - '#NAME?'
      - '#NUM!'
      - '#NULL!'
    excel_error_handling: mark_data_anomaly_and_continue
    owner_notification_required: false
    agent_formula_recalculation_allowed: false
    pipeline_blocking_behavior: continue

remaining_tbd_classification:
  literal_placeholder_coverage: all_remaining_occurrences
  blocking: []
  runtime-only:
    covered_field_path_patterns: []
  not-required-for-MVP:
    covered_field_path_patterns:
