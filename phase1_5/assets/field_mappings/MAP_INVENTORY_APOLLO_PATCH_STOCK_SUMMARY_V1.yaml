    raw_field_inventory_id: RF001
    raw_field_name: 时间片ID
    standard_field_id: time_slot_id
    standard_field_name: 时间片ID
    standard_data_type: string
    semantic_role: business_identifier
    required: true
    nullable: true
    numeric_cast_allowed: false
    preserve_leading_zeros: true
    text_normalization:
      - trim_leading_and_trailing_whitespace
      - remove_leading_and_trailing_carriage_return_or_line_feed
    mapping_status: owner_confirmed

  - mapping_entry_id: FM002
    raw_field_inventory_id: RF002
    raw_field_name: 时间片
    standard_field_id: time_slot
    standard_field_name: 时间片
    standard_data_type: string
    semantic_role: business_dimension
    required: true
    nullable: true
    text_normalization:
      - trim_leading_and_trailing_whitespace
