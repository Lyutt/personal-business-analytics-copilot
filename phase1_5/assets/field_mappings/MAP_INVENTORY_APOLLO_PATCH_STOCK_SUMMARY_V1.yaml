validation:
  required_standard_fields:
    - period_start_date
    - period_end_date
    - time_slot_id
    - time_slot
    - platform_id
    - platform_name
    - brand_delivery_inventory_quantity
    - disabled_inventory_quantity
    - total_inventory_quantity
    - performance_delivery_inventory_quantity
  all_source_headers_required: true
  missing_source_header_behavior:
    notify_owner: true
    affected_pipeline_id: PL_INVENTORY_PATCH_WEEKLY
    pipeline_behavior: pause_pending_resolution
  result_data_row_validation:
    minimum_data_rows: 1
    failure_behavior:
      notify_owner: true
      affected_pipeline_id: PL_INVENTORY_PATCH_WEEKLY
      pipeline_behavior: pause_pending_resolution
  query_context_validation:
    dates_required: true
    date_format_validation_required: true
    period_order_rule: period_start_date_must_not_be_after_period_end_date
    failure_behavior:
      notify_owner: true
      affected_pipeline_id: PL_INVENTORY_PATCH_WEEKLY
      pipeline_behavior: pause_pending_resolution
  integer_conversion_policy: round_half_up_to_nearest_integer
  unknown_field_validation_required: true
  new_raw_field_policy:
    notify_owner: true
    owner_confirmation_required_before_registration: true
    automatic_registration_allowed: false
    automatic_mapping_allowed: false
    block_confirmed_field_processing: false
    temporary_status: unmapped_new_field
  duplicate_standard_target_allowed: false
  validation_rule_ids: []

standardization_exclusions:
  derived_commercial_ad_inventory_field_created_in_mapping: false
  cpm_conversion_performed_in_mapping: false
  downstream_business_rule_or_metric_reference: >
    品牌与效果投放库存汇总及CPM转换已记录为后续Business Rule/Metric资产候选，
    不属于本Mapping Profile。

governance:
  evidence_required_for_approval: true
  owner_confirmation_required: true
  change_reason: Approved V1 field mapping for Apollo patch inventory CSV
  notes: >
    本Profile只定义CSV字段和查询上下文标准化。源CSV保持不变；非数字库存行
    仅从标准化结果排除。负数与业务键异常不改变Pipeline状态，并在最终周报
    提醒Owner。

constraints:
  profile_cannot_define_metric_formula: true
  profile_cannot_define_business_rule: true
  profile_cannot_create_dataset_or_pipeline_dependency: true
  profile_cannot_auto_approve_unknown_field: true
  profile_must_reference_registered_dataset: true
