config_type: field_mapping_profile
mapping_profile_id: MAP_INVENTORY_APOLLO_PATCH_STOCK_SUMMARY_V1
mapping_profile_name: Apollo贴片广告库存字段映射
dataset_id: DS_INVENTORY_APOLLO_PATCH_STOCK_SUMMARY
dataset_version_constraint: TBD
source_id: SRC_INTERNAL_PLATFORM_APOLLO
query_asset_id: QRY_APOLLO_INVENTORY_PATCH_STOCK
business_domains:
  - Inventory
owner: WORKFLOW_OWNER
business_approver: WORKFLOW_OWNER
version: 1.0.0
approval_status: approved
effective_from: 2026-07-30
approval_record:
  approved_by: WORKFLOW_OWNER
  approved_at: 2026-07-30
  approval_scope: Patch inventory CSV schema and P0 Field Mapping
  approval_note: Owner confirmed all eight mappings and readiness handling

scope:
  asset_scope: Entire exported CSV result file
  source_object_or_sheet: Apollo贴片库存计算CSV结果
  source_header_row: 1
  header_structure: Single row
  source_encoding: UTF-8 BOM
  expected_raw_field_count: 8
  mapped_field_count: 8
  query_context_field_count: 2
  record_grain_reference: Dataset Inventory

evidence:
  evidence_sources:
    - '${LOCAL_WORKFLOW_DATA_ROOT}\数据查询-库存-库存 - 2026-07-30T211633.873.csv'
    - phase1_5/discovery/DS_INVENTORY_APOLLO_PATCH_STOCK_SUMMARY_Field_Structure_Inspection.md
  inspected_sample_count: 1
  sample_periods:
    - TBD
  schema_observation_status: completed

source_file_attribution:
  owner_confirmed_query_template: 贴片库存计算
  downloaded_filename_is_dataset_identifier: false
  required_attribution_context:
    - query_asset_id
    - query_template
    - dataset_id
    - query_execution_context
  automatic_attribution_by_filename_allowed: false
  automatic_attribution_by_schema_similarity_allowed: false

source_schema:
  structure_type: CSV table
  observed_used_range: A1:H213
  observed_data_row_count: 212
  expected_field_count: 8
  field_order_is_contractual: false
  mapped_field_match_method: exact_header_name_after_trim_and_bom_removal
  utf8_bom_header_handling: remove_bom_before_header_matching
  missing_required_field_policy: notify_owner_and_pause_affected_pipeline
  unknown_source_field_policy: notify_and_request_owner_confirmation_without_blocking
  zero_data_row_policy: notify_owner_and_pause_affected_pipeline

record_identity:
  business_unique_key:
    - time_slot_id
    - platform_id
  cross_period_contextual_key:
    - period_start_date
    - period_end_date
    - time_slot_id
    - platform_id
  automatic_key_inference_allowed: false
  blank_or_duplicate_key_handling:
    retain_all_records: true
    automatic_deduplication_allowed: false
    pipeline_status_change: none
    pipeline_blocking_behavior: continue
    owner_notification_timing: final_weekly_report_output

raw_field_inventory:
  - {raw_field_inventory_id: RF001, raw_column_position_observed: 1, raw_field_name: 时间片ID, observed_raw_storage_type: text_identifier, source_value_origin: query_export, mapping_status: mapped}
  - {raw_field_inventory_id: RF002, raw_column_position_observed: 2, raw_field_name: 时间片, observed_raw_storage_type: text, source_value_origin: query_export, mapping_status: mapped}
  - {raw_field_inventory_id: RF003, raw_column_position_observed: 3, raw_field_name: 平台ID, observed_raw_storage_type: text_identifier, source_value_origin: query_export, mapping_status: mapped}
  - {raw_field_inventory_id: RF004, raw_column_position_observed: 4, raw_field_name: 平台, observed_raw_storage_type: text, source_value_origin: query_export, mapping_status: mapped}
  - {raw_field_inventory_id: RF005, raw_column_position_observed: 5, raw_field_name: 品牌商广整体投放库存, observed_raw_storage_type: formatted_integer, source_value_origin: query_export, mapping_status: mapped}
  - {raw_field_inventory_id: RF006, raw_column_position_observed: 6, raw_field_name: 禁用库存, observed_raw_storage_type: formatted_integer, source_value_origin: query_export, mapping_status: mapped}
  - {raw_field_inventory_id: RF007, raw_column_position_observed: 7, raw_field_name: 库存, observed_raw_storage_type: formatted_integer, source_value_origin: query_export, mapping_status: mapped}
  - {raw_field_inventory_id: RF008, raw_column_position_observed: 8, raw_field_name: 效果商广投放库存, observed_raw_storage_type: formatted_integer, source_value_origin: query_export, mapping_status: mapped}

query_context_fields:
  - context_field_id: QCF001
    source_parameter_name: start_date
    standard_field_id: period_start_date
    standard_field_name: 统计开始日期
    standard_data_type: date
    semantic_role: query_context_period_start
    required: true
    nullable: false
    output_format: YYYY-MM-DD
    invalid_value_handling: notify_owner_and_pause_affected_pipeline
    value_source: explicit_query_parameter

  - context_field_id: QCF002
    source_parameter_name: end_date
    standard_field_id: period_end_date
    standard_field_name: 统计结束日期
    standard_data_type: date
    semantic_role: query_context_period_end
    required: true
    nullable: false
    output_format: YYYY-MM-DD
    invalid_value_handling: notify_owner_and_pause_affected_pipeline
    value_source: explicit_query_parameter

field_mappings:
