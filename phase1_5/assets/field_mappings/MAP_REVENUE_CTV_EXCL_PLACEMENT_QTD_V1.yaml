validation:
  required_standard_fields:
    - order_id
    - qtd_executed_revenue_amount
    - qtd_signed_amount
    - qtd_ctv_signed_amount
  p0_source_header_validation_required: true
  missing_p0_source_header_behavior:
    notify_owner: true
    affected_pipeline_id: PL_REVENUE_CTV_WEEKLY
    pipeline_behavior: pause_pending_resolution
  type_validation_required: true
  order_id_quality_validation:
    blank_check: true
    duplicate_check: true
    retain_all_records: true
    automatic_deduplication_allowed: false
    pipeline_status_on_anomaly: COMPLETED_WITH_WARNING
    pipeline_blocking_behavior: continue
    owner_notification_required: true
  unknown_field_validation_required: true
  new_raw_field_policy:
    notify_owner: true
    owner_confirmation_required_before_registration: true
    automatic_registration_allowed: false
    automatic_mapping_allowed: false
    block_confirmed_field_processing: false
    temporary_status: unmapped_new_field
  duplicate_standard_target_allowed: false
  validation_rule_ids: []

governance:
  evidence_required_for_approval: true
  owner_confirmation_required: true
  change_reason: Approved V1 field mapping for Weekly Business Report P0 fields
  notes: >
    Dataset保留完整Sheet0原始结构。v1仅映射订单ID及三个当前周报金额字段；
    其余25个字段不参与当前标准化计算。订单ID异常保留记录并形成警告；
    P0表头缺失或P0金额字段存在非空非数字值时通知Owner并暂停受影响Pipeline。

constraints:
  profile_cannot_define_metric_formula: true
  profile_cannot_define_business_rule: true
  profile_cannot_create_dataset_or_pipeline_dependency: true
  profile_cannot_auto_approve_unknown_field: true
  profile_must_reference_registered_dataset: true
