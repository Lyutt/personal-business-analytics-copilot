field_mappings:
  - mapping_entry_id: FM001
    raw_field_inventory_id: RF001
    raw_field_name: 订单ID
    raw_field_position: A
    standard_field_id: order_id
    standard_field_name: 订单ID
    standard_data_type: string
    semantic_role: business_identifier
    required: true
    nullable: true
    ingestion_behavior: preserve_source_text
    numeric_cast_allowed: false
    preserve_leading_zeros: true
    text_normalization:
      - trim_leading_and_trailing_whitespace
      - remove_leading_and_trailing_carriage_return_or_line_feed
    preserve_internal_characters: true
    blank_or_duplicate_handling: retain_record_and_warn
    mapping_status: owner_confirmed

  - mapping_entry_id: FM002
    raw_field_inventory_id: RF025
    raw_field_name: 已执行收入(季度)
    raw_field_position: Y
    standard_field_id: qtd_executed_revenue_amount
    standard_field_name: QTD已执行金额
    standard_data_type: decimal
    semantic_role: monetary_measure
    period_semantics: current_quarter_cumulative_as_of_dataset_cutoff
    required: true
    nullable: false
    unit: CNY_yuan
    blank_value_handling: replace_with_zero
    blank_value_default: 0
    invalid_nonblank_numeric_handling: notify_owner_and_pause_pipeline
    affected_pipeline_id: PL_REVENUE_CTV_WEEKLY
    mapping_status: owner_confirmed

  - mapping_entry_id: FM003
    raw_field_inventory_id: RF027
    raw_field_name: 总收入(季度)
    raw_field_position: AA
    standard_field_id: qtd_signed_amount
    standard_field_name: QTD签单金额
    standard_data_type: decimal
    semantic_role: monetary_measure
    period_semantics: current_quarter_cumulative_as_of_dataset_cutoff
    required: true
    nullable: false
    unit: CNY_yuan
    blank_value_handling: replace_with_zero
    blank_value_default: 0
    invalid_nonblank_numeric_handling: notify_owner_and_pause_pipeline
    affected_pipeline_id: PL_REVENUE_CTV_WEEKLY
    mapping_status: owner_confirmed

  - mapping_entry_id: FM004
    raw_field_inventory_id: RF028
    raw_field_name: TV总金额(季度)
    raw_field_position: AB
    standard_field_id: qtd_ctv_signed_amount
    standard_field_name: QTD CTV签单金额
    standard_data_type: decimal
    semantic_role: monetary_measure
    period_semantics: current_quarter_cumulative_as_of_dataset_cutoff
    required: true
    nullable: false
    unit: CNY_yuan
    blank_value_handling: replace_with_zero
    blank_value_default: 0
    invalid_nonblank_numeric_handling: notify_owner_and_pause_pipeline
    affected_pipeline_id: PL_REVENUE_CTV_WEEKLY
    mapping_status: owner_confirmed

